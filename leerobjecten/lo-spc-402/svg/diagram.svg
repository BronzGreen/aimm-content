<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">DMAIC — vijf-stappen verbetercyclus voor bestaande processen</title>
  <desc id="desc">Een gesloten lus met de vijf DMAIC-fasen op een cirkel: Define bovenaan, Measure rechtsboven, Analyze rechtsonder, Improve linksonder, Control linksboven. Pijlen lopen met de klok mee van fase naar fase. Een extra terugloop-pijl van Control terug naar Define toont dat DMAIC een herhaalbare verbetercyclus is. Per fase staat de centrale vraag (bijvoorbeeld Define vraagt 'Wat is het probleem?') en één tot twee kerntools (zoals SIPOC en charter voor Define, controlekaart en Cpk voor Measure, visgraat en Pareto voor Analyze, pilot en DOE voor Improve, control plan en SPC-bewaking voor Control). In het midden staat het centrale principe: meten, analyseren, veranderen, borgen — geen stap overslaan. Onder de cyclus een korte interpretatieregel met het spuitgiet-referentievoorbeeld waarin afkeur van 1,2 procent zakte naar 0,28 procent in vier maanden door dit traject te volgen.</desc>

  <defs>
    <linearGradient id="grad-define" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="grad-measure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <linearGradient id="grad-analyze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#8E44AD"/>
    </linearGradient>
    <linearGradient id="grad-improve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <linearGradient id="grad-control" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="grad-center" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow-define" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#2980B9"/>
    </marker>
    <marker id="arrow-measure" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#D35400"/>
    </marker>
    <marker id="arrow-analyze" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#8E44AD"/>
    </marker>
    <marker id="arrow-improve" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#27AE60"/>
    </marker>
    <marker id="arrow-loop" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="960" height="760" fill="#F8F6F0"/>

  <!-- Titel -->
  <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#2C3E50" letter-spacing="1">DMAIC — vijf-stappen verbetercyclus</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#7f8c8d" font-style="italic" letter-spacing="0.5">Voor bestaande processen die niet voldoen — meten, analyseren, veranderen, borgen</text>

  <!-- Achtergrond-cirkel (pad van de cyclus) -->
  <circle role="presentation" cx="480" cy="410" r="240" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Pijlen tussen fasen (met de klok mee) -->
  <!-- Define (boven, 480,170) → Measure (rechtsboven, 708,310) -->
  <path d="M 555,205 Q 660,225 685,290" fill="none" stroke="#2980B9" stroke-width="2.5" marker-end="url(#arrow-define)"/>

  <!-- Measure (708,310) → Analyze (rechtsonder, 622,560) -->
  <path d="M 712,388 Q 720,495 660,548" fill="none" stroke="#D35400" stroke-width="2.5" marker-end="url(#arrow-measure)"/>

  <!-- Analyze (622,560) → Improve (linksonder, 338,560) -->
  <path d="M 555,602 Q 480,640 405,602" fill="none" stroke="#8E44AD" stroke-width="2.5" marker-end="url(#arrow-analyze)"/>

  <!-- Improve (338,560) → Control (linksboven, 252,310) -->
  <path d="M 300,548 Q 240,495 248,388" fill="none" stroke="#27AE60" stroke-width="2.5" marker-end="url(#arrow-improve)"/>

  <!-- Control (252,310) → Define (boven, 480,170) -->
  <path d="M 275,290 Q 300,225 405,205" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrow-define)"/>

  <!-- ─────────── DEFINE (boven) ─────────── -->
  <g filter="url(#shadow)">
    <circle cx="480" cy="170" r="78" fill="url(#grad-define)"/>
  </g>
  <text x="480" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="white" letter-spacing="2">DEFINE</text>
  <text x="480" y="180" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Wat is het probleem?</text>
  <text x="480" y="196" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)" font-style="italic">SIPOC · charter</text>
  <!-- Nummering -->
  <circle cx="420" cy="120" r="16" fill="#1F2937"/>
  <text x="420" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="white">1</text>

  <!-- ─────────── MEASURE (rechtsboven) ─────────── -->
  <g filter="url(#shadow)">
    <circle cx="708" cy="310" r="78" fill="url(#grad-measure)"/>
  </g>
  <text x="708" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="white" letter-spacing="2">MEASURE</text>
  <text x="708" y="320" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Wat is de baseline?</text>
  <text x="708" y="336" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)" font-style="italic">SPC · Cpk · Gage R&amp;R</text>
  <!-- Nummering -->
  <circle cx="785" cy="262" r="16" fill="#1F2937"/>
  <text x="785" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="white">2</text>

  <!-- ─────────── ANALYZE (rechtsonder) ─────────── -->
  <g filter="url(#shadow)">
    <circle cx="622" cy="560" r="78" fill="url(#grad-analyze)"/>
  </g>
  <text x="622" y="550" text-anchor="middle" font-size="19" font-weight="700" fill="white" letter-spacing="2">ANALYZE</text>
  <text x="622" y="570" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Wat is de oorzaak?</text>
  <text x="622" y="586" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)" font-style="italic">visgraat · Pareto · 5-Why</text>
  <!-- Nummering -->
  <circle cx="700" cy="608" r="16" fill="#1F2937"/>
  <text x="700" y="613" text-anchor="middle" font-size="13" font-weight="700" fill="white">3</text>

  <!-- ─────────── IMPROVE (linksonder) ─────────── -->
  <g filter="url(#shadow)">
    <circle cx="338" cy="560" r="78" fill="url(#grad-improve)"/>
  </g>
  <text x="338" y="550" text-anchor="middle" font-size="19" font-weight="700" fill="white" letter-spacing="2">IMPROVE</text>
  <text x="338" y="570" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Wat lost het op?</text>
  <text x="338" y="586" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)" font-style="italic">pilot · DOE · standaardwerk</text>
  <!-- Nummering -->
  <circle cx="260" cy="608" r="16" fill="#1F2937"/>
  <text x="260" y="613" text-anchor="middle" font-size="13" font-weight="700" fill="white">4</text>

  <!-- ─────────── CONTROL (linksboven) ─────────── -->
  <g filter="url(#shadow)">
    <circle cx="252" cy="310" r="78" fill="url(#grad-control)"/>
  </g>
  <text x="252" y="300" text-anchor="middle" font-size="19" font-weight="700" fill="white" letter-spacing="2">CONTROL</text>
  <text x="252" y="320" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Hoe borgen we het?</text>
  <text x="252" y="336" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)" font-style="italic">control plan · SPC · audit</text>
  <!-- Nummering -->
  <circle cx="175" cy="262" r="16" fill="#1F2937"/>
  <text x="175" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="white">5</text>

  <!-- ─────────── CENTRAAL ELEMENT ─────────── -->
  <g filter="url(#shadow)">
    <circle cx="480" cy="410" r="92" fill="url(#grad-center)"/>
  </g>
  <text x="480" y="392" text-anchor="middle" font-size="22" font-weight="700" fill="white" letter-spacing="3">DMAIC</text>
  <text x="480" y="412" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">meten · analyseren</text>
  <text x="480" y="426" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">veranderen · borgen</text>
  <text x="480" y="448" text-anchor="middle" font-size="9" fill="#FFD700" font-weight="600">geen stap overslaan</text>

  <!-- ─────────── ITERATIE-INDICATOR ─────────── -->
  <!-- Kleine ronde pijl bij Control die toont dat na borging een nieuwe cyclus kan starten -->
  <g transform="translate(140,160)">
    <path d="M 0,30 Q -15,15 0,0 Q 15,15 30,0" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 30,0 L 25,-4 M 30,0 L 25,5" stroke="#7f8c8d" stroke-width="2" fill="none"/>
    <text x="15" y="50" text-anchor="middle" font-size="10" fill="#7f8c8d" font-style="italic">cyclus herhaalbaar</text>
    <text x="15" y="63" text-anchor="middle" font-size="10" fill="#7f8c8d" font-style="italic">voor volgende verbetering</text>
  </g>

  <!-- ─────────── REFERENTIE-VOORBEELD (onderbalk) ─────────── -->
  <g>
    <rect role="presentation" x="60" y="680" width="840" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="80" y="702" font-size="12" font-weight="700" fill="#2C3E50">Referentievoorbeeld:</text>
    <text x="220" y="702" font-size="12" fill="#374151">Spuitgietlijn met 1,2% afkeur op onderdeelgewicht. DMAIC-traject van 4 maanden.</text>
    <text x="80" y="720" font-size="11" fill="#6B7280" font-style="italic">D: charter €40k besparing · M: baseline + Gage R&amp;R · A: visgraat → 3 oorzaken · I: DOE 8 runs → pilot 0,4% · C: SPC + audit. Resultaat: 0,28% structureel.</text>
  </g>

  <!-- Bronvermelding -->
  <text x="480" y="748" text-anchor="middle" font-size="9" fill="#999">Bron: ASQ DMAIC-definitie · Pyzdek 'Six Sigma Handbook' · ko-spc-402 · AIMM SPC Module 3 — Op Maat</text>
</svg>
