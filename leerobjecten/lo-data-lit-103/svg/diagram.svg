<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 500"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Drie checks voor datakwaliteit</title>
  <desc id="desc">Een diagram met drie opbouwende treden die de drie checks voor datakwaliteit tonen: volledigheid (is alles er?), consistentie (klopt het met elkaar?) en actualiteit (is het vers genoeg?). Samen vormen ze de basis voor betrouwbare data.</desc>

  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="grad-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#3498DB"/>
    </linearGradient>
    <linearGradient id="grad-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="grad-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#1A5276"/>
    </linearGradient>
    <linearGradient id="grad-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27AE60"/>
      <stop offset="100%" stop-color="#1E8449"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="800" height="500" fill="#FAFAF8"/>

  <!-- Titel -->
  <text x="400" y="42" text-anchor="middle" font-size="22"
        font-weight="700" fill="#2C3E50" letter-spacing="1">Drie checks voor datakwaliteit</text>
  <text x="400" y="64" text-anchor="middle" font-size="13"
        fill="#7f8c8d" letter-spacing="0.5">Kun je deze data vertrouwen?</text>

  <!-- Verticale pijl links -->
  <line x1="60" y1="420" x2="60" y2="110" stroke="#BDC3C7"
        stroke-width="2" marker-end="url(#arrow)"/>
  <text x="45" y="265" text-anchor="middle" font-size="12" font-weight="600"
        fill="#7f8c8d" transform="rotate(-90,45,265)">Meer vertrouwen</text>

  <!-- Trede 1: Volledigheid (onderste) -->
  <g filter="url(#shadow)">
    <rect x="100" y="330" width="180" height="90" rx="8" fill="url(#grad-1)"/>
    <text x="190" y="362" text-anchor="middle" font-size="16"
          font-weight="700" fill="white">Volledigheid</text>
    <text x="190" y="383" text-anchor="middle" font-size="12"
          fill="rgba(255,255,255,0.85)">Is alles er?</text>
    <text x="190" y="405" text-anchor="middle" font-size="10"
          fill="rgba(255,255,255,0.7)">Geen lege velden of</text>
    <text x="190" y="417" text-anchor="middle" font-size="10"
          fill="rgba(255,255,255,0.7)">missende metingen</text>
  </g>

  <!-- V-label -->
  <text x="190" y="316" text-anchor="middle" font-size="28"
        font-weight="800" fill="#5DADE2" opacity="0.3">V</text>

  <!-- Trede 2: Consistentie (midden) -->
  <g filter="url(#shadow)">
    <rect x="300" y="230" width="180" height="90" rx="8" fill="url(#grad-2)"/>
    <text x="390" y="262" text-anchor="middle" font-size="16"
          font-weight="700" fill="white">Consistentie</text>
    <text x="390" y="283" text-anchor="middle" font-size="12"
          fill="rgba(255,255,255,0.85)">Klopt het met elkaar?</text>
    <text x="390" y="305" text-anchor="middle" font-size="10"
          fill="rgba(255,255,255,0.7)">Zelfde eenheden en</text>
    <text x="390" y="317" text-anchor="middle" font-size="10"
          fill="rgba(255,255,255,0.7)">logische waarden</text>
  </g>

  <!-- C-label -->
  <text x="390" y="216" text-anchor="middle" font-size="28"
        font-weight="800" fill="#3498DB" opacity="0.3">C</text>

  <!-- Trede 3: Actualiteit (bovenste) -->
  <g filter="url(#shadow)">
    <rect x="500" y="130" width="180" height="90" rx="8" fill="url(#grad-3)"/>
    <text x="590" y="162" text-anchor="middle" font-size="16"
          font-weight="700" fill="white">Actualiteit</text>
    <text x="590" y="183" text-anchor="middle" font-size="12"
          fill="rgba(255,255,255,0.85)">Is het vers genoeg?</text>
    <text x="590" y="205" text-anchor="middle" font-size="10"
          fill="rgba(255,255,255,0.7)">Recent bijgewerkt</text>
    <text x="590" y="217" text-anchor="middle" font-size="10"
          fill="rgba(255,255,255,0.7)">voor jouw beslissing</text>
  </g>

  <!-- A-label -->
  <text x="590" y="116" text-anchor="middle" font-size="28"
        font-weight="800" fill="#2980B9" opacity="0.3">A</text>

  <!-- Verbindingslijnen tussen treden -->
  <line x1="280" y1="375" x2="300" y2="320" stroke="#BDC3C7"
        stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="480" y1="275" x2="500" y2="220" stroke="#BDC3C7"
        stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Resultaat-blok (bovenaan rechts) -->
  <g filter="url(#shadow)">
    <rect x="580" y="80" width="180" height="36" rx="18" fill="url(#grad-top)"/>
    <text x="670" y="103" text-anchor="middle" font-size="13"
          font-weight="700" fill="white">Betrouwbare data</text>
  </g>

  <!-- Pijl van trede 3 naar resultaat -->
  <line x1="635" y1="130" x2="655" y2="116" stroke="#27AE60"
        stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ezelsbruggetje onderaan -->
  <rect role="presentation" x="100" y="445" width="600" height="35" rx="6" fill="#EFF6FF"/>
  <text x="400" y="468" text-anchor="middle" font-size="13" fill="#2C3E50">
    <tspan font-weight="700" fill="#3498DB">V</tspan>
    <tspan fill="#2C3E50">olledig </tspan>
    <tspan fill="#7f8c8d">+ </tspan>
    <tspan font-weight="700" fill="#3498DB">C</tspan>
    <tspan fill="#2C3E50">onsistent </tspan>
    <tspan fill="#7f8c8d">+ </tspan>
    <tspan font-weight="700" fill="#3498DB">A</tspan>
    <tspan fill="#2C3E50">ctueel </tspan>
    <tspan fill="#7f8c8d">= </tspan>
    <tspan font-weight="700" fill="#27AE60">betrouwbaar</tspan>
  </text>

  <!-- Bronvermelding -->
  <text x="400" y="495" text-anchor="middle"
        font-size="10" fill="#999">AIMM Data Literacy - Datakwaliteit | Module 1: Gebruik</text>
</svg>
