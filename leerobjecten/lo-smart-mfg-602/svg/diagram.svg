<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <title>Het universele architectuurpatroon van AI-camerasystemen</title>

  <defs>
    <marker id="arrowbig" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5490"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5352f"/>
    </marker>
  </defs>

  <!-- Titel -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">
    Het patroon van elk AI-camerasysteem
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#555">
    Vier zichtbare stappen + één onzichtbare
  </text>

  <!-- Vier hoofdblokken -->
  <g>
    <rect x="60" y="120" width="160" height="100" rx="8" fill="#fff4d6" stroke="#d4a017" stroke-width="2.5"/>
    <text x="140" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">CAMERA</text>
    <text x="140" y="180" text-anchor="middle" font-size="12" fill="#555">Lens boven de band</text>
    <text x="140" y="198" text-anchor="middle" font-size="12" fill="#555">Maakt een foto</text>
  </g>

  <g>
    <rect x="270" y="120" width="160" height="100" rx="8" fill="#e0f0e3" stroke="#2c5f2d" stroke-width="2.5"/>
    <text x="350" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">BEELD</text>
    <text x="350" y="180" text-anchor="middle" font-size="12" fill="#555">Ruwe digitale foto</text>
    <text x="350" y="198" text-anchor="middle" font-size="12" fill="#555">gaat naar model</text>
  </g>

  <g>
    <rect x="480" y="120" width="160" height="100" rx="8" fill="#d9e8f5" stroke="#1a5490" stroke-width="2.5"/>
    <text x="560" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">MODEL</text>
    <text x="560" y="180" text-anchor="middle" font-size="12" fill="#555">AI kijkt en oordeelt</text>
    <text x="560" y="198" text-anchor="middle" font-size="12" fill="#555">goed of defect</text>
  </g>

  <g>
    <rect x="690" y="120" width="160" height="100" rx="8" fill="#f3e0f0" stroke="#7a3b82" stroke-width="2.5"/>
    <text x="770" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">BESLISSING</text>
    <text x="770" y="180" text-anchor="middle" font-size="12" fill="#555">Afkeuren, alarm,</text>
    <text x="770" y="198" text-anchor="middle" font-size="12" fill="#555">of aanpassen</text>
  </g>

  <!-- Grote pijlen tussen -->
  <line x1="225" y1="170" x2="265" y2="170" stroke="#1a5490" stroke-width="3" marker-end="url(#arrowbig)"/>
  <line x1="435" y1="170" x2="475" y2="170" stroke="#1a5490" stroke-width="3" marker-end="url(#arrowbig)"/>
  <line x1="645" y1="170" x2="685" y2="170" stroke="#1a5490" stroke-width="3" marker-end="url(#arrowbig)"/>

  <!-- Onzichtbare trainingsdata-box -->
  <g>
    <rect x="370" y="330" width="260" height="80" rx="8" fill="#ffe4e1" stroke="#b5352f" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="500" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">TRAININGSDATA</text>
    <text x="500" y="382" text-anchor="middle" font-size="12" fill="#555">Gelabelde foto's — de onzichtbare vijfde stap</text>
    <text x="500" y="400" text-anchor="middle" font-size="11" fill="#b5352f" font-style="italic">Eenmalig vóór het systeem live gaat</text>
  </g>

  <!-- Pijl van trainingsdata naar model -->
  <path d="M 500 328 Q 540 280 560 225" fill="none" stroke="#b5352f" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <text x="615" y="290" font-size="11" fill="#b5352f" font-style="italic">maakt het model</text>

  <!-- Faalpunten onderaan -->
  <g>
    <text x="450" y="465" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">
      Waar kan het stuk? Vijf vragen, één per vakje.
    </text>
  </g>

  <g>
    <text x="140" y="495" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Camera</text>
    <text x="140" y="513" text-anchor="middle" font-size="10" fill="#555">Hoe vaak wordt</text>
    <text x="140" y="527" text-anchor="middle" font-size="10" fill="#555">de lens schoongemaakt?</text>
  </g>

  <g>
    <text x="300" y="495" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Beeld</text>
    <text x="300" y="513" text-anchor="middle" font-size="10" fill="#555">Zien wij dezelfde foto</text>
    <text x="300" y="527" text-anchor="middle" font-size="10" fill="#555">als het model?</text>
  </g>

  <g>
    <text x="450" y="495" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Model</text>
    <text x="450" y="513" text-anchor="middle" font-size="10" fill="#555">Wanneer is dit model</text>
    <text x="450" y="527" text-anchor="middle" font-size="10" fill="#555">voor het laatst bijgetraind?</text>
  </g>

  <g>
    <text x="610" y="495" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Beslissing</text>
    <text x="610" y="513" text-anchor="middle" font-size="10" fill="#555">Wat doet het systeem</text>
    <text x="610" y="527" text-anchor="middle" font-size="10" fill="#555">bij twijfel?</text>
  </g>

  <g>
    <text x="770" y="495" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Trainingsdata</text>
    <text x="770" y="513" text-anchor="middle" font-size="10" fill="#555">Welke foto's zijn gebruikt</text>
    <text x="770" y="527" text-anchor="middle" font-size="10" fill="#555">en wie heeft ze gelabeld?</text>
  </g>

  <!-- Footer -->
  <text x="450" y="580" text-anchor="middle" font-size="11" fill="#888" font-style="italic">
    AIMM × BronzGreen | ko-smart-mfg-602 | MBO-3 operator | Module 1: Gebruik
  </text>
</svg>
