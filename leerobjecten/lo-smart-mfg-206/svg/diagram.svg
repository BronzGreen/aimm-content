<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 720"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Stappenplan: van SHAP-grafiek naar actie</title>
  <desc id="desc">Een flowchart met 5 stappen die een operator doorloopt na een anomaliemelding. Stap 1: open de SHAP-grafiek. Stap 2: lees de top-3 sensoren. Stap 3: groepeer de sensoren per systeem. Stap 4: bepaal je actie op basis van de vuistregels. Stap 5: documenteer je bevinding in de werkorder.</desc>

  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
    <linearGradient id="g-start" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#8E44AD"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1ABC9C"/>
      <stop offset="100%" stop-color="#16A085"/>
    </linearGradient>
    <linearGradient id="g-end" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27AE60"/>
      <stop offset="100%" stop-color="#1E8449"/>
    </linearGradient>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="800" height="720" fill="#FAFAF8" rx="8"/>

  <!-- Titel -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50" letter-spacing="1">Van SHAP-grafiek naar actie</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d" letter-spacing="0.5">5 stappen na een anomaliemelding</text>

  <!-- START: Anomaliemelding -->
  <g filter="url(#shadow)">
    <rect x="300" y="85" width="200" height="42" rx="21" fill="url(#g-start)"/>
    <text x="400" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="white">Anomaliemelding!</text>
  </g>

  <!-- Pijl start naar stap 1 -->
  <line x1="400" y1="127" x2="400" y2="150" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAP 1 -->
  <g filter="url(#shadow)">
    <rect x="275" y="155" width="250" height="55" rx="10" fill="url(#g1)"/>
    <text x="400" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">STAP 1</text>
    <text x="400" y="196" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Open de SHAP-grafiek</text>
  </g>

  <!-- Pijl 1 naar 2 -->
  <line x1="400" y1="210" x2="400" y2="240" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAP 2 -->
  <g filter="url(#shadow)">
    <rect x="275" y="245" width="250" height="55" rx="10" fill="url(#g2)"/>
    <text x="400" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">STAP 2</text>
    <text x="400" y="286" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Lees de top-3 sensoren</text>
  </g>
  <!-- Hint rechts -->
  <text x="540" y="270" font-size="10" fill="#7f8c8d" font-style="italic">Welke sensor? Hoeveel %? Richting?</text>

  <!-- Pijl 2 naar 3 -->
  <line x1="400" y1="300" x2="400" y2="330" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAP 3 -->
  <g filter="url(#shadow)">
    <rect x="275" y="335" width="250" height="55" rx="10" fill="url(#g3)"/>
    <text x="400" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">STAP 3</text>
    <text x="400" y="376" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Groepeer per systeem</text>
  </g>
  <!-- Hint rechts -->
  <text x="540" y="360" font-size="10" fill="#7f8c8d" font-style="italic">Zelfde systeem? Dan systeemprobleem.</text>

  <!-- Pijl 3 naar 4 -->
  <line x1="400" y1="390" x2="400" y2="420" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAP 4 -->
  <g filter="url(#shadow)">
    <rect x="275" y="425" width="250" height="55" rx="10" fill="url(#g4)"/>
    <text x="400" y="448" text-anchor="middle" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">STAP 4</text>
    <text x="400" y="466" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Bepaal je actie</text>
  </g>

  <!-- Vuistregels links van stap 4 -->
  <g transform="translate(50, 418)">
    <rect x="0" y="0" width="200" height="72" rx="6" fill="#F5F3FF" stroke="#8E44AD" stroke-width="1"/>
    <text x="100" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#8E44AD">VUISTREGELS</text>
    <text x="8" y="32" font-size="9" fill="#2C3E50">1 sensor &gt; 70% = lokaal probleem</text>
    <text x="8" y="46" font-size="9" fill="#2C3E50">2-3 sensoren, 1 systeem = systeemfout</text>
    <text x="8" y="60" font-size="9" fill="#2C3E50">Veel sensoren, klein % = slijtage</text>
  </g>
  <!-- Verbindingslijn vuistregels naar stap 4 -->
  <line x1="250" y1="454" x2="275" y2="454" stroke="#8E44AD" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Pijl 4 naar 5 -->
  <line x1="400" y1="480" x2="400" y2="510" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAP 5 -->
  <g filter="url(#shadow)">
    <rect x="275" y="515" width="250" height="55" rx="10" fill="url(#g5)"/>
    <text x="400" y="538" text-anchor="middle" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">STAP 5</text>
    <text x="400" y="556" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Documenteer in werkorder</text>
  </g>

  <!-- Pijl 5 naar eind -->
  <line x1="400" y1="570" x2="400" y2="600" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- EIND: Probleem opgelost -->
  <g filter="url(#shadow)">
    <rect x="300" y="605" width="200" height="42" rx="21" fill="url(#g-end)"/>
    <text x="400" y="631" text-anchor="middle" font-size="13" font-weight="600" fill="white">Probleem gevonden</text>
  </g>

  <!-- Voorbeeld rechts onderaan -->
  <g transform="translate(560, 515)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#ECFDF5" stroke="#27AE60" stroke-width="1"/>
    <text x="100" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#1E8449">VOORBEELD</text>
    <text x="8" y="32" font-size="9" fill="#2C3E50">Dennis: koeltemp 58%,</text>
    <text x="8" y="44" font-size="9" fill="#2C3E50">spiltemp 22%, trillingen 12%</text>
    <text x="8" y="58" font-size="9" fill="#2C3E50">Actie: koelunit checken</text>
    <text x="8" y="70" font-size="9" fill="#27AE60" font-weight="600">Resultaat: verstopt filter!</text>
  </g>
  <!-- Verbindingslijn voorbeeld -->
  <line x1="525" y1="548" x2="560" y2="548" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bronvermelding -->
  <text x="400" y="695" text-anchor="middle" font-size="10" fill="#999">SHAP — Lundberg &amp; Lee (2017) | AIMM Predictive Maintenance Module 2</text>
</svg>
