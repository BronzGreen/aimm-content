<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHAP Simulator - Van grafiek naar actie</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const CASES = [
      {
        id: 1,
        machine: "Freesmachine #3",
        score: 72,
        sensors: [
          { name: "Spiltemperatuur", pct: 55, dir: "te hoog", system: "spindel" },
          { name: "Trillingen Y-as", pct: 25, dir: "te hoog", system: "spindel" },
          { name: "Koelmiddelniveau", pct: 12, dir: "te laag", system: "koeling" },
          { name: "Voedingssnelheid", pct: 8, dir: "normaal", system: "aandrijving" },
        ],
        correctTop3: ["Spiltemperatuur", "Trillingen Y-as", "Koelmiddelniveau"],
        correctSystem: "spindel",
        correctAction: "spindel",
        explanation: "Spiltemperatuur (55%) en trillingen Y-as (25%) horen bij het spindelsysteem. Samen 80%. Check de spindel als eerste: lagers, smering, uitlijning.",
      },
      {
        id: 2,
        machine: "CNC-draaibank #7",
        score: 58,
        sensors: [
          { name: "Trillingen X-as", pct: 30, dir: "te hoog", system: "trillingen" },
          { name: "Trillingen Y-as", pct: 28, dir: "te hoog", system: "trillingen" },
          { name: "Trillingen Z-as", pct: 22, dir: "te hoog", system: "trillingen" },
          { name: "Spiltemperatuur", pct: 12, dir: "normaal", system: "spindel" },
          { name: "Oliedruk", pct: 8, dir: "normaal", system: "smering" },
        ],
        correctTop3: ["Trillingen X-as", "Trillingen Y-as", "Trillingen Z-as"],
        correctSystem: "trillingen",
        correctAction: "trillingen",
        explanation: "Alle drie trillingsensoren staan in de top-3 en zijn te hoog. Dat is een duidelijk systeemprobleem. Check: fundatie, lagers, balans van het draaiende deel.",
      },
      {
        id: 3,
        machine: "Lasersnijder #2",
        score: 45,
        sensors: [
          { name: "Gasdruk", pct: 15, dir: "iets te laag", system: "gas" },
          { name: "Focusafstand", pct: 14, dir: "iets te hoog", system: "optica" },
          { name: "Koelwatertemp.", pct: 13, dir: "normaal", system: "koeling" },
          { name: "Vermogen", pct: 12, dir: "normaal", system: "laser" },
          { name: "Luchtvochtigheid", pct: 11, dir: "normaal", system: "omgeving" },
        ],
        correctTop3: ["Gasdruk", "Focusafstand", "Koelwatertemp."],
        correctSystem: "geen",
        correctAction: "historie",
        explanation: "Geen sensor boven 20%. Veel sensoren dragen een klein beetje bij. Dit wijst op algemene slijtage. Vergelijk met vorige metingen en plan preventief onderhoud.",
      },
    ];

    const ACTIONS = [
      { id: "spindel", label: "Spindelsysteem checken", desc: "Lagers, smering, uitlijning" },
      { id: "koeling", label: "Koelsysteem checken", desc: "Filter, pomp, slangen, vloeistof" },
      { id: "trillingen", label: "Trillingsanalyse doen", desc: "Fundatie, lagers, balans" },
      { id: "historie", label: "Vergelijk met historie", desc: "Vorige metingen bekijken, slijtage beoordelen" },
      { id: "sensor", label: "Sensor zelf controleren", desc: "Misschien geeft de sensor een fout signaal" },
    ];

    function SHAPBar({ name, pct, dir, isTop3 }) {
      const barColor = pct >= 40 ? "#E74C3C" : pct >= 20 ? "#E67E22" : "#3498DB";
      const dirColor = dir === "normaal" ? "#7f8c8d" : dir.includes("hoog") ? "#E74C3C" : "#E67E22";
      return (
        <div className={`flex items-center gap-3 py-1.5 px-2 rounded-lg transition-all ${isTop3 ? "bg-blue-50" : ""}`}>
          <div className="w-36 text-sm font-medium text-gray-700 truncate">{name}</div>
          <div className="flex-1 h-5 bg-gray-100 rounded-full overflow-hidden">
            <div
              className="h-full rounded-full transition-all duration-700"
              style={{ width: `${pct}%`, backgroundColor: barColor }}
            />
          </div>
          <div className="w-10 text-right text-sm font-bold" style={{ color: barColor }}>{pct}%</div>
          <div className="w-20 text-xs text-right" style={{ color: dirColor }}>{dir}</div>
        </div>
      );
    }

    function App() {
      const [caseIndex, setCaseIndex] = useState(0);
      const [step, setStep] = useState(0);
      const [selectedSensors, setSelectedSensors] = useState([]);
      const [selectedSystem, setSelectedSystem] = useState(null);
      const [selectedAction, setSelectedAction] = useState(null);
      const [showFeedback, setShowFeedback] = useState(false);
      const [totalCorrect, setTotalCorrect] = useState(0);

      const currentCase = CASES[caseIndex];
      const isLastCase = caseIndex === CASES.length - 1;

      const resetCase = () => {
        setStep(0);
        setSelectedSensors([]);
        setSelectedSystem(null);
        setSelectedAction(null);
        setShowFeedback(false);
      };

      const resetAll = () => {
        setCaseIndex(0);
        setTotalCorrect(0);
        resetCase();
      };

      const toggleSensor = (name) => {
        setSelectedSensors(prev =>
          prev.includes(name) ? prev.filter(s => s !== name) : prev.length < 3 ? [...prev, name] : prev
        );
      };

      const checkStep2 = () => {
        const correct = currentCase.correctTop3.every(s => selectedSensors.includes(s));
        if (correct) setTotalCorrect(prev => prev + 1);
        setStep(2);
      };

      const checkStep3 = () => {
        const correct = selectedSystem === currentCase.correctSystem;
        if (correct) setTotalCorrect(prev => prev + 1);
        setStep(3);
      };

      const checkStep4 = () => {
        const correct = selectedAction === currentCase.correctAction;
        if (correct) setTotalCorrect(prev => prev + 1);
        setShowFeedback(true);
      };

      const nextCase = () => {
        setCaseIndex(prev => prev + 1);
        resetCase();
      };

      const systems = useMemo(() => {
        const s = new Set(currentCase.sensors.map(s => s.system));
        return [...s];
      }, [currentCase]);

      const SYSTEM_LABELS = {
        spindel: "Spindelsysteem",
        koeling: "Koelsysteem",
        aandrijving: "Aandrijving",
        trillingen: "Trillingsysteem",
        smering: "Smeersysteem",
        gas: "Gassysteem",
        optica: "Optisch systeem",
        laser: "Laserbron",
        omgeving: "Omgeving",
        geen: "Geen duidelijk systeem (slijtage)",
      };

      return (
        <div className="min-h-screen bg-gray-50">
          <div className="bg-white border-b px-6 py-4">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              <div>
                <h1 className="text-xl font-bold text-gray-900">SHAP Simulator</h1>
                <p className="text-gray-500 text-sm">Oefen het 5-stappenplan: van SHAP-grafiek naar actie</p>
              </div>
              <button onClick={resetAll} className="text-sm text-gray-400 hover:text-gray-600 flex items-center gap-1">
                Opnieuw
              </button>
            </div>
          </div>

          <div className="max-w-4xl mx-auto p-6">
            {/* Voortgang */}
            <div className="flex items-center gap-2 mb-6">
              {CASES.map((c, i) => (
                <div key={c.id} className={`flex-1 h-2 rounded-full transition-all ${
                  i < caseIndex ? "bg-green-400" : i === caseIndex ? "bg-blue-400" : "bg-gray-200"
                }`}/>
              ))}
              <span className="text-xs text-gray-400 ml-2">Casus {caseIndex + 1}/{CASES.length}</span>
            </div>

            {/* Machine info */}
            <div className="bg-white rounded-xl border shadow-sm p-5 mb-4">
              <div className="flex items-center justify-between mb-3">
                <h2 className="font-bold text-lg text-gray-900">{currentCase.machine}</h2>
                <span className={`px-3 py-1 rounded-full text-sm font-bold ${
                  currentCase.score >= 60 ? "bg-red-100 text-red-700" : "bg-amber-100 text-amber-700"
                }`}>
                  Score: {currentCase.score}
                </span>
              </div>

              {/* SHAP grafiek */}
              <div className="space-y-1">
                {currentCase.sensors.map(s => (
                  <SHAPBar
                    key={s.name}
                    name={s.name}
                    pct={s.pct}
                    dir={s.dir}
                    isTop3={selectedSensors.includes(s.name)}
                  />
                ))}
              </div>
            </div>

            {/* Stappen */}
            <div className="space-y-4">
              {/* Stap 1: automatisch */}
              <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
                <div className="flex items-center gap-2 mb-1">
                  <span className="bg-blue-500 text-white text-xs font-bold px-2 py-0.5 rounded">STAP 1</span>
                  <span className="font-medium text-blue-800">Open de SHAP-grafiek</span>
                  <span className="text-green-600 text-sm font-bold ml-auto">Klaar</span>
                </div>
                <p className="text-sm text-blue-600">De grafiek staat hierboven. Bekijk de sensoren.</p>
              </div>

              {/* Stap 2: top-3 kiezen */}
              {step >= 0 && (
                <div className={`border rounded-xl p-4 transition-all ${step === 0 ? "bg-white border-blue-300 shadow-md" : "bg-gray-50 border-gray-200"}`}>
                  <div className="flex items-center gap-2 mb-2">
                    <span className={`text-xs font-bold px-2 py-0.5 rounded ${step === 0 ? "bg-green-500 text-white" : "bg-gray-400 text-white"}`}>STAP 2</span>
                    <span className="font-medium text-gray-800">Kies de top-3 sensoren</span>
                    {step > 0 && <span className="text-green-600 text-sm font-bold ml-auto">Klaar</span>}
                  </div>
                  {step === 0 && (
                    <>
                      <p className="text-sm text-gray-600 mb-3">Klik op de 3 sensoren die het meest bijdragen.</p>
                      <div className="flex flex-wrap gap-2 mb-3">
                        {currentCase.sensors.map(s => (
                          <button
                            key={s.name}
                            onClick={() => toggleSensor(s.name)}
                            className={`px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                              selectedSensors.includes(s.name)
                                ? "bg-blue-500 text-white shadow-md scale-105"
                                : "bg-gray-100 text-gray-700 hover:bg-gray-200"
                            }`}
                          >
                            {s.name} ({s.pct}%)
                          </button>
                        ))}
                      </div>
                      <button
                        onClick={checkStep2}
                        disabled={selectedSensors.length !== 3}
                        className={`px-5 py-2 rounded-lg text-sm font-medium transition-all ${
                          selectedSensors.length === 3
                            ? "bg-blue-500 text-white hover:bg-blue-600"
                            : "bg-gray-200 text-gray-400 cursor-not-allowed"
                        }`}
                      >
                        Controleer ({selectedSensors.length}/3 gekozen)
                      </button>
                    </>
                  )}
                </div>
              )}

              {/* Stap 3: groeperen */}
              {step >= 2 && (
                <div className={`border rounded-xl p-4 transition-all ${step === 2 ? "bg-white border-orange-300 shadow-md" : "bg-gray-50 border-gray-200"}`}>
                  <div className="flex items-center gap-2 mb-2">
                    <span className={`text-xs font-bold px-2 py-0.5 rounded ${step === 2 ? "bg-orange-500 text-white" : "bg-gray-400 text-white"}`}>STAP 3</span>
                    <span className="font-medium text-gray-800">Groepeer per systeem</span>
                    {step > 2 && <span className="text-green-600 text-sm font-bold ml-auto">Klaar</span>}
                  </div>
                  {step === 2 && (
                    <>
                      <p className="text-sm text-gray-600 mb-3">Welk systeem hoort bij de meeste top-sensoren?</p>
                      <div className="flex flex-wrap gap-2 mb-3">
                        {[...systems, "geen"].map(sys => (
                          <button
                            key={sys}
                            onClick={() => setSelectedSystem(sys)}
                            className={`px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                              selectedSystem === sys
                                ? "bg-orange-500 text-white shadow-md scale-105"
                                : "bg-gray-100 text-gray-700 hover:bg-gray-200"
                            }`}
                          >
                            {SYSTEM_LABELS[sys] || sys}
                          </button>
                        ))}
                      </div>
                      <button
                        onClick={checkStep3}
                        disabled={!selectedSystem}
                        className={`px-5 py-2 rounded-lg text-sm font-medium transition-all ${
                          selectedSystem
                            ? "bg-orange-500 text-white hover:bg-orange-600"
                            : "bg-gray-200 text-gray-400 cursor-not-allowed"
                        }`}
                      >
                        Controleer
                      </button>
                    </>
                  )}
                </div>
              )}

              {/* Stap 4: actie kiezen */}
              {step >= 3 && (
                <div className={`border rounded-xl p-4 transition-all ${step === 3 && !showFeedback ? "bg-white border-purple-300 shadow-md" : "bg-gray-50 border-gray-200"}`}>
                  <div className="flex items-center gap-2 mb-2">
                    <span className={`text-xs font-bold px-2 py-0.5 rounded ${step === 3 && !showFeedback ? "bg-purple-500 text-white" : "bg-gray-400 text-white"}`}>STAP 4</span>
                    <span className="font-medium text-gray-800">Bepaal je actie</span>
                    {showFeedback && <span className="text-green-600 text-sm font-bold ml-auto">Klaar</span>}
                  </div>
                  {step === 3 && !showFeedback && (
                    <>
                      <p className="text-sm text-gray-600 mb-3">Wat doe je als eerste?</p>
                      <div className="space-y-2 mb-3">
                        {ACTIONS.map(a => (
                          <button
                            key={a.id}
                            onClick={() => setSelectedAction(a.id)}
                            className={`w-full text-left px-4 py-3 rounded-lg border-2 transition-all ${
                              selectedAction === a.id
                                ? "border-purple-500 bg-purple-50 shadow-md"
                                : "border-gray-200 bg-white hover:border-gray-300"
                            }`}
                          >
                            <div className="font-medium text-sm">{a.label}</div>
                            <div className="text-xs text-gray-500">{a.desc}</div>
                          </button>
                        ))}
                      </div>
                      <button
                        onClick={checkStep4}
                        disabled={!selectedAction}
                        className={`px-5 py-2 rounded-lg text-sm font-medium transition-all ${
                          selectedAction
                            ? "bg-purple-500 text-white hover:bg-purple-600"
                            : "bg-gray-200 text-gray-400 cursor-not-allowed"
                        }`}
                      >
                        Controleer
                      </button>
                    </>
                  )}
                </div>
              )}

              {/* Feedback */}
              {showFeedback && (
                <div className={`border-2 rounded-xl p-5 transition-all ${
                  selectedAction === currentCase.correctAction
                    ? "bg-green-50 border-green-400"
                    : "bg-amber-50 border-amber-400"
                }`}>
                  <div className="flex items-center gap-2 mb-2">
                    <span className={`text-lg font-bold ${
                      selectedAction === currentCase.correctAction ? "text-green-700" : "text-amber-700"
                    }`}>
                      {selectedAction === currentCase.correctAction ? "Goed gekozen!" : "Bijna!"}
                    </span>
                  </div>
                  <p className="text-sm text-gray-700 mb-4">{currentCase.explanation}</p>

                  {!isLastCase ? (
                    <button
                      onClick={nextCase}
                      className="px-5 py-2 bg-blue-500 text-white rounded-lg text-sm font-medium hover:bg-blue-600 transition-all"
                    >
                      Volgende casus
                    </button>
                  ) : (
                    <div className="mt-2">
                      <div className="text-lg font-bold text-gray-900 mb-1">
                        Klaar! Je score: {totalCorrect} / {CASES.length * 3} punten
                      </div>
                      <p className="text-sm text-gray-600 mb-3">
                        {totalCorrect >= 7
                          ? "Je leest SHAP-grafieken goed. Probeer het nu bij je eigen machine."
                          : totalCorrect >= 4
                          ? "Goed op weg. Oefen nog met het groeperen per systeem."
                          : "Bekijk het 5-stappenplan op de handout nog eens en probeer opnieuw."}
                      </p>
                      <button
                        onClick={resetAll}
                        className="px-5 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300 transition-all"
                      >
                        Opnieuw oefenen
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Footer */}
            <div className="mt-8 text-center text-xs text-gray-400">
              SHAP — Lundberg &amp; Lee (2017) | AIMM Predictive Maintenance Module 2
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
