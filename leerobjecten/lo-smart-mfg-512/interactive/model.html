<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drempelwaarde instellen — Vision-model Simulator</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 4px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #3B82F6;
      cursor: pointer;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #3B82F6;
      cursor: pointer;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    function DrempelwaardeSimulator() {
      const [threshold, setThreshold] = useState(50);
      const [productiesPerDag, setProductiesPerDag] = useState(1000);
      const [showKosten, setShowKosten] = useState(false);

      const thresholdValue = threshold / 100;

      // Model: recall en valse alarmen als functie van drempelwaarde
      // Gebaseerd op de voorbeelddata uit het KO
      const results = useMemo(() => {
        const t = thresholdValue;
        // Recall daalt als threshold stijgt (soepeler = minder gevonden)
        const recall = Math.max(0, Math.min(100, Math.round(100 - (t * 40) + 2)));
        // Valse alarmen dalen als threshold stijgt
        const falsePositive = Math.max(0, Math.min(100, Math.round(60 - (t * 85))));

        const gemist = Math.round(productiesPerDag * 0.05 * (1 - recall / 100));
        const valsAlarm = Math.round(productiesPerDag * 0.95 * (falsePositive / 100));

        return { recall, falsePositive, gemist, valsAlarm };
      }, [thresholdValue, productiesPerDag]);

      const getThresholdLabel = () => {
        if (thresholdValue <= 0.35) return { text: "Streng", color: "text-red-600", bg: "bg-red-50", border: "border-red-200" };
        if (thresholdValue <= 0.6) return { text: "Gemiddeld", color: "text-amber-600", bg: "bg-amber-50", border: "border-amber-200" };
        return { text: "Soepel", color: "text-green-600", bg: "bg-green-50", border: "border-green-200" };
      };

      const label = getThresholdLabel();

      const handleReset = () => {
        setThreshold(50);
        setProductiesPerDag(1000);
        setShowKosten(false);
      };

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <div className="bg-white border-b px-6 py-4">
            <h1 className="text-2xl font-bold text-gray-900">Drempelwaarde instellen</h1>
            <p className="text-gray-500 mt-1">Schuif de slider en zie wat er gebeurt met jouw productielijn</p>
          </div>

          <div className="max-w-4xl mx-auto p-6 space-y-6">
            {/* Info box */}
            <div className="flex items-start gap-3 p-4 bg-blue-50 rounded-xl text-sm text-blue-800 border border-blue-200">
              <svg className="flex-shrink-0 mt-0.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
              <div>
                <strong>Hoe werkt het?</strong> Schuif de slider naar links voor strenger (meer fouten vinden) of naar rechts voor soepeler (minder valse alarmen). Kijk wat er gebeurt met jouw productie.
              </div>
            </div>

            {/* Slider sectie */}
            <div className="bg-white rounded-xl shadow-sm border p-6">
              <div className="flex justify-between items-center mb-2">
                <span className="font-bold text-gray-800 text-lg">Drempelwaarde</span>
                <span className={`text-3xl font-bold ${label.color}`}>{thresholdValue.toFixed(2)}</span>
              </div>
              <div className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-medium mb-4 ${label.bg} ${label.color} border ${label.border}`}>
                {label.text}
              </div>
              <input
                type="range"
                min="10"
                max="90"
                value={threshold}
                onChange={(e) => setThreshold(+e.target.value)}
                className="w-full cursor-pointer"
                style={{ background: `linear-gradient(to right, #E74C3C 0%, #F39C12 50%, #27AE60 100%)` }}
              />
              <div className="flex justify-between text-xs text-gray-400 mt-1">
                <span>0.1 — Streng</span>
                <span>Soepel — 0.9</span>
              </div>
            </div>

            {/* Resultaten */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {/* Recall */}
              <div className="bg-white rounded-xl shadow-sm border p-6">
                <div className="text-sm text-gray-500 font-medium mb-1">Recall (gevonden fouten)</div>
                <div className="text-4xl font-bold text-gray-900 mb-3">{results.recall}%</div>
                <div className="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
                  <div
                    className="h-full rounded-full transition-all duration-300"
                    style={{
                      width: `${results.recall}%`,
                      backgroundColor: results.recall >= 85 ? '#27AE60' : results.recall >= 70 ? '#F39C12' : '#E74C3C'
                    }}
                  />
                </div>
                <div className="text-xs text-gray-400 mt-2">
                  {results.recall >= 85 ? 'Goed: bijna alle fouten gevonden' :
                   results.recall >= 70 ? 'Let op: sommige fouten worden gemist' :
                   'Risico: veel fouten worden gemist'}
                </div>
              </div>

              {/* Valse alarmen */}
              <div className="bg-white rounded-xl shadow-sm border p-6">
                <div className="text-sm text-gray-500 font-medium mb-1">Valse alarmen</div>
                <div className="text-4xl font-bold text-gray-900 mb-3">{results.falsePositive}%</div>
                <div className="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
                  <div
                    className="h-full rounded-full transition-all duration-300"
                    style={{
                      width: `${results.falsePositive}%`,
                      backgroundColor: results.falsePositive <= 5 ? '#27AE60' : results.falsePositive <= 15 ? '#F39C12' : '#E74C3C'
                    }}
                  />
                </div>
                <div className="text-xs text-gray-400 mt-2">
                  {results.falsePositive <= 5 ? 'Goed: weinig onnodig afgekeurd' :
                   results.falsePositive <= 15 ? 'Acceptabel: af en toe een vals alarm' :
                   'Probleem: veel goede producten afgekeurd'}
                </div>
              </div>
            </div>

            {/* Productie input */}
            <div className="bg-white rounded-xl shadow-sm border p-6">
              <div className="flex justify-between items-center mb-3">
                <span className="font-bold text-gray-800">Jouw productie per dag</span>
                <span className="text-xl font-bold text-blue-600">{productiesPerDag.toLocaleString('nl-NL')}</span>
              </div>
              <input
                type="range"
                min="100"
                max="10000"
                step="100"
                value={productiesPerDag}
                onChange={(e) => setProductiesPerDag(+e.target.value)}
                className="w-full cursor-pointer"
                style={{ background: '#CBD5E1' }}
              />
              <div className="flex justify-between text-xs text-gray-400 mt-1">
                <span>100</span>
                <span>10.000</span>
              </div>
            </div>

            {/* Impact op jouw productie */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className={`rounded-xl border-l-4 p-5 ${results.valsAlarm > 50 ? 'bg-red-50 border-red-500' : results.valsAlarm > 10 ? 'bg-amber-50 border-amber-500' : 'bg-green-50 border-green-500'}`}>
                <div className="text-sm text-gray-600 font-medium">Valse alarmen per dag</div>
                <div className="text-3xl font-bold text-gray-900 mt-1">{results.valsAlarm}</div>
                <div className="text-xs text-gray-500 mt-1">producten onnodig afgekeurd</div>
              </div>
              <div className={`rounded-xl border-l-4 p-5 ${results.gemist > 5 ? 'bg-red-50 border-red-500' : results.gemist > 1 ? 'bg-amber-50 border-amber-500' : 'bg-green-50 border-green-500'}`}>
                <div className="text-sm text-gray-600 font-medium">Gemiste defecten per dag</div>
                <div className="text-3xl font-bold text-gray-900 mt-1">{results.gemist}</div>
                <div className="text-xs text-gray-500 mt-1">slechte producten doorgelaten</div>
              </div>
            </div>

            {/* Kosten-inzicht (uitklapbaar) */}
            <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
              <button
                className="w-full p-4 flex justify-between items-center text-left hover:bg-gray-50 transition-colors"
                onClick={() => setShowKosten(!showKosten)}
              >
                <span className="font-bold text-gray-800">Wat kost dit?</span>
                <svg
                  className={`w-5 h-5 text-gray-400 transition-transform ${showKosten ? 'rotate-90' : ''}`}
                  fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"
                >
                  <path d="M9 5l7 7-7 7"/>
                </svg>
              </button>
              {showKosten && (
                <div className="px-4 pb-4 border-t pt-3 text-sm text-gray-600 space-y-3">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="p-4 bg-red-50 rounded-lg">
                      <div className="font-bold text-red-700 mb-1">Kosten valse alarmen</div>
                      <div className="text-red-600">
                        {results.valsAlarm} producten x stilstand + controle =
                      </div>
                      <div className="text-xs text-red-500 mt-1">
                        Tijd, materiaal, productieverlies
                      </div>
                    </div>
                    <div className="p-4 bg-orange-50 rounded-lg">
                      <div className="font-bold text-orange-700 mb-1">Kosten gemiste defecten</div>
                      <div className="text-orange-600">
                        {results.gemist} producten x klacht + terugroep =
                      </div>
                      <div className="text-xs text-orange-500 mt-1">
                        Klantklachten, terugroepacties, imagoschade
                      </div>
                    </div>
                  </div>
                  <div className="p-3 bg-blue-50 rounded-lg text-blue-700 text-xs">
                    <strong>Tip:</strong> Bij veiligheidsproducten is een gemist defect veel duurder dan een vals alarm. Kies dan een lagere drempelwaarde (strenger).
                  </div>
                </div>
              )}
            </div>

            {/* Snelkeuze knoppen */}
            <div className="bg-white rounded-xl shadow-sm border p-6">
              <div className="font-bold text-gray-800 mb-3">Probeer een voorbeeldinstelling</div>
              <div className="flex flex-wrap gap-3">
                <button
                  onClick={() => setThreshold(30)}
                  className="px-4 py-2 bg-red-50 border border-red-200 text-red-700 rounded-lg font-medium hover:bg-red-100 transition-colors text-sm"
                >
                  Streng (0.3)
                </button>
                <button
                  onClick={() => setThreshold(50)}
                  className="px-4 py-2 bg-amber-50 border border-amber-200 text-amber-700 rounded-lg font-medium hover:bg-amber-100 transition-colors text-sm"
                >
                  Gemiddeld (0.5)
                </button>
                <button
                  onClick={() => setThreshold(70)}
                  className="px-4 py-2 bg-green-50 border border-green-200 text-green-700 rounded-lg font-medium hover:bg-green-100 transition-colors text-sm"
                >
                  Soepel (0.7)
                </button>
              </div>
            </div>

            {/* Reset knop */}
            <div className="flex justify-center">
              <button
                onClick={handleReset}
                className="px-4 py-2 text-gray-500 hover:text-gray-700 text-sm flex items-center gap-1 transition-colors"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                </svg>
                Opnieuw beginnen
              </button>
            </div>

            {/* Footer */}
            <div className="text-center text-xs text-gray-400 pt-4">
              Bron: Vision-model configuratie — AI &amp; Data Literacy | AIMM Module 2: Train
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DrempelwaardeSimulator />);
  </script>
</body>
</html>
