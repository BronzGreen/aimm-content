<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Model verbeteren - Simulator</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    function ModelVerbeteren() {
      const FAULT_TYPES = [
        { id: "krassen", label: "Krassen", startRecall: 95 },
        { id: "kleurafwijking", label: "Kleurafwijkingen", startRecall: 60 },
        { id: "vormfout", label: "Vormfouten", startRecall: 78 },
        { id: "oppervlakte", label: "Oppervlaktefouten", startRecall: 72 },
      ];

      const [step, setStep] = useState(0);
      const [selectedFault, setSelectedFault] = useState(null);
      const [extraPhotos, setExtraPhotos] = useState(0);
      const [labelsFixed, setLabelsFixed] = useState(false);
      const [retrained, setRetrained] = useState(false);
      const [showResult, setShowResult] = useState(false);

      const selectedData = FAULT_TYPES.find(f => f.id === selectedFault);

      const newRecall = useMemo(() => {
        if (!selectedData) return 0;
        let base = selectedData.startRecall;
        let improvement = 0;
        if (extraPhotos >= 20) improvement += 5;
        if (extraPhotos >= 50) improvement += 8;
        if (extraPhotos >= 80) improvement += 7;
        if (extraPhotos >= 120) improvement += 3;
        if (labelsFixed) improvement += 5;
        return Math.min(99, base + improvement);
      }, [selectedData, extraPhotos, labelsFixed]);

      const handleReset = () => {
        setStep(0);
        setSelectedFault(null);
        setExtraPhotos(0);
        setLabelsFixed(false);
        setRetrained(false);
        setShowResult(false);
      };

      const handleRetrain = () => {
        setRetrained(true);
        setTimeout(() => setShowResult(true), 1500);
      };

      const STEPS = [
        { nr: 1, label: "Fouten analyseren", color: "bg-blue-500" },
        { nr: 2, label: "Data toevoegen", color: "bg-green-500" },
        { nr: 3, label: "Labels verbeteren", color: "bg-orange-500" },
        { nr: 4, label: "Hertrainen", color: "bg-purple-500" },
      ];

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <div className="bg-white border-b px-6 py-4">
            <h1 className="text-xl font-bold text-gray-900">
              Model verbeteren: de verbetercyclus
            </h1>
            <p className="text-gray-500 text-sm mt-1">
              Doorloop de vier stappen. Zie hoe het model beter wordt.
            </p>
          </div>

          <div className="max-w-3xl mx-auto p-4 md:p-6">
            {/* Stappen-indicator */}
            <div className="flex items-center gap-1 mb-6">
              {STEPS.map((s, i) => (
                <div key={s.nr} className="flex items-center flex-1">
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-all ${
                    step >= i ? s.color + " text-white shadow" : "bg-gray-200 text-gray-500"
                  }`}>
                    {s.nr}
                  </div>
                  <div className={`ml-2 text-xs font-medium hidden md:block ${
                    step >= i ? "text-gray-800" : "text-gray-400"
                  }`}>
                    {s.label}
                  </div>
                  {i < STEPS.length - 1 && (
                    <div className={`flex-1 h-0.5 mx-2 ${
                      step > i ? "bg-gray-400" : "bg-gray-200"
                    }`} />
                  )}
                </div>
              ))}
            </div>

            {/* Stap 0: Fouten analyseren */}
            {step === 0 && (
              <div className="bg-white rounded-xl shadow-sm border p-6">
                <div className="flex items-center gap-2 mb-4">
                  <div className="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-sm">1</div>
                  <h2 className="text-lg font-bold text-gray-900">Fouten analyseren</h2>
                </div>
                <p className="text-gray-600 text-sm mb-4">
                  Bekijk de huidige scores van het model. Welk fouttype wil je verbeteren?
                </p>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                  {FAULT_TYPES.map(ft => (
                    <button
                      key={ft.id}
                      onClick={() => setSelectedFault(ft.id)}
                      className={`p-4 rounded-xl border-2 text-left transition-all ${
                        selectedFault === ft.id
                          ? "border-blue-500 bg-blue-50 shadow-md"
                          : "border-gray-200 bg-white hover:border-gray-300"
                      }`}
                    >
                      <div className="font-bold text-gray-800">{ft.label}</div>
                      <div className="flex items-center gap-2 mt-2">
                        <div className="flex-1 h-3 bg-gray-200 rounded-full overflow-hidden">
                          <div
                            className={`h-full rounded-full transition-all ${
                              ft.startRecall >= 90 ? "bg-green-500" :
                              ft.startRecall >= 75 ? "bg-yellow-500" : "bg-red-500"
                            }`}
                            style={{ width: `${ft.startRecall}%` }}
                          />
                        </div>
                        <span className="text-sm font-mono font-bold text-gray-700 w-12 text-right">{ft.startRecall}%</span>
                      </div>
                      <div className="text-xs text-gray-500 mt-1">Recall (herkend)</div>
                    </button>
                  ))}
                </div>

                {selectedFault && (
                  <div className="flex items-start gap-3 p-4 bg-blue-50 rounded-xl text-sm text-blue-800 mb-4">
                    <svg className="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd" />
                    </svg>
                    <div>
                      Je kiest <strong>{selectedData.label}</strong> met een recall van <strong>{selectedData.startRecall}%</strong>.
                      {selectedData.startRecall < 80 ? " Dat is laag. Hier valt winst te halen!" : " Dat kan nog beter."}
                    </div>
                  </div>
                )}

                <button
                  disabled={!selectedFault}
                  onClick={() => setStep(1)}
                  className={`w-full py-3 rounded-lg font-medium transition-all ${
                    selectedFault
                      ? "bg-blue-500 text-white hover:bg-blue-600"
                      : "bg-gray-100 text-gray-400 cursor-not-allowed"
                  }`}
                >
                  Verder naar stap 2
                </button>
              </div>
            )}

            {/* Stap 1: Data toevoegen */}
            {step === 1 && (
              <div className="bg-white rounded-xl shadow-sm border p-6">
                <div className="flex items-center gap-2 mb-4">
                  <div className="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center font-bold text-sm">2</div>
                  <h2 className="text-lg font-bold text-gray-900">Data toevoegen</h2>
                </div>
                <p className="text-gray-600 text-sm mb-4">
                  Hoeveel extra foto's maak je van <strong>{selectedData.label.toLowerCase()}</strong>? Gebruik de slider.
                </p>

                <div className="space-y-3 mb-6">
                  <div className="flex justify-between text-sm">
                    <span className="font-medium text-gray-700">Aantal extra foto's</span>
                    <span className="font-bold text-green-600 text-lg">{extraPhotos}</span>
                  </div>
                  <input
                    type="range"
                    min="0" max="150"
                    value={extraPhotos}
                    onChange={e => setExtraPhotos(+e.target.value)}
                    className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-green-500"
                  />
                  <div className="flex justify-between text-xs text-gray-400">
                    <span>0 foto's</span>
                    <span>150 foto's</span>
                  </div>
                </div>

                {extraPhotos > 0 && (
                  <div className={`p-4 rounded-xl text-sm mb-4 ${
                    extraPhotos < 20 ? "bg-red-50 text-red-800" :
                    extraPhotos < 50 ? "bg-yellow-50 text-yellow-800" :
                    extraPhotos < 100 ? "bg-green-50 text-green-800" :
                    "bg-blue-50 text-blue-800"
                  }`}>
                    {extraPhotos < 20 && "Te weinig. Het model leert hier bijna niets van."}
                    {extraPhotos >= 20 && extraPhotos < 50 && "Een begin. Het model leert een beetje."}
                    {extraPhotos >= 50 && extraPhotos < 100 && "Goed aantal! Het model kan hier veel van leren."}
                    {extraPhotos >= 100 && "Veel foto's! Let op: meer is niet altijd beter. Kwaliteit telt."}
                  </div>
                )}

                <div className="flex gap-3">
                  <button onClick={() => setStep(0)}
                    className="flex-1 py-3 rounded-lg font-medium bg-white border border-gray-300 text-gray-700 hover:bg-gray-50">
                    Terug
                  </button>
                  <button
                    disabled={extraPhotos < 1}
                    onClick={() => setStep(2)}
                    className={`flex-1 py-3 rounded-lg font-medium transition-all ${
                      extraPhotos >= 1
                        ? "bg-green-500 text-white hover:bg-green-600"
                        : "bg-gray-100 text-gray-400 cursor-not-allowed"
                    }`}>
                    Verder naar stap 3
                  </button>
                </div>
              </div>
            )}

            {/* Stap 2: Labels verbeteren */}
            {step === 2 && (
              <div className="bg-white rounded-xl shadow-sm border p-6">
                <div className="flex items-center gap-2 mb-4">
                  <div className="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold text-sm">3</div>
                  <h2 className="text-lg font-bold text-gray-900">Labels verbeteren</h2>
                </div>
                <p className="text-gray-600 text-sm mb-4">
                  Labels zijn de namen bij je foto's. Kloppen ze? Fout gelabelde foto's maken het model slechter.
                </p>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                  <button
                    onClick={() => setLabelsFixed(true)}
                    className={`p-5 rounded-xl border-2 text-left transition-all ${
                      labelsFixed === true
                        ? "border-orange-500 bg-orange-50 shadow-md"
                        : "border-gray-200 bg-white hover:border-gray-300"
                    }`}
                  >
                    <div className="font-bold text-gray-800">Ja, ik controleer de labels</div>
                    <div className="text-sm text-gray-500 mt-1">
                      Ik kijk alle labels na. Ik corrigeer fouten.
                    </div>
                  </button>
                  <button
                    onClick={() => setLabelsFixed(false)}
                    className={`p-5 rounded-xl border-2 text-left transition-all ${
                      labelsFixed === false
                        ? "border-gray-400 bg-gray-50 shadow-md"
                        : "border-gray-200 bg-white hover:border-gray-300"
                    }`}
                  >
                    <div className="font-bold text-gray-800">Nee, ik sla dit over</div>
                    <div className="text-sm text-gray-500 mt-1">
                      Ik ga direct door naar hertrainen.
                    </div>
                  </button>
                </div>

                {labelsFixed && (
                  <div className="p-4 rounded-xl bg-green-50 text-green-800 text-sm mb-4">
                    Goed! Betere labels helpen het model om beter te leren. Dit levert extra verbetering op.
                  </div>
                )}

                <div className="flex gap-3">
                  <button onClick={() => setStep(1)}
                    className="flex-1 py-3 rounded-lg font-medium bg-white border border-gray-300 text-gray-700 hover:bg-gray-50">
                    Terug
                  </button>
                  <button onClick={() => setStep(3)}
                    className="flex-1 py-3 rounded-lg font-medium bg-orange-500 text-white hover:bg-orange-600 transition-all">
                    Verder naar stap 4
                  </button>
                </div>
              </div>
            )}

            {/* Stap 3: Hertrainen */}
            {step === 3 && (
              <div className="bg-white rounded-xl shadow-sm border p-6">
                <div className="flex items-center gap-2 mb-4">
                  <div className="w-8 h-8 rounded-full bg-purple-500 text-white flex items-center justify-center font-bold text-sm">4</div>
                  <h2 className="text-lg font-bold text-gray-900">Hertrainen en testen</h2>
                </div>

                {!retrained && (
                  <div>
                    <p className="text-gray-600 text-sm mb-4">
                      Je hebt alles klaar. Druk op de knop om het model opnieuw te trainen.
                    </p>
                    <div className="bg-gray-50 rounded-xl p-4 mb-6 space-y-2 text-sm">
                      <div className="flex justify-between">
                        <span className="text-gray-600">Fouttype:</span>
                        <span className="font-bold text-gray-800">{selectedData.label}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-600">Huidige recall:</span>
                        <span className="font-bold text-gray-800">{selectedData.startRecall}%</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-600">Extra foto's:</span>
                        <span className="font-bold text-gray-800">{extraPhotos}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-600">Labels gecontroleerd:</span>
                        <span className="font-bold text-gray-800">{labelsFixed ? "Ja" : "Nee"}</span>
                      </div>
                    </div>
                    <button onClick={handleRetrain}
                      className="w-full py-3 rounded-lg font-medium bg-purple-500 text-white hover:bg-purple-600 transition-all">
                      Model hertrainen
                    </button>
                  </div>
                )}

                {retrained && !showResult && (
                  <div className="text-center py-12">
                    <div className="inline-block w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-gray-600">Model wordt getraind...</p>
                  </div>
                )}

                {showResult && (
                  <div>
                    <div className="text-center mb-6">
                      <div className="text-6xl mb-2">
                        {newRecall > selectedData.startRecall + 15 ? "🎉" : newRecall > selectedData.startRecall + 5 ? "👍" : "🤔"}
                      </div>
                      <h3 className="text-lg font-bold text-gray-900">Resultaat</h3>
                    </div>

                    <div className="grid grid-cols-2 gap-4 mb-6">
                      <div className="p-4 rounded-xl bg-gray-50 text-center">
                        <div className="text-sm text-gray-500 mb-1">Oud</div>
                        <div className="text-3xl font-bold text-gray-400">{selectedData.startRecall}%</div>
                      </div>
                      <div className="p-4 rounded-xl bg-green-50 text-center">
                        <div className="text-sm text-green-600 mb-1">Nieuw</div>
                        <div className="text-3xl font-bold text-green-600">{newRecall}%</div>
                      </div>
                    </div>

                    <div className="mb-4">
                      <div className="flex justify-between text-sm mb-1">
                        <span className="text-gray-600">Verbetering</span>
                        <span className="font-bold text-green-600">+{newRecall - selectedData.startRecall}%</span>
                      </div>
                      <div className="h-4 bg-gray-200 rounded-full overflow-hidden">
                        <div className="h-full bg-green-500 rounded-full transition-all duration-1000"
                          style={{ width: `${newRecall}%` }} />
                      </div>
                    </div>

                    <div className={`p-4 rounded-xl text-sm mb-6 ${
                      newRecall >= 90 ? "bg-green-50 text-green-800" :
                      newRecall >= 80 ? "bg-blue-50 text-blue-800" :
                      "bg-yellow-50 text-yellow-800"
                    }`}>
                      {newRecall >= 90 && "Uitstekend! Het model herkent nu bijna alles. Je kunt een nieuwe ronde starten voor een ander fouttype."}
                      {newRecall >= 80 && newRecall < 90 && "Goed resultaat! Nog een ronde kan het model verder verbeteren."}
                      {newRecall < 80 && "Er is nog ruimte om te verbeteren. Probeer meer foto's en betere labels."}
                    </div>

                    <div className="p-4 rounded-xl border border-purple-200 bg-purple-50 text-sm text-purple-800 mb-6">
                      <strong>Onthoud:</strong> een model is nooit af. Je kunt deze cyclus steeds opnieuw doorlopen.
                    </div>

                    <button onClick={handleReset}
                      className="w-full py-3 rounded-lg font-medium bg-purple-500 text-white hover:bg-purple-600 transition-all flex items-center justify-center gap-2">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                      </svg>
                      Opnieuw beginnen
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* Bron */}
            <div className="mt-6 text-center text-xs text-gray-400">
              Iteratief modelverbeteren -- AIMM Module 2: Train -- Computer Vision kwaliteitscontrole
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ModelVerbeteren />);
  </script>
</body>
</html>
