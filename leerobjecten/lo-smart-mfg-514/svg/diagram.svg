<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 700"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Verbetercyclus AI-model</title>
  <desc id="desc">Een circulair diagram met vier stappen om een AI-model te verbeteren: fouten analyseren, data toevoegen, labels verbeteren en hertrainen. De cyclus laat zien dat je deze stappen steeds herhaalt tot het model goed genoeg is.</desc>

  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498DB"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27AE60"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E67E22"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9B59B6"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="700" height="700" fill="#FAFAF8"/>

  <!-- Titel -->
  <text x="350" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50" letter-spacing="1">Verbetercyclus AI-model</text>
  <text x="350" y="65" text-anchor="middle" font-size="13" fill="#7f8c8d" letter-spacing="0.5">Stap voor stap naar een beter model</text>

  <!-- Achtergrondcirkel (pad van de cyclus) -->
  <circle role="presentation" cx="350" cy="370" r="180" fill="none" stroke="#E0E0E0" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Gebogen pijlen tussen stappen (met de klok mee) -->
  <!-- Stap 1 (boven) naar Stap 2 (rechts) -->
  <path d="M395,205 Q510,220 515,330" fill="none" stroke="#3498DB" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <!-- Stap 2 (rechts) naar Stap 3 (onder) -->
  <path d="M515,410 Q500,520 395,540" fill="none" stroke="#27AE60" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <!-- Stap 3 (onder) naar Stap 4 (links) -->
  <path d="M305,540 Q190,520 185,410" fill="none" stroke="#E67E22" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <!-- Stap 4 (links) naar Stap 1 (boven) -->
  <path d="M185,330 Q190,220 305,205" fill="none" stroke="#9B59B6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Stap 1: Fouten analyseren (boven) -->
  <g filter="url(#shadow)">
    <circle cx="350" cy="190" r="55" fill="#3498DB"/>
    <text x="350" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="white">Fouten</text>
    <text x="350" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="white">analyseren</text>
  </g>
  <circle cx="300" cy="155" r="14" fill="#2C3E50"/>
  <text x="300" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="white">1</text>

  <!-- Stap 2: Data toevoegen (rechts) -->
  <g filter="url(#shadow)">
    <circle cx="530" cy="370" r="55" fill="#27AE60"/>
    <text x="530" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="white">Data</text>
    <text x="530" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="white">toevoegen</text>
  </g>
  <circle cx="565" cy="320" r="14" fill="#2C3E50"/>
  <text x="565" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="white">2</text>

  <!-- Stap 3: Labels verbeteren (onder) -->
  <g filter="url(#shadow)">
    <circle cx="350" cy="550" r="55" fill="#E67E22"/>
    <text x="350" y="542" text-anchor="middle" font-size="13" font-weight="700" fill="white">Labels</text>
    <text x="350" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="white">verbeteren</text>
  </g>
  <circle cx="400" cy="585" r="14" fill="#2C3E50"/>
  <text x="400" y="590" text-anchor="middle" font-size="11" font-weight="700" fill="white">3</text>

  <!-- Stap 4: Hertrainen en testen (links) -->
  <g filter="url(#shadow)">
    <circle cx="170" cy="370" r="55" fill="#9B59B6"/>
    <text x="170" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="white">Hertrainen</text>
    <text x="170" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="white">&amp; testen</text>
  </g>
  <circle cx="135" cy="320" r="14" fill="#2C3E50"/>
  <text x="135" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="white">4</text>

  <!-- Centraal element -->
  <circle role="presentation" cx="350" cy="370" r="50" fill="#2C3E50"/>
  <text x="350" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="white">Model</text>
  <text x="350" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="white">verbeteren</text>
  <text x="350" y="398" text-anchor="middle" font-size="10" fill="#AAA">Nooit af!</text>

  <!-- Beschrijvingen bij stappen -->
  <text x="350" y="112" text-anchor="middle" font-size="11" fill="#7f8c8d">Welk fouttype gaat slecht?</text>
  <text x="640" y="370" text-anchor="start" font-size="11" fill="#7f8c8d">
    <tspan x="600" dy="0">Maak gerichte</tspan>
    <tspan x="600" dy="16">foto's</tspan>
  </text>
  <text x="350" y="630" text-anchor="middle" font-size="11" fill="#7f8c8d">Controleer en corrigeer</text>
  <text x="60" y="370" text-anchor="end" font-size="11" fill="#7f8c8d">
    <tspan x="100" dy="0">Train opnieuw,</tspan>
    <tspan x="100" dy="16">test het resultaat</tspan>
  </text>

  <!-- Voorbeeld-callout -->
  <rect role="presentation" x="155" y="640" width="390" height="30" rx="6" fill="#EFF6FF" stroke="#3498DB" stroke-width="1"/>
  <text x="350" y="660" text-anchor="middle" font-size="10" fill="#2C3E50">Voorbeeld: recall kleurafwijkingen 60% &#x2192; 80 foto's erbij &#x2192; 85%</text>

  <!-- Bronvermelding -->
  <text x="350" y="690" text-anchor="middle" font-size="10" fill="#999">AIMM Module 2: Train -- Computer Vision kwaliteitscontrole</text>
</svg>
