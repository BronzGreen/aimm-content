<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">c-kaart PCB-assemblage — Nelson-regel-1 na materiaalwissel</title>
  <desc id="desc">Een c-regelkaart voor de fictieve PCB-assemblagecasus uit kennisobject ko-spc-502. Op de horizontale as staan uren (t=0 tot en met t=5), op de verticale as het aantal soldeerfouten per 50 boards (0 tot 10). De centerlijn c-streep ligt op 2,4 fouten per 50 boards, de Upper Control Limit UCL ligt op 7,1 en wordt berekend als c-streep plus drie keer de wortel van c-streep. De Lower Control Limit LCL is negatief en wordt daarom afgekapt op nul. De meetreeks na een materiaalwissel is 8 fouten op tijdstip t=0, 6 fouten op t=1 en 9 fouten op t=2. Het punt op t=0 ligt boven UCL en wordt gemarkeerd als Nelson-regel-1: een enkele punt buiten de drie-sigma grenzen. Het punt op t=1 ligt onder UCL maar is hoog. Het punt op t=2 ligt weer boven UCL en bevestigt het signaal. Onder de grafiek staat de escalatieketen in vijf stappen van operator naar teamleider, quarantaine, leverancier informeren en terugroepen van de batch. Rechts staat de keuzehulp voor de kaart: tellen van defecten per vaste eenheid leidt tot een c-kaart; defecten per variabele eenheid tot een u-kaart; defecte stuks per constante steekproef tot een np-kaart; fractie defect bij een variabele steekproef tot een p-kaart.</desc>

  <defs>
    <linearGradient id="bg-chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="bg-choice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="bg-escalate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B91C1C"/>
    </marker>
  </defs>

  <rect role="presentation" width="960" height="760" fill="#F8F6F0"/>

  <!-- Titel -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50" letter-spacing="1">c-kaart — één punt boven UCL is het signaal</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d" font-style="italic" letter-spacing="0.5">Fictieve PCB-assemblage · 50 boards per uur · c̄ = 2,4 · UCL = c̄ + 3√c̄ ≈ 7,1</text>

  <!-- ─────────── HOOFDGRAFIEK: c-regelkaart ─────────── -->
  <g>
    <rect x="30" y="90" width="600" height="380" rx="10" fill="url(#bg-chart)" filter="url(#shadow)"/>
    <text x="330" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">REGELKAART NA MATERIAALWISSEL</text>
    <text x="330" y="138" text-anchor="middle" font-size="12" fill="#B45309" font-style="italic">Defecten per 50 boards — telreeks 8 / 6 / 9</text>

    <!-- Plot-area -->
    <rect x="90" y="160" width="520" height="260" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>

    <!-- Y-as ticks en labels (0 t/m 10) -->
    <g font-size="10" fill="#374151">
      <line x1="90" y1="160" x2="90" y2="420" stroke="#6B7280" stroke-width="1.5"/>
      <text x="78" y="164" text-anchor="end">10</text>
      <line x1="88" y1="160" x2="92" y2="160" stroke="#6B7280"/>
      <text x="78" y="190" text-anchor="end">8</text>
      <line x1="88" y1="186" x2="92" y2="186" stroke="#6B7280"/>
      <text x="78" y="216" text-anchor="end">6</text>
      <line x1="88" y1="212" x2="92" y2="212" stroke="#6B7280"/>
      <text x="78" y="242" text-anchor="end">4</text>
      <line x1="88" y1="238" x2="92" y2="238" stroke="#6B7280"/>
      <text x="78" y="268" text-anchor="end">2</text>
      <line x1="88" y1="264" x2="92" y2="264" stroke="#6B7280"/>
      <text x="78" y="424" text-anchor="end">0</text>
      <line x1="88" y1="420" x2="92" y2="420" stroke="#6B7280"/>
      <text x="30" y="290" font-size="11" font-weight="600" fill="#374151" transform="rotate(-90 30 290)">fouten / 50 boards</text>
    </g>

    <!-- X-as ticks en labels (t=0 ... t=5) -->
    <g font-size="10" fill="#374151">
      <line x1="90" y1="420" x2="610" y2="420" stroke="#6B7280" stroke-width="1.5"/>
      <text x="140" y="440" text-anchor="middle">t=0</text>
      <line x1="140" y1="418" x2="140" y2="422" stroke="#6B7280"/>
      <text x="230" y="440" text-anchor="middle">t=1</text>
      <line x1="230" y1="418" x2="230" y2="422" stroke="#6B7280"/>
      <text x="320" y="440" text-anchor="middle">t=2</text>
      <line x1="320" y1="418" x2="320" y2="422" stroke="#6B7280"/>
      <text x="410" y="440" text-anchor="middle">t=3</text>
      <line x1="410" y1="418" x2="410" y2="422" stroke="#6B7280"/>
      <text x="500" y="440" text-anchor="middle">t=4</text>
      <line x1="500" y1="418" x2="500" y2="422" stroke="#6B7280"/>
      <text x="590" y="440" text-anchor="middle">t=5</text>
      <line x1="590" y1="418" x2="590" y2="422" stroke="#6B7280"/>
      <text x="350" y="462" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">uur na materiaalwissel</text>
    </g>

    <!-- UCL-lijn (y = 160 + (10 - 7.1) * 26 = 160 + 75.4 = 235.4) -->
    <line x1="90" y1="235" x2="610" y2="235" stroke="#B91C1C" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="618" y="239" font-size="11" font-weight="700" fill="#B91C1C">UCL = 7,1</text>

    <!-- Centerlijn c̄ = 2,4 (y = 160 + (10 - 2.4) * 26 = 160 + 197.6 = 357.6) -->
    <line x1="90" y1="358" x2="610" y2="358" stroke="#059669" stroke-width="2"/>
    <text x="618" y="362" font-size="11" font-weight="700" fill="#065F46">c̄ = 2,4</text>

    <!-- LCL-lijn (afgekapt op 0, y = 420) -->
    <line x1="90" y1="420" x2="610" y2="420" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="618" y="420" font-size="10" fill="#6B7280">LCL = 0</text>

    <!-- Meetpunten: t=0:8, t=1:6, t=2:9 -->
    <!-- t=0 (8 fouten): y = 160 + (10-8)*26 = 212 -->
    <!-- t=1 (6 fouten): y = 160 + (10-6)*26 = 264 -->
    <!-- t=2 (9 fouten): y = 160 + (10-9)*26 = 186 -->

    <!-- Lijn tussen punten -->
    <polyline points="140,212 230,264 320,186" fill="none" stroke="#1F2937" stroke-width="1.5" opacity="0.6"/>

    <!-- Punt t=0 (boven UCL — Nelson-1!) -->
    <circle cx="140" cy="212" r="8" fill="#B91C1C" stroke="#7F1D1D" stroke-width="2"/>
    <text x="140" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">8</text>

    <!-- Annotatie Nelson-1 op t=0 -->
    <g>
      <rect x="155" y="170" width="150" height="34" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
      <text x="230" y="185" text-anchor="middle" font-size="10" font-weight="700" fill="#7F1D1D">Nelson-regel-1</text>
      <text x="230" y="198" text-anchor="middle" font-size="9" fill="#991B1B">eerste punt boven UCL</text>
      <line x1="158" y1="204" x2="146" y2="212" stroke="#B91C1C" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    </g>

    <!-- Punt t=1 (onder UCL) -->
    <circle cx="230" cy="264" r="7" fill="#F59E0B" stroke="#92400E" stroke-width="2"/>
    <text x="230" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">6</text>
    <text x="230" y="299" text-anchor="middle" font-size="9" fill="#78350F" font-style="italic">hoog · binnen UCL</text>

    <!-- Punt t=2 (boven UCL — bevestiging) -->
    <circle cx="320" cy="186" r="8" fill="#B91C1C" stroke="#7F1D1D" stroke-width="2"/>
    <text x="320" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">9</text>

    <!-- Annotatie bevestiging op t=2 -->
    <g>
      <rect x="340" y="195" width="118" height="26" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/>
      <text x="399" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#7F1D1D">bevestiging</text>
      <line x1="340" y1="205" x2="328" y2="192" stroke="#B91C1C" stroke-width="1.2" marker-end="url(#arrow-red)"/>
    </g>

    <!-- Formule-kadertje -->
    <g>
      <rect x="100" y="290" width="230" height="50" rx="6" fill="#FFFFFF" stroke="#92400E" stroke-width="1.2"/>
      <text x="215" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">UCL = c̄ + 3√c̄</text>
      <text x="215" y="326" text-anchor="middle" font-size="10" fill="#78350F">= 2,4 + 3 × √2,4 ≈ 2,4 + 4,65 ≈ 7,1</text>
    </g>
  </g>

  <!-- ─────────── RECHTS: KEUZEHULP KAART ─────────── -->
  <g>
    <rect x="655" y="90" width="280" height="380" rx="10" fill="url(#bg-choice)" filter="url(#shadow)"/>
    <text x="795" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">WELKE KAART?</text>
    <text x="795" y="135" text-anchor="middle" font-size="10" fill="#1E40AF" font-style="italic">Attribuutkaart kiezen</text>

    <!-- c-kaart (gekozen) -->
    <g>
      <rect x="672" y="155" width="246" height="66" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
      <text x="795" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">c-kaart ← onze casus</text>
      <text x="795" y="193" text-anchor="middle" font-size="10" fill="#047857">defecten · vaste eenheid</text>
      <text x="795" y="208" text-anchor="middle" font-size="9" fill="#065F46" font-style="italic">50 boards → aantal soldeerfouten</text>
    </g>

    <!-- u-kaart -->
    <g>
      <rect x="672" y="230" width="246" height="56" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
      <text x="795" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">u-kaart</text>
      <text x="795" y="266" text-anchor="middle" font-size="10" fill="#4B5563">defecten · variabele eenheid</text>
      <text x="795" y="279" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">fouten per meter stof</text>
    </g>

    <!-- np-kaart -->
    <g>
      <rect x="672" y="295" width="246" height="56" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
      <text x="795" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">np-kaart</text>
      <text x="795" y="331" text-anchor="middle" font-size="10" fill="#4B5563">defecte stuks · constante steekproef</text>
      <text x="795" y="344" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">defecte lampen per 100</text>
    </g>

    <!-- p-kaart -->
    <g>
      <rect x="672" y="360" width="246" height="56" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
      <text x="795" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">p-kaart</text>
      <text x="795" y="396" text-anchor="middle" font-size="10" fill="#4B5563">fractie defect · variabele steekproef</text>
      <text x="795" y="409" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">% defecte pallets per levering</text>
    </g>

    <!-- Voetnoot -->
    <text x="795" y="445" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="600">Tel je defecten of defecte stuks?</text>
    <text x="795" y="458" text-anchor="middle" font-size="10" fill="#1E3A8A">Is je eenheid constant of variabel?</text>
  </g>

  <!-- ─────────── ONDER: ESCALATIEKETEN ─────────── -->
  <g>
    <rect x="30" y="495" width="905" height="230" rx="10" fill="url(#bg-escalate)" filter="url(#shadow)"/>
    <text x="480" y="525" text-anchor="middle" font-size="16" font-weight="700" fill="#7F1D1D">ESCALATIEKETEN — WAT GEBEURT ER IN DE EERSTE 2 UUR?</text>
    <text x="480" y="544" text-anchor="middle" font-size="11" fill="#991B1B" font-style="italic">Escalatie binnen 2 uur beperkt de impact van ~1 shift tot ~150 boards</text>

    <!-- Vijf stappen horizontaal -->
    <g font-size="10" fill="#1F2937">
      <!-- Stap 1 -->
      <rect x="55" y="570" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
      <circle cx="75" cy="590" r="14" fill="#B91C1C"/>
      <text x="75" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
      <text x="135" y="594" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">Teamleider</text>
      <text x="135" y="616" text-anchor="middle" font-size="9" fill="#374151">Operator informeert</text>
      <text x="135" y="628" text-anchor="middle" font-size="9" fill="#374151">teamleider direct na</text>
      <text x="135" y="640" text-anchor="middle" font-size="9" fill="#374151">het eerste signaal</text>
      <text x="135" y="672" text-anchor="middle" font-size="9" font-weight="700" fill="#B91C1C">direct · t=0</text>

      <!-- Pijl -->
      <line x1="222" y1="625" x2="245" y2="625" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow-red)"/>

      <!-- Stap 2 -->
      <rect x="252" y="570" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
      <circle cx="272" cy="590" r="14" fill="#B91C1C"/>
      <text x="272" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
      <text x="332" y="594" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">Apart zetten</text>
      <text x="332" y="616" text-anchor="middle" font-size="9" fill="#374151">Boards uit verdachte</text>
      <text x="332" y="628" text-anchor="middle" font-size="9" fill="#374151">productie-uren</text>
      <text x="332" y="640" text-anchor="middle" font-size="9" fill="#374151">isoleren</text>
      <text x="332" y="672" text-anchor="middle" font-size="9" font-weight="700" fill="#B91C1C">binnen 15 min</text>

      <!-- Pijl -->
      <line x1="419" y1="625" x2="442" y2="625" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow-red)"/>

      <!-- Stap 3 -->
      <rect x="449" y="570" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
      <circle cx="469" cy="590" r="14" fill="#B91C1C"/>
      <text x="469" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
      <text x="529" y="594" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">Quarantaine</text>
      <text x="529" y="616" text-anchor="middle" font-size="9" fill="#374151">Kwaliteit/engineering</text>
      <text x="529" y="628" text-anchor="middle" font-size="9" fill="#374151">erbij · materiaalbatch</text>
      <text x="529" y="640" text-anchor="middle" font-size="9" fill="#374151">in quarantaine</text>
      <text x="529" y="672" text-anchor="middle" font-size="9" font-weight="700" fill="#B91C1C">binnen 1 uur</text>

      <!-- Pijl -->
      <line x1="616" y1="625" x2="639" y2="625" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow-red)"/>

      <!-- Stap 4 -->
      <rect x="646" y="570" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
      <circle cx="666" cy="590" r="14" fill="#B91C1C"/>
      <text x="666" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
      <text x="726" y="594" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">Leverancier</text>
      <text x="726" y="616" text-anchor="middle" font-size="9" fill="#374151">Informeren en batch</text>
      <text x="726" y="628" text-anchor="middle" font-size="9" fill="#374151">terugroepen voor</text>
      <text x="726" y="640" text-anchor="middle" font-size="9" fill="#374151">onderzoek</text>
      <text x="726" y="672" text-anchor="middle" font-size="9" font-weight="700" fill="#B91C1C">binnen 2 uur</text>

      <!-- Pijl -->
      <line x1="813" y1="625" x2="836" y2="625" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow-red)"/>

      <!-- Stap 5 -->
      <rect x="843" y="570" width="88" height="120" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
      <circle cx="863" cy="590" r="14" fill="#059669"/>
      <text x="863" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
      <text x="887" y="614" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">Hervatten</text>
      <text x="887" y="632" text-anchor="middle" font-size="8" fill="#374151">met vorige</text>
      <text x="887" y="644" text-anchor="middle" font-size="8" fill="#374151">batch</text>
      <text x="887" y="672" text-anchor="middle" font-size="9" font-weight="700" fill="#065F46">batch OK</text>
    </g>

    <!-- Voetnoot traceerbaarheid -->
    <text x="480" y="712" text-anchor="middle" font-size="10" fill="#7F1D1D" font-style="italic">Voorwaarde: materiaal-traceerbaarheid — welke batch is wanneer op welke lijn gebruikt?</text>
  </g>

  <!-- Bronvermelding -->
  <text x="480" y="748" text-anchor="middle" font-size="9" fill="#9CA3AF">Bron: ko-spc-502 (fictieve PCB-casus) · AIAG SPC · NIST/SEMATECH · Nelson (1984) · AIMM Module 2 — SPC Train</text>
</svg>
