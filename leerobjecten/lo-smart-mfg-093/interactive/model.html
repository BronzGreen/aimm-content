<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Autoencoder Simulator — AIMM</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    // Gesimuleerde sensordata voor productiecycli
    const NORMAL_PATTERN = [20, 45, 78, 92, 95, 93, 85, 60, 35, 22];
    const CYCLE_LABELS = ["Start", "", "", "Opwarm", "", "Piek", "", "", "Afkoel", "Eind"];

    function generateCycle(anomalyType) {
      const base = NORMAL_PATTERN.map(v => v + (Math.random() - 0.5) * 6);
      if (anomalyType === "none") return base;
      if (anomalyType === "spike") {
        const copy = [...base];
        copy[4] = copy[4] + 40 + Math.random() * 15;
        return copy;
      }
      if (anomalyType === "drift") {
        return base.map((v, i) => v + i * 3.5);
      }
      if (anomalyType === "drop") {
        const copy = [...base];
        copy[5] = copy[5] - 50;
        copy[6] = copy[6] - 30;
        return copy;
      }
      return base;
    }

    function reconstructCycle(data, anomalyType) {
      // De autoencoder reconstrueert altijd iets dat op het normale patroon lijkt
      return NORMAL_PATTERN.map((v, i) => v + (Math.random() - 0.5) * 4);
    }

    function calcError(original, reconstructed) {
      const diffs = original.map((v, i) => Math.abs(v - reconstructed[i]));
      return diffs.reduce((a, b) => a + b, 0) / diffs.length;
    }

    const SCENARIOS = [
      { id: "normal", label: "Normale cyclus", type: "none", description: "Een standaard productiecyclus. Alles verloopt zoals verwacht." },
      { id: "spike", label: "Drukpiek", type: "spike", description: "Halverwege de cyclus is er een onverwachte piek. Mogelijk een verstopte leiding." },
      { id: "drift", label: "Temperatuurdrift", type: "drift", description: "De temperatuur stijgt langzaam steeds hoger. De koeling werkt niet goed." },
      { id: "drop", label: "Energieval", type: "drop", description: "Het energieverbruik valt plotseling weg. Mogelijk een losse verbinding." },
    ];

    const THRESHOLD = 15;

    function MiniChart({ data, color, label, height = 100 }) {
      const max = 140;
      const w = 280;
      const h = height;
      const points = data.map((v, i) => {
        const x = (i / (data.length - 1)) * (w - 20) + 10;
        const y = h - (v / max) * (h - 20) - 10;
        return `${x},${y}`;
      }).join(" ");

      return (
        <div>
          <div className="text-xs font-medium text-gray-500 mb-1">{label}</div>
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ maxHeight: `${h}px` }}>
            <rect width={w} height={h} fill="#f9fafb" rx="6"/>
            {/* Grid lijnen */}
            {[25, 50, 75, 100].map(v => (
              <line key={v} x1="10" y1={h - (v / max) * (h - 20) - 10}
                    x2={w - 10} y2={h - (v / max) * (h - 20) - 10}
                    stroke="#e5e7eb" strokeWidth="0.5"/>
            ))}
            <polyline points={points} fill="none" stroke={color} strokeWidth="2.5"
                      strokeLinecap="round" strokeLinejoin="round"/>
            {data.map((v, i) => {
              const x = (i / (data.length - 1)) * (w - 20) + 10;
              const y = h - (v / max) * (h - 20) - 10;
              return <circle key={i} cx={x} cy={y} r="3" fill={color}/>;
            })}
          </svg>
        </div>
      );
    }

    function ErrorBar({ error, threshold }) {
      const maxDisplay = 40;
      const pct = Math.min((error / maxDisplay) * 100, 100);
      const threshPct = (threshold / maxDisplay) * 100;
      const isAlarm = error > threshold;

      return (
        <div className="mt-3">
          <div className="flex justify-between text-xs font-medium mb-1">
            <span className="text-gray-600">Reconstructiefout</span>
            <span className={isAlarm ? "text-red-600 font-bold" : "text-green-600 font-bold"}>
              {error.toFixed(1)}
            </span>
          </div>
          <div className="relative h-6 bg-gray-100 rounded-full overflow-hidden">
            <div
              className={`h-full rounded-full transition-all duration-700 ${isAlarm ? "bg-red-500" : "bg-green-500"}`}
              style={{ width: `${pct}%` }}
            />
            <div
              className="absolute top-0 h-full border-r-2 border-dashed border-orange-500"
              style={{ left: `${threshPct}%` }}
            />
          </div>
          <div className="flex justify-between text-xs text-gray-400 mt-1">
            <span>0</span>
            <span className="text-orange-500" style={{ position: "relative", left: `${threshPct - 50}%` }}>
              drempel = {threshold}
            </span>
            <span>{maxDisplay}</span>
          </div>
        </div>
      );
    }

    function AutoencoderSimulator() {
      const [activeScenario, setActiveScenario] = useState(null);
      const [showStep, setShowStep] = useState(0);

      const scenarioData = useMemo(() => {
        if (!activeScenario) return null;
        const scenario = SCENARIOS.find(s => s.id === activeScenario);
        const original = generateCycle(scenario.type);
        const reconstructed = reconstructCycle(original, scenario.type);
        const error = calcError(original, reconstructed);
        return { original, reconstructed, error, scenario };
      }, [activeScenario]);

      const handleSelectScenario = (id) => {
        setActiveScenario(id);
        setShowStep(1);
      };

      const handleReset = () => {
        setActiveScenario(null);
        setShowStep(0);
      };

      const isAlarm = scenarioData && scenarioData.error > THRESHOLD;

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <div className="bg-white border-b px-6 py-4">
            <h1 className="text-xl font-bold text-gray-900">
              Autoencoder Simulator
            </h1>
            <p className="text-gray-500 text-sm mt-1">
              Kies een productiecyclus. Bekijk hoe de AI het verschil vindt.
            </p>
          </div>

          <div className="max-w-4xl mx-auto p-4 md:p-6">
            {/* Uitleg */}
            <div className="flex items-start gap-3 p-4 bg-blue-50 rounded-xl text-sm text-blue-800 mb-6">
              <svg className="flex-shrink-0 mt-0.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
              <div>
                <strong>Hoe werkt het?</strong> De autoencoder kent het normale patroon.
                Hij vat de data samen en bouwt het weer op. Als het resultaat
                veel afwijkt van het origineel, is er iets mis.
              </div>
            </div>

            {/* Scenario-knoppen */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
              {SCENARIOS.map(s => (
                <button
                  key={s.id}
                  onClick={() => handleSelectScenario(s.id)}
                  className={`p-3 rounded-xl border-2 text-left transition-all ${
                    activeScenario === s.id
                      ? "border-blue-500 bg-blue-50 shadow-md"
                      : "border-gray-200 bg-white hover:border-blue-300 hover:shadow-sm"
                  }`}
                >
                  <div className="font-bold text-sm text-gray-900">{s.label}</div>
                  <div className="text-xs text-gray-500 mt-1">
                    {s.id === "normal" ? "Alles in orde" : "Er is iets mis"}
                  </div>
                </button>
              ))}
            </div>

            {/* Resultaat */}
            {scenarioData && (
              <div className="space-y-4">
                {/* Beschrijving */}
                <div className="p-4 bg-white rounded-xl border">
                  <div className="font-medium text-gray-900 mb-1">{scenarioData.scenario.label}</div>
                  <div className="text-sm text-gray-600">{scenarioData.scenario.description}</div>
                </div>

                {/* Stap 1: Originele data */}
                <div className="bg-white rounded-xl border p-4">
                  <div className="flex items-center gap-2 mb-3">
                    <span className="w-6 h-6 rounded-full bg-blue-500 text-white text-xs font-bold flex items-center justify-center">1</span>
                    <span className="font-bold text-sm text-gray-900">Originele sensordata</span>
                  </div>
                  <MiniChart data={scenarioData.original} color="#3498DB" label="Sensorwaarde per meetpunt"/>
                </div>

                {/* Stap 2: Encoder + Decoder */}
                {showStep >= 1 && (
                  <div className="flex justify-center">
                    <button
                      onClick={() => setShowStep(2)}
                      className={`px-6 py-3 rounded-lg font-medium transition-all ${
                        showStep >= 2
                          ? "bg-purple-100 text-purple-700 cursor-default"
                          : "bg-purple-500 text-white hover:bg-purple-600 shadow-md"
                      }`}
                      disabled={showStep >= 2}
                    >
                      {showStep >= 2 ? "Samengevat en hersteld" : "Start de autoencoder"}
                    </button>
                  </div>
                )}

                {/* Stap 3: Herstelde data */}
                {showStep >= 2 && (
                  <>
                    <div className="bg-white rounded-xl border p-4">
                      <div className="flex items-center gap-2 mb-3">
                        <span className="w-6 h-6 rounded-full bg-teal-500 text-white text-xs font-bold flex items-center justify-center">2</span>
                        <span className="font-bold text-sm text-gray-900">Herstelde data (door de AI)</span>
                      </div>
                      <MiniChart data={scenarioData.reconstructed} color="#1ABC9C" label="Wat de AI denkt dat het moet zijn"/>
                    </div>

                    <div className="flex justify-center">
                      <button
                        onClick={() => setShowStep(3)}
                        className={`px-6 py-3 rounded-lg font-medium transition-all ${
                          showStep >= 3
                            ? "bg-orange-100 text-orange-700 cursor-default"
                            : "bg-orange-500 text-white hover:bg-orange-600 shadow-md"
                        }`}
                        disabled={showStep >= 3}
                      >
                        {showStep >= 3 ? "Vergelijking gemaakt" : "Vergelijk origineel met herstel"}
                      </button>
                    </div>
                  </>
                )}

                {/* Stap 4: Vergelijking + oordeel */}
                {showStep >= 3 && (
                  <div className={`rounded-xl border-2 p-5 transition-all ${
                    isAlarm ? "border-red-400 bg-red-50" : "border-green-400 bg-green-50"
                  }`}>
                    <div className="flex items-center gap-2 mb-3">
                      <span className={`w-6 h-6 rounded-full text-white text-xs font-bold flex items-center justify-center ${
                        isAlarm ? "bg-red-500" : "bg-green-500"
                      }`}>3</span>
                      <span className={`font-bold text-sm ${isAlarm ? "text-red-900" : "text-green-900"}`}>
                        Resultaat: {isAlarm ? "ALARM — Afwijking gevonden!" : "NORMAAL — Geen afwijking"}
                      </span>
                    </div>

                    <ErrorBar error={scenarioData.error} threshold={THRESHOLD}/>

                    <div className={`mt-4 p-3 rounded-lg text-sm ${
                      isAlarm ? "bg-red-100 text-red-800" : "bg-green-100 text-green-800"
                    }`}>
                      {isAlarm ? (
                        <span>
                          De reconstructiefout is <strong>{scenarioData.error.toFixed(1)}</strong>.
                          Dat is hoger dan de drempel van <strong>{THRESHOLD}</strong>.
                          De AI heeft een afwijking gevonden. De operator moet de machine controleren.
                        </span>
                      ) : (
                        <span>
                          De reconstructiefout is <strong>{scenarioData.error.toFixed(1)}</strong>.
                          Dat is lager dan de drempel van <strong>{THRESHOLD}</strong>.
                          Alles is normaal. De productie gaat door.
                        </span>
                      )}
                    </div>
                  </div>
                )}

                {/* Reset-knop */}
                <div className="flex justify-center pt-2">
                  <button
                    onClick={handleReset}
                    className="px-4 py-2 text-gray-500 hover:text-gray-700 text-sm flex items-center gap-1"
                  >
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                    Kies een andere cyclus
                  </button>
                </div>
              </div>
            )}

            {/* Geen selectie */}
            {!activeScenario && (
              <div className="p-8 rounded-xl border-2 border-dashed border-gray-300 text-center text-gray-400">
                Kies hierboven een productiecyclus om te starten
              </div>
            )}
          </div>

          {/* Footer */}
          <div className="text-center text-xs text-gray-400 py-4">
            AIMM Predictive Maintenance — Module 1: Gebruik | Autoencoder Simulator v1.0
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<AutoencoderSimulator/>);
  </script>
</body>
</html>
