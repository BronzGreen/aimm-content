<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <title>De Etna-pipeline: van 3D-scan naar getraind AI-model in 10 minuten</title>

  <defs>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5490"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5352f"/>
    </marker>
  </defs>

  <!-- Titel -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">
    De Etna-pipeline
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#555">
    Van 3D-scan naar getraind AI-model — onder de 10 minuten
  </text>

  <!-- Vier procesvakjes -->
  <g>
    <rect x="40" y="120" width="170" height="110" rx="8" fill="#fff4d6" stroke="#d4a017" stroke-width="2.5"/>
    <text x="125" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. 3D-scan</text>
    <text x="125" y="170" text-anchor="middle" font-size="11" fill="#555">Android-telefoon</text>
    <text x="125" y="186" text-anchor="middle" font-size="11" fill="#555">+ Kiri Engine (gratis)</text>
    <text x="125" y="210" text-anchor="middle" font-size="11" fill="#777" font-style="italic">~5 minuten</text>
  </g>

  <g>
    <rect x="245" y="120" width="170" height="110" rx="8" fill="#e0f0e3" stroke="#2c5f2d" stroke-width="2.5"/>
    <text x="330" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Blender</text>
    <text x="330" y="170" text-anchor="middle" font-size="11" fill="#555">Genereert 1000</text>
    <text x="330" y="186" text-anchor="middle" font-size="11" fill="#555">foto's + labels</text>
    <text x="330" y="210" text-anchor="middle" font-size="11" fill="#777" font-style="italic">~10 minuten</text>
  </g>

  <g>
    <rect x="450" y="120" width="170" height="110" rx="8" fill="#d9e8f5" stroke="#1a5490" stroke-width="2.5"/>
    <text x="535" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">3. AI-training</text>
    <text x="535" y="170" text-anchor="middle" font-size="11" fill="#555">YOLO getraind</text>
    <text x="535" y="186" text-anchor="middle" font-size="11" fill="#555">op synthetische data</text>
    <text x="535" y="210" text-anchor="middle" font-size="11" fill="#777" font-style="italic">~30 minuten</text>
  </g>

  <g>
    <rect x="655" y="120" width="170" height="110" rx="8" fill="#f3e0f0" stroke="#7a3b82" stroke-width="2.5"/>
    <text x="740" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">4. Validatie</text>
    <text x="740" y="170" text-anchor="middle" font-size="11" fill="#555">Op 50 echte foto's</text>
    <text x="740" y="186" text-anchor="middle" font-size="11" fill="#555">jij checkt of het klopt</text>
    <text x="740" y="210" text-anchor="middle" font-size="11" fill="#b5352f" font-style="italic">onmisbaar!</text>
  </g>

  <!-- Pijlen tussen stappen -->
  <line x1="215" y1="175" x2="240" y2="175" stroke="#1a5490" stroke-width="3" marker-end="url(#arrowblue)"/>
  <line x1="420" y1="175" x2="445" y2="175" stroke="#1a5490" stroke-width="3" marker-end="url(#arrowblue)"/>
  <line x1="625" y1="175" x2="650" y2="175" stroke="#1a5490" stroke-width="3" marker-end="url(#arrowblue)"/>

  <!-- Het contrast met traditioneel -->
  <g>
    <rect x="40" y="280" width="380" height="90" rx="6" fill="#ffe4e1" stroke="#b5352f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="230" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5352f">Traditioneel (zonder synthetisch)</text>
    <text x="230" y="330" text-anchor="middle" font-size="11" fill="#333">450 foto's maken, 5 uur labelen, trainen, testen</text>
    <text x="230" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Tijd: 1 week werk</text>
  </g>

  <g>
    <rect x="460" y="280" width="380" height="90" rx="6" fill="#e0f0e3" stroke="#2c5f2d" stroke-width="2"/>
    <text x="650" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2d">Met Etna-pipeline</text>
    <text x="650" y="330" text-anchor="middle" font-size="11" fill="#333">3D-scan, synthetisch genereren, trainen, valideren</text>
    <text x="650" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Tijd: ~1 uur + halve dag validatie</text>
  </g>

  <!-- De drie grenzen -->
  <g>
    <text x="450" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#b5352f">
      Maar: synthetisch heeft drie grenzen
    </text>
  </g>

  <g>
    <rect x="50" y="440" width="260" height="100" rx="6" fill="#ffe4e1" stroke="#b5352f" stroke-width="1.5"/>
    <text x="180" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1. Geen echte belichting</text>
    <text x="180" y="484" text-anchor="middle" font-size="10" fill="#555">Zon door een raam, stof op lens,</text>
    <text x="180" y="500" text-anchor="middle" font-size="10" fill="#555">schaduwen — dat simuleer je slecht</text>
    <text x="180" y="524" text-anchor="middle" font-size="10" fill="#777" font-style="italic">→ mengen met echte foto's nodig</text>
  </g>

  <g>
    <rect x="320" y="440" width="260" height="100" rx="6" fill="#ffe4e1" stroke="#b5352f" stroke-width="1.5"/>
    <text x="450" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">2. Geen oppervlakte-slijtage</text>
    <text x="450" y="484" text-anchor="middle" font-size="10" fill="#555">Een kras is onvoorspelbaar in</text>
    <text x="450" y="500" text-anchor="middle" font-size="10" fill="#555">vorm, diepte en richting</text>
    <text x="450" y="524" text-anchor="middle" font-size="10" fill="#777" font-style="italic">→ krassen moet je echt fotograferen</text>
  </g>

  <g>
    <rect x="590" y="440" width="260" height="100" rx="6" fill="#ffe4e1" stroke="#b5352f" stroke-width="1.5"/>
    <text x="720" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">3. Geen nieuwe defecten</text>
    <text x="720" y="484" text-anchor="middle" font-size="10" fill="#555">Wat synthetisch niet 'kent',</text>
    <text x="720" y="500" text-anchor="middle" font-size="10" fill="#555">kan het model niet leren</text>
    <text x="720" y="524" text-anchor="middle" font-size="10" fill="#777" font-style="italic">→ nieuwe defecten echt labelen</text>
  </g>

  <!-- Footer -->
  <text x="450" y="582" text-anchor="middle" font-size="10" fill="#888" font-style="italic">
    AIMM × BronzGreen | ko-smart-mfg-603 | Gebaseerd op ETNA Coffee Factory case (Poodt, 2026) | MBO-3 operator
  </text>
</svg>
