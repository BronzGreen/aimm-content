<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Cp en Cpk — centreer-probleem versus spreidings-probleem</title>
  <desc id="desc">Twee verdelingsgrafieken naast elkaar binnen hetzelfde tolerantievak. Links: het spuitgiet-voorbeeld uit het kennisobject met USL = 100,5 g, LSL = 99,5 g, gemiddelde μ = 99,9 g en sigma = 0,12 g. De verdeling is smal (Cp = 1,39, dus spreiding op zich oké) maar staat te dicht bij de ondergrens, waardoor Cpk daalt naar 1,11. Dit is een centreer-probleem; de juiste actie is het procesgemiddelde verschuiven naar 100,0. Rechts: dezelfde tolerantie maar met een veel bredere spreiding (sigma rond 0,20 g, Cp = 0,83), gecentreerd op 100,0. Dit is een spreidings-probleem; de juiste actie is een oorzaakanalyse op de variatie. Onder beide grafieken staat een interpretatietabel met de industriële vuistregels voor Cp en Cpk-waarden van kleiner dan 1,0 tot ongeveer 2,0.</desc>

  <defs>
    <linearGradient id="bg-center" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="bg-spread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>
    <linearGradient id="curve-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="curve-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#92400E"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="960" height="760" fill="#F8F6F0"/>

  <!-- Titel -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50" letter-spacing="1">Cp en Cpk — twee soorten problemen</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d" font-style="italic" letter-spacing="0.5">Cp vertelt of de spreiding smal genoeg is. Cpk vertelt of die smalle spreiding ook goed in het tolerantievak ligt.</text>

  <!-- ─────────── LINKS: CENTREER-PROBLEEM ─────────── -->
  <g>
    <!-- Paneel-achtergrond -->
    <rect x="30" y="90" width="450" height="390" rx="10" fill="url(#bg-center)" filter="url(#shadow)"/>

    <!-- Paneel-titel -->
    <text x="255" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">CENTREER-PROBLEEM</text>
    <text x="255" y="138" text-anchor="middle" font-size="12" fill="#B45309" font-style="italic">Cp hoog, Cpk laag — verdeling staat scheef</text>

    <!-- Spec-grenzen labels boven -->
    <text x="100" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">LSL</text>
    <text x="100" y="186" text-anchor="middle" font-size="10" fill="#374151">99,5 g</text>
    <text x="410" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">USL</text>
    <text x="410" y="186" text-anchor="middle" font-size="10" fill="#374151">100,5 g</text>

    <!-- Tolerantievak (lichte zone) -->
    <rect x="100" y="200" width="310" height="160" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>

    <!-- LSL-lijn -->
    <line x1="100" y1="195" x2="100" y2="365" stroke="#DC2626" stroke-width="2.5"/>
    <!-- USL-lijn -->
    <line x1="410" y1="195" x2="410" y2="365" stroke="#DC2626" stroke-width="2.5"/>
    <!-- Midden tolerantievak (target) -->
    <line x1="255" y1="200" x2="255" y2="360" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="255" y="378" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">target 100,0</text>

    <!-- Gauss curve: smalle verdeling, gecentreerd op μ=99,9 (= positie ongeveer x=224) -->
    <!-- Tolerantievak loopt van 99,5 (x=100) tot 100,5 (x=410), dus 1,0 g = 310 px, μ=99,9 → x = 100 + 0,4*310 = 224 -->
    <path d="M 124,360 Q 144,360 164,355 Q 184,345 200,318 Q 215,275 224,210 Q 233,275 248,318 Q 264,345 284,355 Q 304,360 324,360 L 324,360 L 124,360 Z"
          fill="url(#curve-amber)" stroke="#B45309" stroke-width="2"/>

    <!-- Gemiddelde μ-lijn -->
    <line x1="224" y1="200" x2="224" y2="360" stroke="#92400E" stroke-width="2"/>
    <circle cx="224" cy="200" r="4" fill="#92400E"/>
    <text x="224" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">μ = 99,9</text>

    <!-- Pijl die het probleem aanduidt -->
    <path d="M 224,400 L 224,415 L 156,415" fill="none" stroke="#92400E" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
    <text x="190" y="408" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">te dicht bij ondergrens</text>

    <!-- Cp en Cpk waarden -->
    <rect x="50" y="430" width="190" height="38" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
    <text x="60" y="447" font-size="11" font-weight="700" fill="#374151">Cp</text>
    <text x="80" y="447" font-size="11" fill="#374151">= 1,39</text>
    <text x="60" y="462" font-size="11" font-weight="700" fill="#374151">Cpk</text>
    <text x="86" y="462" font-size="11" fill="#374151">= 1,11</text>
    <text x="160" y="447" font-size="9" fill="#6B7280" font-style="italic">spreiding oké</text>
    <text x="170" y="462" font-size="9" fill="#6B7280" font-style="italic">centrering scheef</text>

    <!-- Actie-box -->
    <rect x="250" y="430" width="200" height="38" rx="6" fill="#92400E"/>
    <text x="350" y="448" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">EERSTE ACTIE</text>
    <text x="350" y="463" text-anchor="middle" font-size="11" fill="#FEF3C7">Centreren &#8594; &#956; naar 100,0</text>
  </g>

  <!-- ─────────── RECHTS: SPREIDINGS-PROBLEEM ─────────── -->
  <g>
    <!-- Paneel-achtergrond -->
    <rect x="490" y="90" width="450" height="390" rx="10" fill="url(#bg-spread)" filter="url(#shadow)"/>

    <!-- Paneel-titel -->
    <text x="715" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#991B1B">SPREIDINGS-PROBLEEM</text>
    <text x="715" y="138" text-anchor="middle" font-size="12" fill="#B91C1C" font-style="italic">Cp laag — verdeling te breed voor de tolerantie</text>

    <!-- Spec-grenzen labels boven -->
    <text x="560" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">LSL</text>
    <text x="560" y="186" text-anchor="middle" font-size="10" fill="#374151">99,5 g</text>
    <text x="870" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">USL</text>
    <text x="870" y="186" text-anchor="middle" font-size="10" fill="#374151">100,5 g</text>

    <!-- Tolerantievak -->
    <rect x="560" y="200" width="310" height="160" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>

    <!-- LSL-lijn -->
    <line x1="560" y1="195" x2="560" y2="365" stroke="#DC2626" stroke-width="2.5"/>
    <!-- USL-lijn -->
    <line x1="870" y1="195" x2="870" y2="365" stroke="#DC2626" stroke-width="2.5"/>
    <!-- Midden tolerantievak (target) -->
    <line x1="715" y1="200" x2="715" y2="360" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="715" y="378" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">target 100,0</text>

    <!-- Gauss curve: BREDE verdeling, gecentreerd op μ=100,0 (x=715), σ groter -->
    <!-- Curve loopt buiten LSL en USL -->
    <path d="M 510,360 Q 540,358 575,345 Q 615,325 660,275 Q 695,225 715,210 Q 735,225 770,275 Q 815,325 855,345 Q 890,358 920,360 L 920,360 L 510,360 Z"
          fill="url(#curve-red)" stroke="#991B1B" stroke-width="2"/>

    <!-- Gemiddelde μ-lijn -->
    <line x1="715" y1="200" x2="715" y2="360" stroke="#991B1B" stroke-width="2"/>
    <circle cx="715" cy="200" r="4" fill="#991B1B"/>
    <text x="715" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">μ = 100,0</text>

    <!-- Annotaties dat verdeling buiten LSL en USL steekt -->
    <text x="525" y="395" text-anchor="middle" font-size="10" font-weight="600" fill="#991B1B">afkeur</text>
    <text x="525" y="408" text-anchor="middle" font-size="10" font-weight="600" fill="#991B1B">links</text>
    <text x="905" y="395" text-anchor="middle" font-size="10" font-weight="600" fill="#991B1B">afkeur</text>
    <text x="905" y="408" text-anchor="middle" font-size="10" font-weight="600" fill="#991B1B">rechts</text>

    <!-- Pijl onder die de te-brede spreiding aanwijst -->
    <line x1="615" y1="395" x2="815" y2="395" stroke="#991B1B" stroke-width="1.8"/>
    <line x1="615" y1="395" x2="622" y2="390" stroke="#991B1B" stroke-width="1.8"/>
    <line x1="615" y1="395" x2="622" y2="400" stroke="#991B1B" stroke-width="1.8"/>
    <line x1="815" y1="395" x2="808" y2="390" stroke="#991B1B" stroke-width="1.8"/>
    <line x1="815" y1="395" x2="808" y2="400" stroke="#991B1B" stroke-width="1.8"/>
    <text x="715" y="389" text-anchor="middle" font-size="10" font-weight="600" fill="#991B1B">spreiding te breed</text>

    <!-- Cp en Cpk waarden -->
    <rect x="510" y="430" width="190" height="38" rx="6" fill="#FFFFFF" stroke="#991B1B" stroke-width="1.2"/>
    <text x="520" y="447" font-size="11" font-weight="700" fill="#374151">Cp</text>
    <text x="540" y="447" font-size="11" fill="#374151">= 0,83</text>
    <text x="520" y="462" font-size="11" font-weight="700" fill="#374151">Cpk</text>
    <text x="546" y="462" font-size="11" fill="#374151">= 0,83</text>
    <text x="635" y="447" font-size="9" fill="#6B7280" font-style="italic">spreiding te breed</text>
    <text x="640" y="462" font-size="9" fill="#6B7280" font-style="italic">centrering oké</text>

    <!-- Actie-box -->
    <rect x="710" y="430" width="200" height="38" rx="6" fill="#991B1B"/>
    <text x="810" y="448" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">EERSTE ACTIE</text>
    <text x="810" y="463" text-anchor="middle" font-size="11" fill="#FECACA">Oorzaakanalyse spreiding</text>
  </g>

  <!-- ─────────── INTERPRETATIETABEL ─────────── -->
  <g>
    <!-- Header -->
    <text x="480" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#2C3E50">Interpretatietabel — wat zegt het Cpk-getal?</text>

    <!-- Tabel kolomheaders -->
    <rect x="50" y="530" width="120" height="32" fill="#1F2937"/>
    <rect x="170" y="530" width="430" height="32" fill="#1F2937"/>
    <rect x="600" y="530" width="310" height="32" fill="#1F2937"/>
    <text x="110" y="551" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Cpk-waarde</text>
    <text x="385" y="551" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Wat betekent het?</text>
    <text x="755" y="551" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Wat doe je?</text>

    <!-- Rij 1: < 1,0 -->
    <rect x="50" y="562" width="120" height="32" fill="#FEF2F2" stroke="#FECACA" stroke-width="0.5"/>
    <rect x="170" y="562" width="430" height="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="600" y="562" width="310" height="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="110" y="583" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">&lt; 1,0</text>
    <text x="180" y="583" font-size="11" fill="#374151">Niet capabel — afkeur structureel waarschijnlijk</text>
    <text x="610" y="583" font-size="11" font-weight="600" fill="#991B1B">Stoppen of escaleren</text>

    <!-- Rij 2: = 1,0 -->
    <rect x="50" y="594" width="120" height="32" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.5"/>
    <rect x="170" y="594" width="430" height="32" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="600" y="594" width="310" height="32" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="110" y="615" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">= 1,0</text>
    <text x="180" y="615" font-size="11" fill="#374151">Theoretisch passend, kwetsbaar voor drift</text>
    <text x="610" y="615" font-size="11" font-weight="600" fill="#92400E">Onderzoeken</text>

    <!-- Rij 3: ≥ 1,33 -->
    <rect x="50" y="626" width="120" height="32" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.5"/>
    <rect x="170" y="626" width="430" height="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="600" y="626" width="310" height="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="110" y="647" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">≥ 1,33</text>
    <text x="180" y="647" font-size="11" fill="#374151">Veelgebruikte industriële ondergrens</text>
    <text x="610" y="647" font-size="11" font-weight="600" fill="#065F46">Doorgaan, blijven monitoren</text>

    <!-- Rij 4: ≥ 1,67 -->
    <rect x="50" y="658" width="120" height="32" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="0.5"/>
    <rect x="170" y="658" width="430" height="32" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="600" y="658" width="310" height="32" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="110" y="679" text-anchor="middle" font-size="13" font-weight="700" fill="#064E3B">≥ 1,67</text>
    <text x="180" y="679" font-size="11" fill="#374151">Zwaardere automotive of kritische eis (Ford PPAP)</text>
    <text x="610" y="679" font-size="11" font-weight="600" fill="#064E3B">Doorgaan</text>

    <!-- Rij 5: ≈ 2,0 -->
    <rect x="50" y="690" width="120" height="32" fill="#A7F3D0" stroke="#34D399" stroke-width="0.5"/>
    <rect x="170" y="690" width="430" height="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="600" y="690" width="310" height="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="110" y="711" text-anchor="middle" font-size="13" font-weight="700" fill="#064E3B">≈ 2,0</text>
    <text x="180" y="711" font-size="11" fill="#374151">Gecentreerd kortetermijnproces op zes sigma</text>
    <text x="610" y="711" font-size="11" font-weight="600" fill="#064E3B">Uitstekend — klasse-A</text>
  </g>

  <!-- Bronvermelding -->
  <text x="480" y="745" text-anchor="middle" font-size="9" fill="#999">Bron: NIST/SEMATECH · ASQ · Ford PPAP 4th ed. · Minitab · ko-spc-301 · AIMM SPC Module 2</text>
</svg>
