<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">SPC binnen Six Sigma — DMAIC-cyclus met SPC-positionering in Control en Measure</title>
  <desc id="desc">Een cirkelvormig DMAIC-diagram met vijf fasen met de klok mee: Define bovenaan, Measure rechtsboven, Analyze rechtsonder, Improve linksonder, Control linksboven. Pijlen lopen in de wijzerzin, en een extra terugloop-pijl van Control naar Define toont dat DMAIC herhaalbaar is. SPC heeft expliciete accent-ringen rond Measure (baseline-bron) en vooral rond Control (kernrol). Bij elke fase staat de centrale vraag en een of twee kerntools: SIPOC en charter voor Define, SPC-baseline en Gage R&amp;R voor Measure, visgraat en vijf-waarom voor Analyze, pilot en DOE voor Improve, control plan en SPC-regelkaart voor Control. In het midden staat het centrale principe Six Sigma met het doel drie komma vier DPMO en het herkomst-spoor Motorola 1986 en GE jaren negentig. Rechtsonder staat het onderscheid sigma-niveau versus Cpk benoemd. Onder de cyclus staat de kernboodschap dat een regelkaart geen verbeterproces is, maar wel het instrument dat toont of een verbetering blijft staan. Een strook onderin bevat de fictieve verpakkingslijn-casus.</desc>

  <defs>
    <linearGradient id="grad-define" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="grad-measure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <linearGradient id="grad-analyze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#8E44AD"/>
    </linearGradient>
    <linearGradient id="grad-improve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <linearGradient id="grad-control" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="grad-center" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow-define" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#2980B9"/>
    </marker>
    <marker id="arrow-measure" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#D35400"/>
    </marker>
    <marker id="arrow-analyze" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#8E44AD"/>
    </marker>
    <marker id="arrow-improve" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#27AE60"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="960" height="720" fill="#F8F6F0"/>

  <!-- Titel -->
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50" letter-spacing="1">Waar past SPC binnen Six Sigma?</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#7f8c8d" font-style="italic" letter-spacing="0.5">DMAIC is het verbeterraamwerk — SPC is de bewakingstool in Control (en baseline-bron in Measure)</text>

  <!-- Achtergrond-cirkel (pad van de cyclus) -->
  <circle role="presentation" cx="480" cy="380" r="230" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Pijlen tussen fasen (met de klok mee) -->
  <path d="M 552,180 Q 655,200 678,260" fill="none" stroke="#2980B9" stroke-width="2.5" marker-end="url(#arrow-define)"/>
  <path d="M 700,358 Q 712,465 650,515" fill="none" stroke="#D35400" stroke-width="2.5" marker-end="url(#arrow-measure)"/>
  <path d="M 548,565 Q 480,605 408,565" fill="none" stroke="#8E44AD" stroke-width="2.5" marker-end="url(#arrow-analyze)"/>
  <path d="M 308,515 Q 250,465 258,358" fill="none" stroke="#27AE60" stroke-width="2.5" marker-end="url(#arrow-improve)"/>
  <path d="M 278,260 Q 305,200 408,180" fill="none" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arrow-define)"/>

  <!-- ─────────── DEFINE (boven) ─────────── -->
  <g filter="url(#shadow)">
    <circle cx="480" cy="146" r="74" fill="url(#grad-define)"/>
  </g>
  <text x="480" y="138" text-anchor="middle" font-size="19" font-weight="700" fill="white" letter-spacing="2">DEFINE</text>
  <text x="480" y="158" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.90)">Wat is het probleem?</text>
  <text x="480" y="174" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.78)" font-style="italic">SIPOC · charter · CTQ</text>
  <circle cx="418" cy="98" r="15" fill="#1F2937"/>
  <text x="418" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="white">1</text>

  <!-- ─────────── MEASURE (rechtsboven) — met SPC-accent-ring ─────────── -->
  <circle cx="700" cy="290" r="88" fill="none" stroke="#E67E22" stroke-width="2" stroke-dasharray="4,4" opacity="0.55"/>
  <g filter="url(#shadow)">
    <circle cx="700" cy="290" r="74" fill="url(#grad-measure)"/>
  </g>
  <text x="700" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="white" letter-spacing="2">MEASURE</text>
  <text x="700" y="300" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.90)">Wat is de baseline?</text>
  <text x="700" y="316" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.78)" font-style="italic">SPC-baseline · Gage R&amp;R</text>
  <circle cx="775" cy="242" r="15" fill="#1F2937"/>
  <text x="775" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="white">2</text>
  <!-- SPC-label naast Measure -->
  <rect x="793" y="282" width="58" height="22" rx="11" fill="#E67E22" opacity="0.92"/>
  <text x="822" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="white">SPC</text>

  <!-- ─────────── ANALYZE (rechtsonder) ─────────── -->
  <g filter="url(#shadow)">
    <circle cx="610" cy="530" r="74" fill="url(#grad-analyze)"/>
  </g>
  <text x="610" y="520" text-anchor="middle" font-size="18" font-weight="700" fill="white" letter-spacing="2">ANALYZE</text>
  <text x="610" y="540" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.90)">Wat is de oorzaak?</text>
  <text x="610" y="556" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.78)" font-style="italic">visgraat · 5-Why · Pareto</text>
  <circle cx="685" cy="578" r="15" fill="#1F2937"/>
  <text x="685" y="583" text-anchor="middle" font-size="12" font-weight="700" fill="white">3</text>

  <!-- ─────────── IMPROVE (linksonder) ─────────── -->
  <g filter="url(#shadow)">
    <circle cx="350" cy="530" r="74" fill="url(#grad-improve)"/>
  </g>
  <text x="350" y="520" text-anchor="middle" font-size="18" font-weight="700" fill="white" letter-spacing="2">IMPROVE</text>
  <text x="350" y="540" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.90)">Wat lost het op?</text>
  <text x="350" y="556" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.78)" font-style="italic">pilot · DOE · standaardwerk</text>
  <circle cx="275" cy="578" r="15" fill="#1F2937"/>
  <text x="275" y="583" text-anchor="middle" font-size="12" font-weight="700" fill="white">4</text>

  <!-- ─────────── CONTROL (linksboven) — met DIKKE SPC-accent-ring (kernrol) ─────────── -->
  <circle cx="260" cy="290" r="92" fill="none" stroke="#E74C3C" stroke-width="3" stroke-dasharray="5,3" opacity="0.75"/>
  <g filter="url(#shadow)">
    <circle cx="260" cy="290" r="74" fill="url(#grad-control)"/>
  </g>
  <text x="260" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="white" letter-spacing="2">CONTROL</text>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.90)">Hoe borgen we het?</text>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.78)" font-style="italic">control plan · SPC-kaart · audit</text>
  <circle cx="186" cy="242" r="15" fill="#1F2937"/>
  <text x="186" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="white">5</text>
  <!-- SPC-label naast Control — prominenter -->
  <rect x="109" y="282" width="70" height="26" rx="13" fill="#E74C3C"/>
  <text x="144" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="white">SPC ★</text>

  <!-- ─────────── CENTRAAL ELEMENT ─────────── -->
  <g filter="url(#shadow)">
    <circle cx="480" cy="380" r="90" fill="url(#grad-center)"/>
  </g>
  <text x="480" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="white" letter-spacing="3">Six Sigma</text>
  <text x="480" y="378" text-anchor="middle" font-size="10" fill="#F3F4F6">doel: 3,4 DPMO</text>
  <text x="480" y="398" text-anchor="middle" font-size="9" fill="#9CA3AF" font-style="italic">Motorola 1986 · Bill Smith</text>
  <text x="480" y="412" text-anchor="middle" font-size="9" fill="#9CA3AF" font-style="italic">GE jaren '90 · Jack Welch</text>
  <text x="480" y="432" text-anchor="middle" font-size="9" fill="#FFD700" font-weight="600">DMAIC = volgorde</text>

  <!-- ─────────── BOX: SIGMA-NIVEAU vs CPK ─────────── -->
  <g>
    <rect x="690" y="430" width="240" height="100" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="810" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#2C3E50">Let op: taal</text>
    <line x1="708" y1="460" x2="912" y2="460" stroke="#CBD5E1" stroke-width="1"/>
    <text x="702" y="478" font-size="10" fill="#374151" font-weight="600">Sigma-niveau</text>
    <text x="702" y="492" font-size="9" fill="#6B7280" font-style="italic">managementmaat voor defectkans</text>
    <text x="702" y="504" font-size="9" fill="#6B7280" font-style="italic">(met 1,5σ-shift)</text>
    <text x="702" y="520" font-size="10" fill="#374151" font-weight="600">Cpk</text>
    <text x="702" y="532" font-size="9" fill="#6B7280" font-style="italic">capability-index uit SPC</text>
  </g>

  <!-- ─────────── KERNBOODSCHAP ─────────── -->
  <g>
    <rect x="60" y="560" width="580" height="56" rx="8" fill="#FFFFFF" stroke="#3498DB" stroke-width="2"/>
    <text x="80" y="582" font-size="12" font-weight="700" fill="#2C3E50">Kernboodschap voor de werkvloer:</text>
    <text x="80" y="602" font-size="11" fill="#374151" font-style="italic">"Een regelkaart is niet het hele verbeterproces, maar wel</text>
    <text x="80" y="616" font-size="11" fill="#374151" font-style="italic">het instrument waarmee je ziet of een verbetering blijft staan."</text>
  </g>

  <!-- ─────────── CASUS-STROOK (fictief) ─────────── -->
  <g>
    <rect role="presentation" x="60" y="640" width="840" height="46" rx="8" fill="#FFFBEA" stroke="#F59E0B" stroke-width="1"/>
    <text x="80" y="660" font-size="12" font-weight="700" fill="#92400E">Fictieve casus — verpakkingslijn:</text>
    <text x="280" y="660" font-size="11" fill="#374151">Cpk 1,15; uitval 0,8% door scheve etiketten.</text>
    <text x="80" y="678" font-size="10" fill="#6B7280" font-style="italic">D: scope · M: baseline · A: visgraat → lijmtemperatuur · I: PID-regeling · C: SPC-borging. (illustratieve cijfers, geen specifieke casus)</text>
  </g>

  <!-- Bronvermelding -->
  <text x="480" y="708" text-anchor="middle" font-size="9" fill="#999">Bron: ASQ Six Sigma-definitie · Motorola/Bill Smith (1986) · GE/Jack Welch jaren '90 · Pyzdek 'Six Sigma Handbook' · ko-spc-401 · AIMM SPC Module 3 — Op Maat</text>
</svg>
