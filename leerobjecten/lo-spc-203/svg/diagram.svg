<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">De vier stappen bij een out-of-control signaal — operator-respons</title>
  <desc id="desc">Een verticale flow van vier genummerde stappen die de operator achtereenvolgens uitvoert na een signaal op de regelkaart. Stap 1: meetfout uitsluiten — verifieer de meting met een ander instrument of referentiestuk. Stap 2: laatste proceswijziging checken — kijk wat recent is veranderd zoals batch, setup, ploeg of onderhoud. Stap 3: verdachte output veiligstellen — zet producten gemaakt rond het signaal apart in een rode bak. Stap 4: teamleider informeren — geef alle informatie door, zodat die kan beslissen over doorgaan, stilleggen of inspectie. Onder de flow staat een vergelijking tussen wat je wel doet en wat je niet doet bij een signaal. De kernregel onderaan: geen actie zonder verificatie, geen hervatting zonder oorzaakanalyse.</desc>

  <defs>
    <linearGradient id="bg-step1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="bg-step2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="bg-step3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="bg-step4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="bg-doen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="bg-nietdoen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-down" markerWidth="12" markerHeight="12" refX="6" refY="10" orient="auto">
      <path d="M2,2 L6,10 L10,2" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="900" height="760" fill="#F8F6F0"/>

  <!-- Titel -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50" letter-spacing="1">De vier stappen bij een signaal</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#7f8c8d" letter-spacing="0.5">Wat doe je — in welke volgorde — als de regelkaart een signaal geeft?</text>

  <!-- ─────────── SIGNAAL-AANLEIDING ─────────── -->
  <g>
    <rect x="320" y="80" width="260" height="48" rx="24" fill="#7F1D1D" filter="url(#shadow)"/>
    <text x="450" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="white">⚠ SIGNAAL OP REGELKAART</text>
    <text x="450" y="120" text-anchor="middle" font-size="11" fill="#FECACA" font-style="italic">punt buiten grens · trend · cluster</text>
  </g>

  <!-- Pijl naar stap 1 -->
  <line x1="450" y1="135" x2="450" y2="155" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow-down)"/>

  <!-- ─────────── STAP 1 ─────────── -->
  <g>
    <rect x="120" y="160" width="660" height="78" rx="12" fill="url(#bg-step1)" filter="url(#shadow)"/>
    <circle cx="160" cy="199" r="26" fill="#1E40AF"/>
    <text x="160" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="white">1</text>
    <text x="205" y="188" font-size="15" font-weight="700" fill="#1E3A8A">Meetfout uitsluiten</text>
    <text x="205" y="208" font-size="12" fill="#1F2937">Klopt mijn meting wel? Verifieer met ander instrument of referentiestuk.</text>
    <text x="205" y="226" font-size="11" fill="#374151" font-style="italic">Check: gecalibreerd? · juiste procedure? · referentiestuk? · juiste methode?</text>
  </g>

  <!-- Pijl naar stap 2 -->
  <line x1="450" y1="245" x2="450" y2="265" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow-down)"/>

  <!-- ─────────── STAP 2 ─────────── -->
  <g>
    <rect x="120" y="270" width="660" height="78" rx="12" fill="url(#bg-step2)" filter="url(#shadow)"/>
    <circle cx="160" cy="309" r="26" fill="#3730A3"/>
    <text x="160" y="317" text-anchor="middle" font-size="22" font-weight="700" fill="white">2</text>
    <text x="205" y="298" font-size="15" font-weight="700" fill="#312E81">Laatste proceswijziging checken</text>
    <text x="205" y="318" font-size="12" fill="#1F2937">Wat is recent veranderd? Begin bij vandaag, werk terug.</text>
    <text x="205" y="336" font-size="11" fill="#374151" font-style="italic">Check: batch · setup · ploeg · onderhoud · gereedschap · omgeving</text>
  </g>

  <!-- Pijl naar stap 3 -->
  <line x1="450" y1="355" x2="450" y2="375" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow-down)"/>

  <!-- ─────────── STAP 3 ─────────── -->
  <g>
    <rect x="120" y="380" width="660" height="78" rx="12" fill="url(#bg-step3)" filter="url(#shadow)"/>
    <circle cx="160" cy="419" r="26" fill="#B45309"/>
    <text x="160" y="427" text-anchor="middle" font-size="22" font-weight="700" fill="white">3</text>
    <text x="205" y="408" font-size="15" font-weight="700" fill="#78350F">Verdachte output veiligstellen</text>
    <text x="205" y="428" font-size="12" fill="#1F2937">Producten gemaakt rond het signaal-moment apart zetten. Niet doorvoeren.</text>
    <text x="205" y="446" font-size="11" fill="#374151" font-style="italic">Hoe: rode bak / quarantainezone · markeren met datum + tijd + reden</text>
  </g>

  <!-- Pijl naar stap 4 -->
  <line x1="450" y1="465" x2="450" y2="485" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow-down)"/>

  <!-- ─────────── STAP 4 ─────────── -->
  <g>
    <rect x="120" y="490" width="660" height="78" rx="12" fill="url(#bg-step4)" filter="url(#shadow)"/>
    <circle cx="160" cy="529" r="26" fill="#9A3412"/>
    <text x="160" y="537" text-anchor="middle" font-size="22" font-weight="700" fill="white">4</text>
    <text x="205" y="518" font-size="15" font-weight="700" fill="#7C2D12">Teamleider informeren</text>
    <text x="205" y="538" font-size="12" fill="#1F2937">Geen zelf-corrigeren zonder consult. Bel met informatie, niet met een vraag.</text>
    <text x="205" y="556" font-size="11" fill="#374151" font-style="italic">Geef door: wat afging · wat je vond bij stap 1 + 2 · waar verdachte output staat</text>
  </g>

  <!-- ─────────── WEL DOEN / NIET DOEN ─────────── -->
  <g>
    <!-- Wel doen -->
    <rect x="40" y="595" width="405" height="98" rx="10" fill="url(#bg-doen)" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="619" font-size="13" font-weight="700" fill="#065F46">✓ WEL DOEN</text>
    <text x="60" y="640" font-size="11" fill="#1F2937">
      <tspan x="60" dy="0">• De vier stappen in de juiste volgorde</tspan>
      <tspan x="60" dy="15">• Eerst verifiëren, dan pas iets doen</tspan>
      <tspan x="60" dy="15">• Verdachte output meteen apart zetten</tspan>
      <tspan x="60" dy="15">• Teamleider bellen met informatie</tspan>
    </text>

    <!-- Niet doen -->
    <rect x="455" y="595" width="405" height="98" rx="10" fill="url(#bg-nietdoen)" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="475" y="619" font-size="13" font-weight="700" fill="#991B1B">✗ NIET DOEN</text>
    <text x="475" y="640" font-size="11" fill="#1F2937">
      <tspan x="475" dy="0">• Direct aan een knop draaien (= tampering)</tspan>
      <tspan x="475" dy="15">• Het signaal negeren ('komt wel goed')</tspan>
      <tspan x="475" dy="15">• Wachten op een tweede signaal</tspan>
      <tspan x="475" dy="15">• Verdachte output doorvoeren</tspan>
    </text>
  </g>

  <!-- ─────────── KERNREGEL ─────────── -->
  <rect x="60" y="710" width="780" height="32" rx="8" fill="#1F2937"/>
  <text x="450" y="731" text-anchor="middle" font-size="13" font-weight="600" fill="white">Geen actie zonder verificatie · Geen hervatting zonder oorzaakanalyse</text>

  <!-- Bronvermelding -->
  <text x="450" y="755" text-anchor="middle" font-size="9" fill="#999">Bron: AIAG SPC Reference Manual · Ford PPAP Reaction Plan · AIMM SPC Module 1</text>
</svg>
