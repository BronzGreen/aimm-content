<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Drie stappen van anomaliedetectie</title>
  <desc id="desc">Cyclusdiagram dat de drie stappen van anomaliedetectie toont: eerst leert het systeem het normale patroon, dan vergelijkt het nieuwe sensordata met dat patroon, en ten slotte markeert het afwijkingen zodat de operator actie kan ondernemen.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" role="presentation"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626" role="presentation"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669" role="presentation"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect width="600" height="400" fill="#F8FAFC" rx="8" role="presentation"/>

  <!-- Titel -->
  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E293B">Drie stappen anomaliedetectie</text>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#64748B">Zo herkent een AI-systeem afwijkingen in sensordata</text>

  <!-- Stap 1: Leren — blauw -->
  <circle cx="150" cy="160" r="70" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text x="150" y="135" text-anchor="middle" font-size="28" role="presentation">&#x1F4CA;</text>
  <text x="150" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563EB">1. Leren</text>
  <text x="150" y="183" text-anchor="middle" font-size="11" fill="#1E40AF">Normaal patroon</text>
  <text x="150" y="197" text-anchor="middle" font-size="11" fill="#1E40AF">herkennen</text>

  <!-- Mini-grafiek in stap 1: stabiele lijn -->
  <polyline points="110,215 120,210 130,215 140,210 150,213 160,210 170,215 180,210 190,213" fill="none" stroke="#2563EB" stroke-width="2" role="presentation"/>

  <!-- Pijl 1 naar 2 -->
  <path d="M 222 145 Q 300 90 378 145" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="300" y="105" text-anchor="middle" font-size="10" fill="#64748B">Nieuwe data</text>

  <!-- Stap 2: Vergelijken — rood -->
  <circle cx="450" cy="160" r="70" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>
  <text x="450" y="135" text-anchor="middle" font-size="28" role="presentation">&#x1F50D;</text>
  <text x="450" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#DC2626">2. Vergelijken</text>
  <text x="450" y="183" text-anchor="middle" font-size="11" fill="#991B1B">Nieuwe data vs.</text>
  <text x="450" y="197" text-anchor="middle" font-size="11" fill="#991B1B">normaal patroon</text>

  <!-- Mini-grafiek in stap 2: lijn met uitbijter -->
  <polyline points="410,215 420,210 430,215 440,210 450,195 460,210 470,215 480,210 490,213" fill="none" stroke="#DC2626" stroke-width="2" role="presentation"/>
  <circle cx="450" cy="195" r="3" fill="#DC2626" role="presentation"/>

  <!-- Pijl 2 naar 3 -->
  <path d="M 450 232 Q 450 310 345 320" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="430" y="280" text-anchor="middle" font-size="10" fill="#64748B">Afwijking gevonden</text>

  <!-- Stap 3: Markeren — groen -->
  <circle cx="300" cy="320" r="60" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
  <text x="300" y="300" text-anchor="middle" font-size="28" role="presentation">&#x26A0;&#xFE0F;</text>
  <text x="300" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#059669">3. Markeren</text>
  <text x="300" y="348" text-anchor="middle" font-size="11" fill="#065F46">Operator krijgt melding</text>

  <!-- Pijl 3 terug naar 1 (cyclus) -->
  <path d="M 242 310 Q 120 310 140 232" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="155" y="280" text-anchor="middle" font-size="10" fill="#64748B">Feedback</text>

  <!-- Legenda -->
  <rect x="20" y="375" width="10" height="10" fill="#2563EB" rx="2" role="presentation"/>
  <text x="35" y="384" font-size="10" fill="#64748B">Normaal</text>
  <rect x="90" y="375" width="10" height="10" fill="#DC2626" rx="2" role="presentation"/>
  <text x="105" y="384" font-size="10" fill="#64748B">Anomalie</text>
  <rect x="170" y="375" width="10" height="10" fill="#059669" rx="2" role="presentation"/>
  <text x="185" y="384" font-size="10" fill="#64748B">Actie</text>

  <!-- Bron -->
  <text x="590" y="392" text-anchor="end" font-size="8" fill="#94A3B8">AIMM | ko-smart-mfg-092</text>
</svg>