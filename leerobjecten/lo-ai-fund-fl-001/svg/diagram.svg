<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Federated Learning: lokale clients sturen alleen modelparameters naar een centrale server</title>
  <desc id="desc">Een schematische weergave van de federated learning architectuur. Drie lokale clients — fabriek A, fabriek B en fabriek C — bewaren hun ruwe productiedata achter een muur. Elke client traint lokaal een kopie van het globale model en stuurt alleen de modelparameters (gewichten, geen data) omhoog naar een centrale aggregatie-server. De centrale server combineert de parameters via FedAVG tot een verbeterd globaal model en stuurt dat terug naar de clients. Het diagram benadrukt de drie kernkenmerken: data blijft lokaal, alleen parameters reizen, centrale aggregatie.</desc>

  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="g-server" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
    <linearGradient id="g-client-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="g-client-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <linearGradient id="g-client-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8c8d"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9B59B6"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="1920" height="1080" fill="#FAFAF8"/>

  <!-- Titel -->
  <text x="960" y="70" text-anchor="middle" font-size="40" font-weight="700" fill="#2C3E50" letter-spacing="1">Federated Learning — samen leren zonder data te delen</text>
  <text x="960" y="108" text-anchor="middle" font-size="20" fill="#7f8c8d">Ruwe data blijft lokaal. Alleen modelparameters reizen. De centrale server aggregeert.</text>

  <!-- ── CENTRALE SERVER (boven) ── -->
  <g filter="url(#shadow)">
    <rect role="presentation" x="710" y="170" width="500" height="200" rx="20" fill="url(#g-server)"/>
  </g>
  <text x="960" y="208" text-anchor="middle" font-size="16" fill="#B0BEC5" letter-spacing="3" font-weight="600">CENTRALE SERVER</text>
  <text x="960" y="248" text-anchor="middle" font-size="30" font-weight="700" fill="white">Globaal model</text>
  <text x="960" y="285" text-anchor="middle" font-size="18" fill="#ECF0F1">Aggregatie van parameters</text>
  <text x="960" y="312" text-anchor="middle" font-size="16" fill="#B0BEC5" font-style="italic">FedAVG: gemiddelde van de gewichten</text>
  <rect role="presentation" x="820" y="328" width="280" height="30" rx="6" fill="#1A2733" opacity="0.5"/>
  <text x="960" y="349" text-anchor="middle" font-size="14" fill="#ECF0F1">w_global = (w_A + w_B + w_C) / 3</text>

  <!-- ── DRIE CLIENTS (onder) ── -->

  <!-- CLIENT A -->
  <g filter="url(#shadow)">
    <rect role="presentation" x="120" y="610" width="440" height="380" rx="20" fill="white"/>
    <rect role="presentation" x="120" y="610" width="440" height="80" rx="20" fill="url(#g-client-a)"/>
    <rect role="presentation" x="120" y="660" width="440" height="30" fill="url(#g-client-a)"/>
  </g>
  <text x="340" y="650" text-anchor="middle" font-size="16" fill="white" letter-spacing="3" font-weight="600">CLIENT A</text>
  <text x="340" y="680" text-anchor="middle" font-size="26" fill="white" font-weight="700">Fabriek Tilburg</text>

  <!-- Lokale data — achter een muur -->
  <rect role="presentation" x="160" y="720" width="360" height="100" rx="10" fill="#EBF5FB" stroke="#2980B9" stroke-width="2"/>
  <text x="340" y="752" text-anchor="middle" font-size="16" fill="#2980B9" font-weight="700">🔒 Lokale ruwe data (blijft hier)</text>
  <text x="340" y="780" text-anchor="middle" font-size="14" fill="#555">Vibration-data, oorzaakcodes,</text>
  <text x="340" y="800" text-anchor="middle" font-size="14" fill="#555">RUL-history van lagers</text>

  <!-- Lokaal model -->
  <rect role="presentation" x="160" y="840" width="360" height="120" rx="10" fill="#FAFAF8" stroke="#3498DB" stroke-width="1.5"/>
  <text x="340" y="868" text-anchor="middle" font-size="15" fill="#2980B9" font-weight="600">Lokaal model (kopie van globaal)</text>
  <text x="340" y="894" text-anchor="middle" font-size="13" fill="#555">Wordt getraind op lokale data</text>
  <rect role="presentation" x="220" y="908" width="240" height="40" rx="6" fill="url(#g-client-a)"/>
  <text x="340" y="935" text-anchor="middle" font-size="18" font-weight="700" fill="white">Parameters w_A</text>

  <!-- CLIENT B -->
  <g filter="url(#shadow)">
    <rect role="presentation" x="740" y="610" width="440" height="380" rx="20" fill="white"/>
    <rect role="presentation" x="740" y="610" width="440" height="80" rx="20" fill="url(#g-client-b)"/>
    <rect role="presentation" x="740" y="660" width="440" height="30" fill="url(#g-client-b)"/>
  </g>
  <text x="960" y="650" text-anchor="middle" font-size="16" fill="white" letter-spacing="3" font-weight="600">CLIENT B</text>
  <text x="960" y="680" text-anchor="middle" font-size="26" fill="white" font-weight="700">Fabriek Eindhoven</text>

  <rect role="presentation" x="780" y="720" width="360" height="100" rx="10" fill="#FDF2E9" stroke="#D35400" stroke-width="2"/>
  <text x="960" y="752" text-anchor="middle" font-size="16" fill="#D35400" font-weight="700">🔒 Lokale ruwe data (blijft hier)</text>
  <text x="960" y="780" text-anchor="middle" font-size="14" fill="#555">Vibration-data, oorzaakcodes,</text>
  <text x="960" y="800" text-anchor="middle" font-size="14" fill="#555">RUL-history van lagers</text>

  <rect role="presentation" x="780" y="840" width="360" height="120" rx="10" fill="#FAFAF8" stroke="#E67E22" stroke-width="1.5"/>
  <text x="960" y="868" text-anchor="middle" font-size="15" fill="#D35400" font-weight="600">Lokaal model (kopie van globaal)</text>
  <text x="960" y="894" text-anchor="middle" font-size="13" fill="#555">Wordt getraind op lokale data</text>
  <rect role="presentation" x="840" y="908" width="240" height="40" rx="6" fill="url(#g-client-b)"/>
  <text x="960" y="935" text-anchor="middle" font-size="18" font-weight="700" fill="white">Parameters w_B</text>

  <!-- CLIENT C -->
  <g filter="url(#shadow)">
    <rect role="presentation" x="1360" y="610" width="440" height="380" rx="20" fill="white"/>
    <rect role="presentation" x="1360" y="610" width="440" height="80" rx="20" fill="url(#g-client-c)"/>
    <rect role="presentation" x="1360" y="660" width="440" height="30" fill="url(#g-client-c)"/>
  </g>
  <text x="1580" y="650" text-anchor="middle" font-size="16" fill="white" letter-spacing="3" font-weight="600">CLIENT C</text>
  <text x="1580" y="680" text-anchor="middle" font-size="26" fill="white" font-weight="700">Fabriek Venlo</text>

  <rect role="presentation" x="1400" y="720" width="360" height="100" rx="10" fill="#E9F7EF" stroke="#27AE60" stroke-width="2"/>
  <text x="1580" y="752" text-anchor="middle" font-size="16" fill="#27AE60" font-weight="700">🔒 Lokale ruwe data (blijft hier)</text>
  <text x="1580" y="780" text-anchor="middle" font-size="14" fill="#555">Vibration-data, oorzaakcodes,</text>
  <text x="1580" y="800" text-anchor="middle" font-size="14" fill="#555">RUL-history van lagers</text>

  <rect role="presentation" x="1400" y="840" width="360" height="120" rx="10" fill="#FAFAF8" stroke="#2ECC71" stroke-width="1.5"/>
  <text x="1580" y="868" text-anchor="middle" font-size="15" fill="#27AE60" font-weight="600">Lokaal model (kopie van globaal)</text>
  <text x="1580" y="894" text-anchor="middle" font-size="13" fill="#555">Wordt getraind op lokale data</text>
  <rect role="presentation" x="1460" y="908" width="240" height="40" rx="6" fill="url(#g-client-c)"/>
  <text x="1580" y="935" text-anchor="middle" font-size="18" font-weight="700" fill="white">Parameters w_C</text>

  <!-- ── PIJLEN: parameters omhoog ── -->
  <line x1="340" y1="840" x2="820" y2="380" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrow-up)" stroke-dasharray="0"/>
  <line x1="960" y1="840" x2="960" y2="380" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrow-up)"/>
  <line x1="1580" y1="840" x2="1100" y2="380" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrow-up)"/>

  <!-- Pijl-labels (parameters omhoog) -->
  <rect role="presentation" x="500" y="500" width="190" height="34" rx="6" fill="white" stroke="#7f8c8d" stroke-width="1"/>
  <text x="595" y="523" text-anchor="middle" font-size="14" fill="#2C3E50" font-weight="600">⬆ alleen parameters</text>

  <rect role="presentation" x="855" y="500" width="210" height="34" rx="6" fill="white" stroke="#7f8c8d" stroke-width="1"/>
  <text x="960" y="523" text-anchor="middle" font-size="14" fill="#2C3E50" font-weight="600">⬆ alleen parameters</text>

  <rect role="presentation" x="1230" y="500" width="190" height="34" rx="6" fill="white" stroke="#7f8c8d" stroke-width="1"/>
  <text x="1325" y="523" text-anchor="middle" font-size="14" fill="#2C3E50" font-weight="600">⬆ alleen parameters</text>

  <!-- ── PIJL: globaal model omlaag (return) ── -->
  <path d="M 1210 270 Q 1820 320 1820 580 Q 1820 600 1800 600" stroke="#9B59B6" stroke-width="3" fill="none" marker-end="url(#arrow-down)" stroke-dasharray="8,5"/>
  <rect role="presentation" x="1690" y="430" width="220" height="34" rx="6" fill="white" stroke="#9B59B6" stroke-width="1"/>
  <text x="1800" y="453" text-anchor="middle" font-size="14" fill="#8E44AD" font-weight="600">⬇ globaal model retour</text>

  <!-- ── DRIE KENMERKEN ONDERAAN ── -->
  <g filter="url(#shadow)">
    <rect role="presentation" x="120" y="1010" width="540" height="50" rx="10" fill="white" stroke="#2980B9" stroke-width="2"/>
  </g>
  <text x="390" y="1042" text-anchor="middle" font-size="16" fill="#2C3E50" font-weight="600">1. Data blijft lokaal — privacy &amp; IP behouden</text>

  <g filter="url(#shadow)">
    <rect role="presentation" x="690" y="1010" width="540" height="50" rx="10" fill="white" stroke="#D35400" stroke-width="2"/>
  </g>
  <text x="960" y="1042" text-anchor="middle" font-size="16" fill="#2C3E50" font-weight="600">2. Alleen modelparameters reizen — bandbreedte-vriendelijk</text>

  <g filter="url(#shadow)">
    <rect role="presentation" x="1260" y="1010" width="540" height="50" rx="10" fill="white" stroke="#27AE60" stroke-width="2"/>
  </g>
  <text x="1530" y="1042" text-anchor="middle" font-size="16" fill="#2C3E50" font-weight="600">3. Centrale aggregatie — samen sneller leren</text>

  <!-- Bronvermelding -->
  <text x="960" y="1075" text-anchor="middle" font-size="13" fill="#999">Federated Learning — AIMM Curriculum | Module 2: Train | v1.0</text>
</svg>
