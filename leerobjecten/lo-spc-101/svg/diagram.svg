<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 960 560"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Anatomie van een regelkaart — drie componenten</title>
  <desc id="svg-desc">
    Educatief diagram van een regelkaart volgens ASQ en ISO 7870-1/-2. Toont
    drie componenten: (1) de centrale lijn (CL) als gemiddelde van het proces,
    (2) de bovengrens UCL en ondergrens LCL als procesgrenzen (niet
    klantspecificaties), en (3) acht meetpunten in volgorde van tijd
    links-naar-rechts. De eerste zes punten schommelen willekeurig rond de
    centrale lijn (stabiel gedrag). Punt 8 ligt boven UCL en is gemarkeerd
    als signaalvoorbeeld — één punt buiten grenzen is per definitie een
    signaal van onstabiel gedrag volgens Shewhart 1931.
  </desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .axis { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .axis-label { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .cl-line { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-dasharray: 0; }
      .limit-line { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .limit-label { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #dc2626; }
      .cl-label { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #2563eb; }
      .point { fill: #0f172a; stroke: #ffffff; stroke-width: 1.5; }
      .point-signal { fill: #dc2626; stroke: #ffffff; stroke-width: 2; }
      .connector { stroke: #cbd5e1; stroke-width: 1.2; fill: none; }
      .callout { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #0f172a; }
      .callout-bold { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .callout-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .signal-box { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
      .signal-text { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #7f1d1d; font-weight: 600; }
      .source-note { font-family: Inter, Arial, sans-serif; font-size: 11px; fill: #64748b; font-style: italic; }
      .fictief { font-family: Inter, Arial, sans-serif; font-size: 10px; fill: #94a3b8; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="960" height="560"/>

  <!-- Title -->
  <text class="title" x="40" y="42">Anatomie van een regelkaart</text>
  <text class="subtitle" x="40" y="64">Drie componenten — centrale lijn, procesgrenzen, punten in tijd</text>

  <!-- Chart panel -->
  <rect class="panel" x="120" y="100" width="620" height="360" rx="6"/>

  <!-- Y-axis -->
  <line class="axis" x1="160" y1="120" x2="160" y2="430"/>
  <!-- X-axis -->
  <line class="axis" x1="160" y1="430" x2="720" y2="430"/>

  <!-- UCL line (y=160) -->
  <line class="limit-line" x1="160" y1="160" x2="720" y2="160"/>
  <text class="limit-label" x="128" y="164" text-anchor="end">UCL</text>

  <!-- Central line (y=280) -->
  <line class="cl-line" x1="160" y1="280" x2="720" y2="280"/>
  <text class="cl-label" x="128" y="284" text-anchor="end">CL</text>

  <!-- LCL line (y=400) -->
  <line class="limit-line" x1="160" y1="400" x2="720" y2="400"/>
  <text class="limit-label" x="128" y="404" text-anchor="end">LCL</text>

  <!-- Time axis labels -->
  <text class="axis-label" x="200" y="450" text-anchor="middle">1</text>
  <text class="axis-label" x="260" y="450" text-anchor="middle">2</text>
  <text class="axis-label" x="320" y="450" text-anchor="middle">3</text>
  <text class="axis-label" x="380" y="450" text-anchor="middle">4</text>
  <text class="axis-label" x="440" y="450" text-anchor="middle">5</text>
  <text class="axis-label" x="500" y="450" text-anchor="middle">6</text>
  <text class="axis-label" x="560" y="450" text-anchor="middle">7</text>
  <text class="axis-label" x="620" y="450" text-anchor="middle">8</text>
  <text class="axis-label" x="440" y="472" text-anchor="middle">tijd (meting-nummer) →</text>

  <!-- Connector line between points (subtle) -->
  <polyline class="connector"
            points="200,296 260,264 320,288 380,272 440,292 500,268 560,308 620,140"/>

  <!-- Points (8 in sequence; first 7 stabiel rond CL; point 8 boven UCL) -->
  <circle class="point" cx="200" cy="296" r="6"/>
  <circle class="point" cx="260" cy="264" r="6"/>
  <circle class="point" cx="320" cy="288" r="6"/>
  <circle class="point" cx="380" cy="272" r="6"/>
  <circle class="point" cx="440" cy="292" r="6"/>
  <circle class="point" cx="500" cy="268" r="6"/>
  <circle class="point" cx="560" cy="308" r="6"/>
  <!-- Point 8: signal (boven UCL) -->
  <circle class="point-signal" cx="620" cy="140" r="8"/>

  <!-- Callout: Centrale lijn -->
  <g>
    <line class="connector" x1="360" y1="280" x2="360" y2="500" stroke-dasharray="2 3"/>
    <rect class="callout-box" x="240" y="500" width="240" height="44" rx="4"/>
    <text class="callout-bold" x="252" y="518">1. Centrale lijn (CL)</text>
    <text class="callout" x="252" y="535">Gemiddelde van je proces</text>
  </g>

  <!-- Callout: UCL/LCL -->
  <g>
    <line class="connector" x1="720" y1="160" x2="800" y2="200" stroke-dasharray="2 3"/>
    <line class="connector" x1="720" y1="400" x2="800" y2="200" stroke-dasharray="2 3"/>
    <rect class="callout-box" x="760" y="170" width="176" height="64" rx="4"/>
    <text class="callout-bold" x="772" y="190">2. UCL / LCL</text>
    <text class="callout" x="772" y="208">Grenzen van normaal</text>
    <text class="callout" x="772" y="224">procesgedrag</text>
  </g>

  <!-- Callout: Punten in tijd -->
  <g>
    <line class="connector" x1="500" y1="268" x2="540" y2="90" stroke-dasharray="2 3"/>
    <rect class="callout-box" x="420" y="60" width="240" height="40" rx="4"/>
    <text class="callout-bold" x="432" y="78">3. Punten in tijd</text>
    <text class="callout" x="432" y="94">Metingen in volgorde — links naar rechts</text>
  </g>

  <!-- Signal callout for point 8 -->
  <g>
    <rect class="signal-box" x="640" y="110" width="256" height="56" rx="6"/>
    <text class="signal-text" x="652" y="130">Signaalvoorbeeld</text>
    <text class="callout" x="652" y="147">Punt 8 ligt boven UCL —</text>
    <text class="callout" x="652" y="162">per definitie een signaal.</text>
  </g>

  <!-- Fictive label on the chart -->
  <text class="fictief" x="160" y="118">Fictieve illustratie ter oefening</text>

  <!-- Source note (bottom) -->
  <text class="source-note" x="40" y="520">
    Bron: Shewhart, W.A. (1931) Economic Control of Quality of Manufactured Product · ASQ — Control Chart definitie ·
  </text>
  <text class="source-note" x="40" y="536">
    ISO 7870-1 &amp; ISO 7870-2 · NIST/SEMATECH Engineering Statistics Handbook, Chapter 6
  </text>
  <text class="source-note" x="40" y="552">
    AIMM × BronzGreen · lo-spc-101 · Module 1 (Gebruik)
  </text>
</svg>
