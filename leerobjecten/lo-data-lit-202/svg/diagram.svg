<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Drie checks voor datakwaliteit</title>
  <desc id="desc">Een trapdiagram met drie opbouwende stappen om datakwaliteit te beoordelen: volledigheid (zijn alle velden ingevuld?), consistentie (kloppen de waarden?) en actualiteit (zijn de data nog vers?). Elke stap heeft een vuistregel en een icoon.</desc>

  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <linearGradient id="grad-arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BDC3C7"/>
      <stop offset="100%" stop-color="#95A5A6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95A5A6"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="800" height="500" fill="#FAFAF8"/>

  <!-- Titel -->
  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50" letter-spacing="1">Drie checks voor datakwaliteit</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#7f8c8d" letter-spacing="0.5">Controleer je data voordat je een beslissing neemt</text>

  <!-- Verticale pijl links -->
  <line x1="55" y1="420" x2="55" y2="110" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="42" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#7f8c8d" transform="rotate(-90,42,265)">Betrouwbaarheid</text>

  <!-- Stap 1: Volledigheid (onderste trede) -->
  <g filter="url(#shadow)">
    <rect x="90" y="310" width="200" height="110" rx="8" fill="url(#g1)"/>
    <text x="190" y="342" text-anchor="middle" font-size="28" fill="rgba(255,255,255,0.3)">1</text>
    <text x="190" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="white">Volledigheid</text>
    <text x="190" y="385" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Zijn alle velden ingevuld?</text>
    <text x="190" y="405" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">Vuistregel: &gt;10% leeg = voorzichtig</text>
  </g>

  <!-- Stap 2: Consistentie (middelste trede) -->
  <g filter="url(#shadow)">
    <rect x="310" y="200" width="200" height="110" rx="8" fill="url(#g2)"/>
    <text x="410" y="232" text-anchor="middle" font-size="28" fill="rgba(255,255,255,0.3)">2</text>
    <text x="410" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="white">Consistentie</text>
    <text x="410" y="275" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Kloppen de waarden?</text>
    <text x="410" y="295" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">Vuistregel: zelfde eenheid, logisch</text>
  </g>

  <!-- Stap 3: Actualiteit (bovenste trede) -->
  <g filter="url(#shadow)">
    <rect x="530" y="100" width="200" height="110" rx="8" fill="url(#g3)"/>
    <text x="630" y="132" text-anchor="middle" font-size="28" fill="rgba(255,255,255,0.3)">3</text>
    <text x="630" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="white">Actualiteit</text>
    <text x="630" y="175" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Zijn de data nog vers?</text>
    <text x="630" y="195" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)">Vuistregel: wanneer verzameld?</text>
  </g>

  <!-- Verbindingspijlen tussen treden -->
  <line x1="290" y1="355" x2="310" y2="295" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="510" y1="245" x2="530" y2="185" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Stoplichtsysteem onderaan -->
  <rect role="presentation" x="90" y="445" width="640" height="36" rx="6" fill="#F0F0EC"/>

  <!-- Groen -->
  <circle cx="200" cy="463" r="10" fill="#27AE60"/>
  <text x="220" y="467" font-size="11" fill="#2C3E50" font-weight="600">Alle 3 goed = ga door</text>

  <!-- Oranje -->
  <circle cx="400" cy="463" r="10" fill="#E67E22"/>
  <text x="420" y="467" font-size="11" fill="#2C3E50" font-weight="600">Twijfel = onderzoek eerst</text>

  <!-- Rood -->
  <circle cx="590" cy="463" r="10" fill="#E74C3C"/>
  <text x="610" y="467" font-size="11" fill="#2C3E50" font-weight="600">Slecht = stop</text>

  <!-- Bronvermelding -->
  <text x="400" y="495" text-anchor="middle" font-size="10" fill="#999">AIMM Data Literacy -- Datakwaliteit beoordelen</text>
</svg>
