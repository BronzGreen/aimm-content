<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Kwaliteitscontrole - Interactief Model</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const STEPS = [
      {
        id: "camera",
        label: "Stap 1: Camera",
        icon: "\uD83D\uDCF7",
        color: "bg-blue-500",
        colorLight: "bg-blue-50",
        borderColor: "border-blue-500",
        textColor: "text-blue-700",
        title: "Camera maakt foto",
        description: "Een camera op de productielijn maakt automatisch een foto van elk product. Dit gaat heel snel: minder dan 1 seconde per product.",
        details: [
          "De camera zit vast boven de lopende band.",
          "Elk product krijgt automatisch een foto.",
          "De foto gaat direct naar de computer.",
          "De operator hoeft niks te doen."
        ],
        question: "Hoeveel producten per dag controleer jij met het oog?",
      },
      {
        id: "ai",
        label: "Stap 2: AI-analyse",
        icon: "\uD83E\uDDE0",
        color: "bg-purple-500",
        colorLight: "bg-purple-50",
        borderColor: "border-purple-500",
        textColor: "text-purple-700",
        title: "AI analyseert het beeld",
        description: "Een deep learning model bekijkt de foto. Het model heeft geleerd van duizenden voorbeelden. Het zoekt naar patronen die wijzen op defecten.",
        details: [
          "Classificatie: het model zegt alleen 'goed' of 'fout'.",
          "Segmentatie: het model markeert precies waar het defect zit.",
          "Segmentatie is beter, want je ziet waarom het model beslist.",
          "Het model leert van veel foto's met en zonder defecten."
        ],
        question: "Wat is beter: weten dat iets fout is, of ook zien waar het fout zit?",
      },
      {
        id: "beslissing",
        label: "Stap 3: Beslissing",
        icon: "\u2705",
        color: "bg-orange-500",
        colorLight: "bg-orange-50",
        borderColor: "border-orange-500",
        textColor: "text-orange-700",
        title: "Beslissing over het product",
        description: "Op basis van de AI-analyse volgt een beslissing. Er zijn drie mogelijke uitkomsten voor elk product.",
        details: [
          "Goedgekeurd: het product is in orde en gaat door.",
          "Herbewerking: klein defect, het product gaat terug in de lijn.",
          "Afgekeurd: groot defect, het product gaat eruit."
        ],
        question: "Wie neemt uiteindelijk de beslissing: de AI of de operator?",
      }
    ];

    const EXAMPLE = {
      title: "Voorbeeld: isolatiepanelen",
      description: "Een fabrikant van isolatiepanelen gebruikt AI-kwaliteitscontrole.",
      facts: [
        { label: "Product", value: "Isolatiepanelen" },
        { label: "Controle", value: "Na het frezen" },
        { label: "Defecten", value: "Krassen, scheuren, onregelmatigheden" },
        { label: "Nauwkeurigheid", value: "99,5%" },
        { label: "Snelheid", value: "Minder dan 1 seconde per paneel" },
      ]
    };

    function App() {
      const [activeStep, setActiveStep] = useState(null);
      const [showExample, setShowExample] = useState(false);
      const [answers, setAnswers] = useState({});

      const active = STEPS.find(s => s.id === activeStep);

      const handleReset = () => {
        setActiveStep(null);
        setShowExample(false);
        setAnswers({});
      };

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <div className="bg-white border-b px-6 py-4">
            <div className="max-w-4xl mx-auto flex justify-between items-start">
              <div>
                <h1 className="text-2xl font-bold text-gray-900">
                  AI Kwaliteitscontrole
                </h1>
                <p className="text-gray-500 mt-1">
                  Klik op een stap om te ontdekken hoe het werkt
                </p>
              </div>
              <button
                onClick={handleReset}
                className="px-3 py-1.5 text-gray-500 hover:text-gray-700 text-sm flex items-center gap-1 border rounded-lg hover:bg-gray-50 transition-colors"
              >
                Opnieuw
              </button>
            </div>
          </div>

          {/* Content */}
          <div className="max-w-4xl mx-auto p-6">

            {/* Drie stappen als knoppen */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
              {STEPS.map((step, i) => (
                <button
                  key={step.id}
                  onClick={() => setActiveStep(activeStep === step.id ? null : step.id)}
                  className={`p-5 rounded-xl border-2 text-left transition-all duration-300 ${
                    activeStep === step.id
                      ? `${step.colorLight} ${step.borderColor} shadow-lg scale-[1.02]`
                      : "bg-white border-gray-200 hover:border-gray-300 hover:shadow-md"
                  }`}
                >
                  <div className="flex items-center gap-3 mb-2">
                    <span className="text-2xl">{step.icon}</span>
                    <span className={`text-xs font-bold uppercase tracking-wider ${
                      activeStep === step.id ? step.textColor : "text-gray-400"
                    }`}>
                      Stap {i + 1}
                    </span>
                  </div>
                  <div className={`font-bold text-lg ${
                    activeStep === step.id ? step.textColor : "text-gray-800"
                  }`}>
                    {step.title}
                  </div>

                  {/* Voortgangslijn */}
                  {i < STEPS.length - 1 && (
                    <div className="hidden md:block absolute right-0 top-1/2 w-4 h-0.5 bg-gray-300 transform translate-x-full" />
                  )}
                </button>
              ))}
            </div>

            {/* Voortgangsbalk */}
            <div className="flex items-center gap-2 mb-6">
              {STEPS.map((step, i) => (
                <React.Fragment key={step.id}>
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-all duration-300 ${
                    activeStep === step.id
                      ? `${step.color} text-white shadow-md`
                      : answers[step.id]
                        ? "bg-green-100 text-green-600 border-2 border-green-300"
                        : "bg-gray-200 text-gray-500"
                  }`}>
                    {answers[step.id] ? "\u2713" : i + 1}
                  </div>
                  {i < STEPS.length - 1 && (
                    <div className={`flex-1 h-1 rounded transition-all duration-500 ${
                      answers[step.id] ? "bg-green-300" : "bg-gray-200"
                    }`} />
                  )}
                </React.Fragment>
              ))}
            </div>

            {/* Detail paneel */}
            {active && (
              <div className={`rounded-xl border-2 ${active.borderColor} ${active.colorLight} p-6 mb-6 transition-all duration-300`}>
                <div className="flex items-center gap-3 mb-4">
                  <span className="text-3xl">{active.icon}</span>
                  <h2 className={`text-xl font-bold ${active.textColor}`}>{active.title}</h2>
                </div>

                <p className="text-gray-700 mb-4 leading-relaxed">{active.description}</p>

                <div className="mb-4">
                  <div className={`font-medium mb-2 ${active.textColor}`}>
                    Wat moet je weten:
                  </div>
                  <ul className="space-y-2">
                    {active.details.map((detail, i) => (
                      <li key={i} className="flex items-start gap-2 text-gray-700">
                        <span className={`mt-1.5 w-2 h-2 rounded-full ${active.color} flex-shrink-0`} />
                        {detail}
                      </li>
                    ))}
                  </ul>
                </div>

                {/* Denkvraag */}
                <div className="bg-white rounded-lg p-4 border border-gray-200">
                  <div className="text-sm font-medium text-gray-500 mb-2">
                    Denkvraag:
                  </div>
                  <p className="font-medium text-gray-800 mb-3">{active.question}</p>
                  <textarea
                    value={answers[active.id] || ""}
                    onChange={e => setAnswers(prev => ({...prev, [active.id]: e.target.value}))}
                    placeholder="Schrijf hier je antwoord..."
                    className="w-full p-3 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-blue-400 focus:border-transparent outline-none text-gray-700"
                    rows={2}
                  />
                </div>
              </div>
            )}

            {!active && !showExample && (
              <div className="rounded-xl border-2 border-dashed border-gray-300 p-8 text-center text-gray-400 mb-6">
                <div className="text-4xl mb-2">{"\u2191"}</div>
                Klik op een stap hierboven om te zien hoe het werkt
              </div>
            )}

            {/* Voorbeeld-knop */}
            <div className="text-center mb-6">
              <button
                onClick={() => setShowExample(!showExample)}
                className={`px-6 py-3 rounded-lg font-medium transition-all ${
                  showExample
                    ? "bg-green-500 text-white shadow-md"
                    : "bg-white border-2 border-green-500 text-green-600 hover:bg-green-50"
                }`}
              >
                {showExample ? "Verberg voorbeeld" : "Bekijk voorbeeld uit de praktijk"}
              </button>
            </div>

            {/* Voorbeeld */}
            {showExample && (
              <div className="bg-green-50 rounded-xl border-2 border-green-300 p-6 transition-all duration-300">
                <h3 className="text-lg font-bold text-green-800 mb-2">{EXAMPLE.title}</h3>
                <p className="text-green-700 mb-4">{EXAMPLE.description}</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {EXAMPLE.facts.map((fact, i) => (
                    <div key={i} className="bg-white rounded-lg p-3 border border-green-200 flex justify-between items-center">
                      <span className="text-gray-600 text-sm">{fact.label}</span>
                      <span className="font-bold text-green-700">{fact.value}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Voortgang samenvatting */}
            {Object.keys(answers).length === 3 && (
              <div className="mt-8 bg-blue-50 rounded-xl border-2 border-blue-300 p-6 text-center">
                <div className="text-3xl mb-2">{"\uD83C\uDF89"}</div>
                <h3 className="text-lg font-bold text-blue-800 mb-2">
                  Alle drie de stappen bekeken!
                </h3>
                <p className="text-blue-700">
                  Je weet nu hoe AI-kwaliteitscontrole werkt:
                  camera, AI-analyse en beslissing.
                </p>
              </div>
            )}

          </div>

          {/* Footer */}
          <div className="text-center py-4 text-xs text-gray-400">
            AIMM - AI Kwaliteitscontrole | Module 1: Gebruik | v1.0
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
