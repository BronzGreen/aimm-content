<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verkeerslichtmodel - Anomaliescores</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const ZONES = [
      {
        id: "groen", label: "Groen", range: "0 - 30", min: 0, max: 30,
        color: "bg-green-500", lightBg: "bg-green-50", border: "border-green-500",
        text: "text-green-700", ring: "ring-green-400",
        actie: "Geen actie", termijn: "Niet nodig",
        uitleg: "Alles is normaal. De machine draait goed. Gewoon doorwerken.",
        tip: "Check het dashboard morgen weer."
      },
      {
        id: "geel", label: "Geel", range: "30 - 50", min: 30, max: 50,
        color: "bg-yellow-500", lightBg: "bg-yellow-50", border: "border-yellow-500",
        text: "text-yellow-700", ring: "ring-yellow-400",
        actie: "Vaker checken", termijn: "Dagelijks",
        uitleg: "Iets wijkt af. Het is nog geen probleem. Maar houd het in de gaten.",
        tip: "Check dagelijks. Kijk welke sensor het veroorzaakt."
      },
      {
        id: "oranje", label: "Oranje", range: "50 - 70", min: 50, max: 70,
        color: "bg-orange-500", lightBg: "bg-orange-50", border: "border-orange-500",
        text: "text-orange-700", ring: "ring-orange-400",
        actie: "Plan onderhoud in", termijn: "Binnen 2 weken",
        uitleg: "Er is een duidelijke afwijking. Plan onderhoud in voordat het erger wordt.",
        tip: "Maak een werkorder. Noteer welke sensoren verhoogd zijn."
      },
      {
        id: "rood", label: "Rood", range: "70+", min: 70, max: 100,
        color: "bg-red-500", lightBg: "bg-red-50", border: "border-red-500",
        text: "text-red-700", ring: "ring-red-400",
        actie: "Plan inspectie", termijn: "Binnen 48 uur",
        uitleg: "Serieus probleem. De machine moet snel gecontroleerd worden.",
        tip: "Meld het direct. Maak een werkorder met hoge urgentie."
      }
    ];

    const SCENARIOS = [
      {
        id: 1, machine: "Machine 3", score: 42,
        sensoren: "Trillingssensor licht verhoogd. Rest normaal.",
        shap: "SHAP wijst op de aandrijfriem.",
        correctZone: "geel"
      },
      {
        id: 2, machine: "Machine 1", score: 73,
        sensoren: "Druk en temperatuur beide hoog.",
        shap: "SHAP wijst op het hydraulische systeem.",
        correctZone: "rood"
      },
      {
        id: 3, machine: "Machine 5", score: 22,
        sensoren: "Alle sensoren normaal.",
        shap: "Geen opvallende sensor.",
        correctZone: "groen"
      },
      {
        id: 4, machine: "Machine 2", score: 58,
        sensoren: "Trilling, geluid en temperatuur licht verhoogd.",
        shap: "SHAP wijst op de compressor.",
        correctZone: "oranje"
      }
    ];

    function App() {
      const [mode, setMode] = useState("slider");
      const [sliderValue, setSliderValue] = useState(0);
      const [quizStep, setQuizStep] = useState(0);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [showQuizResults, setShowQuizResults] = useState(false);

      const activeZone = useMemo(() => {
        return ZONES.find(z => sliderValue >= z.min && sliderValue < z.max) || ZONES[3];
      }, [sliderValue]);

      const quizScore = useMemo(() => {
        return SCENARIOS.reduce((count, s) => {
          return count + (quizAnswers[s.id] === s.correctZone ? 1 : 0);
        }, 0);
      }, [quizAnswers]);

      const handleReset = () => {
        setSliderValue(0);
        setQuizStep(0);
        setQuizAnswers({});
        setShowQuizResults(false);
        setMode("slider");
      };

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <div className="bg-white border-b px-6 py-4">
            <h1 className="text-2xl font-bold text-gray-900">Verkeerslichtmodel</h1>
            <p className="text-gray-500 mt-1">Van anomaliescore naar onderhoudsactie</p>
          </div>

          <div className="max-w-4xl mx-auto p-6">
            {/* Tab navigatie */}
            <div className="flex gap-1 bg-gray-100 rounded-lg p-1 mb-6">
              {[
                { id: "slider", label: "Verkennen" },
                { id: "quiz", label: "Oefenen" }
              ].map(tab => (
                <button
                  key={tab.id}
                  className={`flex-1 px-4 py-2 rounded-md text-sm font-medium transition-all ${
                    mode === tab.id
                      ? "bg-white shadow-sm text-gray-900"
                      : "text-gray-500 hover:text-gray-700"
                  }`}
                  onClick={() => setMode(tab.id)}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {mode === "slider" && (
              <div className="space-y-6">
                {/* Info box */}
                <div className="flex items-start gap-3 p-4 bg-blue-50 rounded-xl text-sm text-blue-800">
                  <span className="flex-shrink-0 mt-0.5 text-lg">&#9432;</span>
                  <div>Verschuif de slider. Kijk wat er verandert. Zo leer je welke actie bij welke score hoort.</div>
                </div>

                {/* Slider */}
                <div className="bg-white rounded-xl shadow-sm border p-6">
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-medium text-gray-700">Anomaliescore</span>
                    <span className={`text-4xl font-bold ${activeZone.text}`}>{sliderValue}</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="100"
                    value={sliderValue}
                    onChange={e => setSliderValue(+e.target.value)}
                    className="w-full h-3 rounded-lg appearance-none cursor-pointer"
                    style={{
                      background: `linear-gradient(to right, #27AE60 0%, #27AE60 30%, #D4AC0D 30%, #D4AC0D 50%, #D35400 50%, #D35400 70%, #C0392B 70%, #C0392B 100%)`
                    }}
                  />
                  <div className="flex justify-between text-xs text-gray-400 mt-1">
                    <span>0</span>
                    <span>30</span>
                    <span>50</span>
                    <span>70</span>
                    <span>100</span>
                  </div>
                </div>

                {/* Resultaat */}
                <div className={`rounded-xl border-2 p-6 transition-all duration-300 ${activeZone.lightBg} ${activeZone.border}`}>
                  <div className="flex items-center gap-4 mb-4">
                    <div className={`w-16 h-16 ${activeZone.color} rounded-full flex items-center justify-center shadow-lg`}>
                      <span className="text-white font-bold text-lg">{activeZone.label}</span>
                    </div>
                    <div>
                      <div className={`text-xl font-bold ${activeZone.text}`}>{activeZone.actie}</div>
                      <div className="text-gray-600">Termijn: {activeZone.termijn}</div>
                    </div>
                  </div>
                  <p className="text-gray-700 mb-3">{activeZone.uitleg}</p>
                  <div className={`p-3 rounded-lg bg-white bg-opacity-60`}>
                    <span className="font-medium">Tip: </span>{activeZone.tip}
                  </div>
                </div>

                {/* Alle zones overzicht */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                  {ZONES.map(zone => (
                    <div
                      key={zone.id}
                      className={`p-3 rounded-xl border-2 text-center transition-all cursor-pointer ${
                        activeZone.id === zone.id
                          ? `${zone.lightBg} ${zone.border} shadow-md scale-105`
                          : "bg-white border-gray-200 opacity-60"
                      }`}
                      onClick={() => setSliderValue(zone.min)}
                    >
                      <div className={`w-8 h-8 ${zone.color} rounded-full mx-auto mb-2`}></div>
                      <div className="font-bold text-sm">{zone.label}</div>
                      <div className="text-xs text-gray-500">{zone.range}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {mode === "quiz" && !showQuizResults && (
              <div className="space-y-6">
                {/* Progress */}
                <div className="flex items-center gap-2">
                  <div className="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
                    <div
                      className="h-full bg-blue-500 rounded-full transition-all duration-500"
                      style={{ width: `${((quizStep + 1) / SCENARIOS.length) * 100}%` }}
                    />
                  </div>
                  <span className="text-sm text-gray-500 font-mono">{quizStep + 1}/{SCENARIOS.length}</span>
                </div>

                {/* Scenario kaart */}
                {(() => {
                  const scenario = SCENARIOS[quizStep];
                  return (
                    <div className="bg-white rounded-xl shadow-sm border p-6">
                      <div className="flex items-center gap-3 mb-4">
                        <span className="text-2xl">&#9881;</span>
                        <div>
                          <div className="font-bold text-lg">{scenario.machine}</div>
                          <div className="text-gray-500">Anomaliescore: <span className="font-bold text-gray-900">{scenario.score}</span></div>
                        </div>
                      </div>
                      <div className="space-y-2 mb-6 text-sm text-gray-600">
                        <p><span className="font-medium">Sensoren:</span> {scenario.sensoren}</p>
                        <p><span className="font-medium">SHAP:</span> {scenario.shap}</p>
                      </div>

                      <div className="mb-4">
                        <p className="font-medium text-gray-700 mb-3">Welke kleur kies je?</p>
                        <div className="grid grid-cols-2 gap-3">
                          {ZONES.map(zone => (
                            <button
                              key={zone.id}
                              onClick={() => setQuizAnswers(prev => ({ ...prev, [scenario.id]: zone.id }))}
                              className={`p-4 rounded-xl border-2 text-left transition-all ${
                                quizAnswers[scenario.id] === zone.id
                                  ? `${zone.lightBg} ${zone.border} shadow-md`
                                  : "bg-white border-gray-200 hover:border-gray-300"
                              }`}
                            >
                              <div className="flex items-center gap-3">
                                <div className={`w-6 h-6 ${zone.color} rounded-full`}></div>
                                <div>
                                  <div className="font-bold">{zone.label}</div>
                                  <div className="text-xs text-gray-500">{zone.range}</div>
                                </div>
                              </div>
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="flex justify-between mt-6">
                        <button
                          onClick={() => setQuizStep(s => Math.max(0, s - 1))}
                          disabled={quizStep === 0}
                          className={`px-6 py-3 rounded-lg font-medium transition-colors ${
                            quizStep === 0
                              ? "bg-gray-100 text-gray-400 cursor-not-allowed"
                              : "bg-white border border-gray-300 text-gray-700 hover:bg-gray-50"
                          }`}
                        >
                          Vorige
                        </button>
                        <button
                          onClick={() => {
                            if (quizStep < SCENARIOS.length - 1) {
                              setQuizStep(s => s + 1);
                            } else {
                              setShowQuizResults(true);
                            }
                          }}
                          disabled={!quizAnswers[scenario.id]}
                          className={`px-6 py-3 rounded-lg font-medium transition-colors ${
                            !quizAnswers[scenario.id]
                              ? "bg-gray-100 text-gray-400 cursor-not-allowed"
                              : "bg-blue-500 text-white hover:bg-blue-600"
                          }`}
                        >
                          {quizStep === SCENARIOS.length - 1 ? "Bekijk resultaat" : "Volgende"}
                        </button>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {mode === "quiz" && showQuizResults && (
              <div className="space-y-6">
                {/* Score */}
                <div className="bg-white rounded-xl shadow-sm border p-6 text-center">
                  <div className="text-5xl font-bold text-blue-600 mb-2">{quizScore} / {SCENARIOS.length}</div>
                  <div className="text-gray-500">
                    {quizScore === 4 ? "Alles goed! Je kent het model." :
                     quizScore >= 3 ? "Goed gedaan! Bijna alles goed." :
                     quizScore >= 2 ? "Aardig. Bekijk de fouten hieronder." :
                     "Oefen nog even. Bekijk de uitleg hieronder."}
                  </div>
                </div>

                {/* Per scenario */}
                {SCENARIOS.map(scenario => {
                  const answer = quizAnswers[scenario.id];
                  const correct = answer === scenario.correctZone;
                  const correctZoneData = ZONES.find(z => z.id === scenario.correctZone);

                  return (
                    <div key={scenario.id} className={`rounded-xl border-2 p-5 ${correct ? "bg-green-50 border-green-300" : "bg-red-50 border-red-300"}`}>
                      <div className="flex items-center justify-between mb-2">
                        <span className="font-bold">{scenario.machine} (score: {scenario.score})</span>
                        <span className={`text-lg font-bold ${correct ? "text-green-600" : "text-red-600"}`}>
                          {correct ? "Goed!" : "Fout"}
                        </span>
                      </div>
                      {!correct && (
                        <div className="text-sm text-gray-700">
                          <p>Jouw keuze: <span className="font-medium">{ZONES.find(z => z.id === answer)?.label}</span></p>
                          <p>Goede antwoord: <span className="font-medium">{correctZoneData?.label} ({correctZoneData?.range})</span></p>
                          <p className="mt-1 text-gray-600">{correctZoneData?.uitleg}</p>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            {/* Reset knop */}
            <div className="mt-6 text-center">
              <button
                onClick={handleReset}
                className="px-4 py-2 text-gray-500 hover:text-gray-700 text-sm flex items-center gap-1 mx-auto"
              >
                &#8634; Opnieuw beginnen
              </button>
            </div>

            {/* Bron */}
            <div className="mt-8 text-center text-xs text-gray-400">
              Bron: Verkeerslichtmodel voor anomaliescores | AIMM Predictive Maintenance - Module 2: Train
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
