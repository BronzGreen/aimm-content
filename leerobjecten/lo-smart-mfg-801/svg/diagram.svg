<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <title>De drie getallen — van kosten naar businesscase</title>

  <defs>
    <marker id="flowarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Titel -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">
    De drie getallen
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#555">
    Van huidige kosten naar businesscase — één waterval
  </text>

  <!-- Box 1: Huidige kosten -->
  <g>
    <rect x="60" y="110" width="200" height="140" rx="8" fill="#ffe4e1" stroke="#b5352f" stroke-width="2.5"/>
    <text x="160" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Huidige kosten</text>
    <text x="160" y="160" text-anchor="middle" font-size="11" fill="#555">(zonder AI-systeem)</text>

    <line x1="75" y1="175" x2="245" y2="175" stroke="#b5352f" stroke-width="1" opacity="0.3"/>
    <text x="160" y="195" text-anchor="middle" font-size="12" fill="#333">Inspectiekosten</text>
    <text x="160" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5352f">€210.000/jaar</text>

    <text x="160" y="232" text-anchor="middle" font-size="12" fill="#333">+ Klachtkosten</text>
    <text x="160" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5352f">€15.000/jaar</text>
  </g>

  <!-- Pijl 1 -->
  <line x1="265" y1="180" x2="305" y2="180" stroke="#333" stroke-width="3" marker-end="url(#flowarrow)"/>
  <text x="285" y="170" text-anchor="middle" font-size="10" fill="#555" font-style="italic">reductie</text>
  <text x="285" y="200" text-anchor="middle" font-size="10" fill="#555" font-style="italic">60-80%</text>

  <!-- Box 2: Getal 1 — Besparing -->
  <g>
    <rect x="310" y="110" width="200" height="140" rx="8" fill="#e0f0e3" stroke="#2c5f2d" stroke-width="3"/>
    <text x="410" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">GETAL 1</text>
    <text x="410" y="158" text-anchor="middle" font-size="12" fill="#2c5f2d">Jaarlijkse besparing</text>

    <text x="410" y="195" text-anchor="middle" font-size="28" font-weight="bold" fill="#2c5f2d">€159k</text>
    <text x="410" y="220" text-anchor="middle" font-size="11" fill="#555">/jaar</text>
    <text x="410" y="238" text-anchor="middle" font-size="10" fill="#777" font-style="italic">(kosten na AI)</text>
  </g>

  <!-- Box 3: Getal 2 — Investering (onder box 1) -->
  <g>
    <rect x="60" y="300" width="200" height="140" rx="8" fill="#fff4d6" stroke="#d4a017" stroke-width="3"/>
    <text x="160" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">GETAL 2</text>
    <text x="160" y="348" text-anchor="middle" font-size="12" fill="#d4a017">Eenmalige investering</text>

    <text x="160" y="385" text-anchor="middle" font-size="28" font-weight="bold" fill="#d4a017">€44k</text>
    <text x="160" y="410" text-anchor="middle" font-size="10" fill="#555">hardware + software</text>
    <text x="160" y="425" text-anchor="middle" font-size="10" fill="#555">+ labelwerk + installatie</text>
  </g>

  <!-- Delen-teken + pijl naar Getal 3 -->
  <text x="285" y="360" text-anchor="middle" font-size="30" fill="#7a3b82">÷</text>
  <text x="285" y="395" text-anchor="middle" font-size="10" fill="#555" font-style="italic">gedeeld door</text>

  <line x1="260" y1="405" x2="310" y2="405" stroke="#333" stroke-width="3" marker-end="url(#flowarrow)"/>

  <!-- Box 4: Getal 3 — Payback -->
  <g>
    <rect x="310" y="300" width="200" height="140" rx="8" fill="#d9e8f5" stroke="#1a5490" stroke-width="3"/>
    <text x="410" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">GETAL 3</text>
    <text x="410" y="348" text-anchor="middle" font-size="12" fill="#1a5490">Payback-periode</text>

    <text x="410" y="385" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a5490">3,4 mnd</text>
    <text x="410" y="410" text-anchor="middle" font-size="10" fill="#555">investering terugverdiend</text>
    <text x="410" y="425" text-anchor="middle" font-size="10" fill="#777" font-style="italic">(&lt;6mnd = zeer sterk)</text>
  </g>

  <!-- Pijl naar aanbeveling -->
  <line x1="525" y1="370" x2="570" y2="370" stroke="#333" stroke-width="3" marker-end="url(#flowarrow)"/>

  <!-- Box 5: Je aanbeveling -->
  <g>
    <rect x="580" y="200" width="280" height="280" rx="8" fill="#f3e0f0" stroke="#7a3b82" stroke-width="3"/>
    <text x="720" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Jouw aanbeveling</text>

    <line x1="600" y1="250" x2="840" y2="250" stroke="#7a3b82" stroke-width="1" opacity="0.3"/>

    <text x="720" y="280" text-anchor="middle" font-size="12" font-style="italic" fill="#333">
      "Wij adviseren een"
    </text>
    <text x="720" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3b82">
      investering van €44k
    </text>
    <text x="720" y="318" text-anchor="middle" font-size="12" font-style="italic" fill="#333">
      "met"
    </text>
    <text x="720" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3b82">
      payback in 3,4 maanden
    </text>
    <text x="720" y="356" text-anchor="middle" font-size="12" font-style="italic" fill="#333">
      "op basis van"
    </text>
    <text x="720" y="376" text-anchor="middle" font-size="13" fill="#333">
      €159k jaarlijkse besparing
    </text>

    <line x1="600" y1="395" x2="840" y2="395" stroke="#7a3b82" stroke-width="1" opacity="0.3"/>

    <text x="720" y="420" text-anchor="middle" font-size="11" fill="#555">
      + Drie kwetsbare aannames
    </text>
    <text x="720" y="438" text-anchor="middle" font-size="11" fill="#555">
      + Eerste concrete vervolgstap
    </text>
    <text x="720" y="460" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">
      = Gesprek-waardig voorstel
    </text>
  </g>

  <!-- Kernboodschap onderaan -->
  <text x="450" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">
    Geen technisch verhaal. Eén A4. Drie getallen. Eén aanbeveling.
  </text>
  <text x="450" y="545" text-anchor="middle" font-size="11" fill="#555" font-style="italic">
    Dat is wat de directie kan lezen, begrijpen, en erop reageren.
  </text>

  <!-- Footer -->
  <text x="450" y="580" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">
    AIMM × BronzGreen | ko-smart-mfg-801 | Module 3: Op Maat | MBO-3 operator
  </text>
</svg>
