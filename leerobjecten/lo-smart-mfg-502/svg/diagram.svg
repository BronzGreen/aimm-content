<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 680"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Data-audit in vier stappen</title>
  <desc id="desc">Flowchart met vier stappen voor een data-audit op je eigen machine: sensoren inventariseren, opslag checken, datakwaliteit beoordelen, en een actieplan maken. Elke stap heeft een beslispunt dat bepaalt of je door kunt of actie moet ondernemen.</desc>
  <defs>
    <linearGradient id="g-step1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="g-step2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <linearGradient id="g-step3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <linearGradient id="g-step4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#8E44AD"/>
    </linearGradient>
    <linearGradient id="g-start" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#3498DB"/>
    </linearGradient>
    <linearGradient id="g-end-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27AE60"/>
      <stop offset="100%" stop-color="#1E8449"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect role="presentation" width="800" height="680" fill="#FAFAF8"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50" letter-spacing="1">Data-audit in vier stappen</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d" letter-spacing="0.5">Eigen productiedata verzamelen en beoordelen</text>

  <!-- START -->
  <g filter="url(#shadow)">
    <rect x="300" y="82" width="200" height="40" rx="20" fill="url(#g-start)"/>
    <text x="400" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="white">Jouw machine</text>
  </g>

  <!-- Arrow start to step 1 -->
  <line x1="400" y1="122" x2="400" y2="148" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 1: Sensoren inventariseren -->
  <g filter="url(#shadow)">
    <rect x="280" y="152" width="240" height="55" rx="10" fill="url(#g-step1)"/>
    <text x="400" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="white">STAP 1</text>
    <text x="400" y="194" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Sensoren inventariseren</text>
  </g>
  <!-- Sub-items step 1 -->
  <text x="560" y="172" font-size="10" fill="#3498DB">Welke sensoren?</text>
  <text x="560" y="186" font-size="10" fill="#3498DB">Waar zitten ze?</text>
  <text x="560" y="200" font-size="10" fill="#3498DB">Werken ze?</text>

  <!-- Arrow step 1 to step 2 -->
  <line x1="400" y1="207" x2="400" y2="238" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 2: Opslag checken -->
  <g filter="url(#shadow)">
    <rect x="280" y="242" width="240" height="55" rx="10" fill="url(#g-step2)"/>
    <text x="400" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="white">STAP 2</text>
    <text x="400" y="284" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Opslag checken</text>
  </g>
  <!-- Sub-items step 2 -->
  <text x="560" y="262" font-size="10" fill="#27AE60">Wordt data bewaard?</text>
  <text x="560" y="276" font-size="10" fill="#27AE60">Waar? Hoe lang?</text>
  <text x="560" y="290" font-size="10" fill="#27AE60">Kun je erbij?</text>

  <!-- Arrow step 2 to step 3 -->
  <line x1="400" y1="297" x2="400" y2="328" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 3: Datakwaliteit beoordelen -->
  <g filter="url(#shadow)">
    <rect x="280" y="332" width="240" height="55" rx="10" fill="url(#g-step3)"/>
    <text x="400" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="white">STAP 3</text>
    <text x="400" y="374" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Datakwaliteit beoordelen</text>
  </g>

  <!-- 4 criteria boxes -->
  <g transform="translate(110, 340)">
    <rect x="0" y="0" width="130" height="18" rx="4" fill="#FFF3E0" stroke="#E67E22" stroke-width="0.5"/>
    <text x="65" y="13" text-anchor="middle" font-size="9" fill="#D35400">Volledigheid</text>
  </g>
  <g transform="translate(110, 362)">
    <rect x="0" y="0" width="130" height="18" rx="4" fill="#FFF3E0" stroke="#E67E22" stroke-width="0.5"/>
    <text x="65" y="13" text-anchor="middle" font-size="9" fill="#D35400">Consistentie</text>
  </g>
  <g transform="translate(560, 340)">
    <rect x="0" y="0" width="130" height="18" rx="4" fill="#FFF3E0" stroke="#E67E22" stroke-width="0.5"/>
    <text x="65" y="13" text-anchor="middle" font-size="9" fill="#D35400">Nauwkeurigheid</text>
  </g>
  <g transform="translate(560, 362)">
    <rect x="0" y="0" width="130" height="18" rx="4" fill="#FFF3E0" stroke="#E67E22" stroke-width="0.5"/>
    <text x="65" y="13" text-anchor="middle" font-size="9" fill="#D35400">Tijdstempel</text>
  </g>

  <!-- Arrow step 3 to decision -->
  <line x1="400" y1="387" x2="400" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision diamond: >= 3 maanden data? -->
  <g filter="url(#shadow)" transform="translate(400, 460)">
    <rect x="-42" y="-42" width="84" height="84" rx="6" fill="#E67E22" transform="rotate(45)"/>
    <text y="-8" text-anchor="middle" font-size="10" font-weight="600" fill="white">3 maanden</text>
    <text y="8" text-anchor="middle" font-size="10" font-weight="600" fill="white">data?</text>
  </g>

  <!-- Ja label -->
  <text x="400" y="520" text-anchor="middle" font-size="11" font-weight="600" fill="#27AE60">Ja</text>
  <!-- Arrow decision to step 4 -->
  <line x1="400" y1="502" x2="400" y2="538" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Nee label + action -->
  <text x="490" y="458" font-size="11" font-weight="600" fill="#E74C3C">Nee</text>
  <line x1="460" y1="460" x2="560" y2="460" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow-red)"/>
  <g>
    <rect x="565" y="443" width="170" height="34" rx="8" fill="#FEF2F2" stroke="#E74C3C" stroke-width="1"/>
    <text x="650" y="464" text-anchor="middle" font-size="10" fill="#C0392B">Eerst data verzamelen!</text>
  </g>
  <!-- Arrow back up from action box -->
  <path d="M735,460 L755,460 L755,170 L520,170" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>

  <!-- STEP 4: Actieplan maken -->
  <g filter="url(#shadow)">
    <rect x="280" y="542" width="240" height="55" rx="10" fill="url(#g-step4)"/>
    <text x="400" y="565" text-anchor="middle" font-size="11" font-weight="700" fill="white">STAP 4</text>
    <text x="400" y="584" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Actieplan maken</text>
  </g>
  <!-- Sub-items step 4 -->
  <text x="560" y="562" font-size="10" fill="#8E44AD">Wat ontbreekt?</text>
  <text x="560" y="576" font-size="10" fill="#8E44AD">Wie kan helpen?</text>
  <text x="560" y="590" font-size="10" fill="#8E44AD">Wanneer klaar?</text>

  <!-- Arrow step 4 to end -->
  <line x1="400" y1="597" x2="400" y2="623" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- END -->
  <g filter="url(#shadow)">
    <rect x="300" y="627" width="200" height="36" rx="18" fill="url(#g-end-ok)"/>
    <text x="400" y="650" text-anchor="middle" font-size="12" font-weight="600" fill="white">Klaar voor de pilot!</text>
  </g>

  <!-- Source -->
  <text x="400" y="675" text-anchor="middle" font-size="10" fill="#999">AIMM Predictive Maintenance - Data-audit framework</text>
</svg>
