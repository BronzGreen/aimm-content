<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Ensemble Learning: Bagging versus Boosting in PdM</title>
  <desc id="desc">Een vergelijkende weergave van de twee ensemble-families. Aan de linkerkant Bagging — drie decision trees worden parallel getraind op verschillende bootstrap-samples van de PdM-data. Hun voorspellingen worden gecombineerd via meerderheidsstem. Bekendste voorbeeld: Random Forest, verlaagt variance. Aan de rechterkant Boosting — drie decision trees worden sequentieel getraind, waarbij elk volgend model leert van de fouten van zijn voorganger. De voorspellingen worden gecombineerd met gewogen som. Bekendste voorbeeld: Gradient Boosting, verlaagt bias. Onderaan een vergelijkingstabel met PdM-toepassingen per familie.</desc>

  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="g-bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="g-boost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <linearGradient id="g-data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
    <linearGradient id="g-vote" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <marker id="ens-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8c8d"/>
    </marker>
    <marker id="ens-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2980B9"/>
    </marker>
    <marker id="ens-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D35400"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="1920" height="1080" fill="#FAFAF8"/>

  <!-- Titel -->
  <text x="960" y="65" text-anchor="middle" font-size="40" font-weight="700" fill="#2C3E50">Ensemble Learning — meerdere modellen die samen sterker zijn</text>
  <text x="960" y="105" text-anchor="middle" font-size="20" fill="#7f8c8d">Twee families: Bagging (parallel + middelen) versus Boosting (sequentieel + corrigeren)</text>

  <!-- Verticale scheidingslijn -->
  <line x1="960" y1="160" x2="960" y2="780" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="6,6"/>

  <!-- ── LINKS: BAGGING ── -->
  <g filter="url(#shadow)">
    <rect role="presentation" x="60" y="160" width="860" height="80" rx="14" fill="url(#g-bag)"/>
  </g>
  <text x="490" y="200" text-anchor="middle" font-size="28" font-weight="700" fill="white">BAGGING — parallel trainen, dan stemmen</text>
  <text x="490" y="225" text-anchor="middle" font-size="16" fill="#D6EAF8" font-style="italic">Voorbeeld: Random Forest — verlaagt variance</text>

  <!-- Bagging — input dataset -->
  <g filter="url(#shadow)">
    <rect role="presentation" x="380" y="280" width="220" height="70" rx="10" fill="url(#g-data)"/>
  </g>
  <text x="490" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#B0BEC5" letter-spacing="2">PdM-DATASET</text>
  <text x="490" y="335" text-anchor="middle" font-size="16" fill="white">vibration + temperatuur + druk</text>

  <!-- Pijlen naar 3 bootstrap samples -->
  <line x1="430" y1="350" x2="200" y2="410" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ens-arrow)"/>
  <line x1="490" y1="355" x2="490" y2="410" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ens-arrow)"/>
  <line x1="550" y1="350" x2="780" y2="410" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ens-arrow)"/>

  <!-- 3 Bootstrap samples -->
  <rect role="presentation" x="120" y="420" width="160" height="40" rx="6" fill="#EBF5FB" stroke="#3498DB" stroke-width="1.5"/>
  <text x="200" y="445" text-anchor="middle" font-size="13" fill="#2980B9">Bootstrap A</text>

  <rect role="presentation" x="410" y="420" width="160" height="40" rx="6" fill="#EBF5FB" stroke="#3498DB" stroke-width="1.5"/>
  <text x="490" y="445" text-anchor="middle" font-size="13" fill="#2980B9">Bootstrap B</text>

  <rect role="presentation" x="700" y="420" width="160" height="40" rx="6" fill="#EBF5FB" stroke="#3498DB" stroke-width="1.5"/>
  <text x="780" y="445" text-anchor="middle" font-size="13" fill="#2980B9">Bootstrap C</text>

  <!-- Pijlen naar trees -->
  <line x1="200" y1="465" x2="200" y2="495" stroke="#2980B9" stroke-width="2" marker-end="url(#ens-arrow-blue)"/>
  <line x1="490" y1="465" x2="490" y2="495" stroke="#2980B9" stroke-width="2" marker-end="url(#ens-arrow-blue)"/>
  <line x1="780" y1="465" x2="780" y2="495" stroke="#2980B9" stroke-width="2" marker-end="url(#ens-arrow-blue)"/>

  <!-- 3 Trees parallel -->
  <g id="tree-a">
    <circle cx="200" cy="510" r="12" fill="url(#g-bag)"/>
    <line x1="190" y1="520" x2="170" y2="545" stroke="#2980B9" stroke-width="2"/>
    <line x1="210" y1="520" x2="230" y2="545" stroke="#2980B9" stroke-width="2"/>
    <circle cx="170" cy="555" r="10" fill="url(#g-bag)"/>
    <circle cx="230" cy="555" r="10" fill="url(#g-bag)"/>
    <line x1="160" y1="563" x2="145" y2="585" stroke="#2980B9" stroke-width="2"/>
    <line x1="180" y1="563" x2="195" y2="585" stroke="#2980B9" stroke-width="2"/>
    <line x1="220" y1="563" x2="205" y2="585" stroke="#2980B9" stroke-width="2"/>
    <line x1="240" y1="563" x2="255" y2="585" stroke="#2980B9" stroke-width="2"/>
    <circle cx="145" cy="595" r="8" fill="url(#g-bag)"/>
    <circle cx="200" cy="595" r="8" fill="url(#g-bag)"/>
    <circle cx="255" cy="595" r="8" fill="url(#g-bag)"/>
  </g>
  <text x="200" y="635" text-anchor="middle" font-size="14" font-weight="700" fill="#2980B9">Tree A</text>
  <text x="200" y="655" text-anchor="middle" font-size="13" fill="#555" font-style="italic">onafhankelijk getraind</text>

  <g id="tree-b">
    <circle cx="490" cy="510" r="12" fill="url(#g-bag)"/>
    <line x1="480" y1="520" x2="460" y2="545" stroke="#2980B9" stroke-width="2"/>
    <line x1="500" y1="520" x2="520" y2="545" stroke="#2980B9" stroke-width="2"/>
    <circle cx="460" cy="555" r="10" fill="url(#g-bag)"/>
    <circle cx="520" cy="555" r="10" fill="url(#g-bag)"/>
    <line x1="450" y1="563" x2="435" y2="585" stroke="#2980B9" stroke-width="2"/>
    <line x1="470" y1="563" x2="485" y2="585" stroke="#2980B9" stroke-width="2"/>
    <line x1="510" y1="563" x2="495" y2="585" stroke="#2980B9" stroke-width="2"/>
    <line x1="530" y1="563" x2="545" y2="585" stroke="#2980B9" stroke-width="2"/>
    <circle cx="435" cy="595" r="8" fill="url(#g-bag)"/>
    <circle cx="490" cy="595" r="8" fill="url(#g-bag)"/>
    <circle cx="545" cy="595" r="8" fill="url(#g-bag)"/>
  </g>
  <text x="490" y="635" text-anchor="middle" font-size="14" font-weight="700" fill="#2980B9">Tree B</text>
  <text x="490" y="655" text-anchor="middle" font-size="13" fill="#555" font-style="italic">onafhankelijk getraind</text>

  <g id="tree-c">
    <circle cx="780" cy="510" r="12" fill="url(#g-bag)"/>
    <line x1="770" y1="520" x2="750" y2="545" stroke="#2980B9" stroke-width="2"/>
    <line x1="790" y1="520" x2="810" y2="545" stroke="#2980B9" stroke-width="2"/>
    <circle cx="750" cy="555" r="10" fill="url(#g-bag)"/>
    <circle cx="810" cy="555" r="10" fill="url(#g-bag)"/>
    <line x1="740" y1="563" x2="725" y2="585" stroke="#2980B9" stroke-width="2"/>
    <line x1="760" y1="563" x2="775" y2="585" stroke="#2980B9" stroke-width="2"/>
    <line x1="800" y1="563" x2="785" y2="585" stroke="#2980B9" stroke-width="2"/>
    <line x1="820" y1="563" x2="835" y2="585" stroke="#2980B9" stroke-width="2"/>
    <circle cx="725" cy="595" r="8" fill="url(#g-bag)"/>
    <circle cx="780" cy="595" r="8" fill="url(#g-bag)"/>
    <circle cx="835" cy="595" r="8" fill="url(#g-bag)"/>
  </g>
  <text x="780" y="635" text-anchor="middle" font-size="14" font-weight="700" fill="#2980B9">Tree C</text>
  <text x="780" y="655" text-anchor="middle" font-size="13" fill="#555" font-style="italic">onafhankelijk getraind</text>

  <!-- Voting → Final answer -->
  <line x1="200" y1="670" x2="450" y2="725" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ens-arrow)"/>
  <line x1="490" y1="675" x2="490" y2="725" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ens-arrow)"/>
  <line x1="780" y1="670" x2="530" y2="725" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ens-arrow)"/>

  <g filter="url(#shadow)">
    <rect role="presentation" x="350" y="730" width="280" height="80" rx="14" fill="url(#g-vote)"/>
  </g>
  <text x="490" y="758" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF" letter-spacing="2">MEERDERHEIDSSTEM</text>
  <text x="490" y="788" text-anchor="middle" font-size="22" font-weight="700" fill="white">Final ŷ</text>

  <!-- ── RECHTS: BOOSTING ── -->
  <g filter="url(#shadow)">
    <rect role="presentation" x="1000" y="160" width="860" height="80" rx="14" fill="url(#g-boost)"/>
  </g>
  <text x="1430" y="200" text-anchor="middle" font-size="28" font-weight="700" fill="white">BOOSTING — sequentieel trainen, fouten corrigeren</text>
  <text x="1430" y="225" text-anchor="middle" font-size="16" fill="#FDEBD0" font-style="italic">Voorbeeld: Gradient Boosting / AdaBoost — verlaagt bias</text>

  <!-- Boosting — input dataset -->
  <g filter="url(#shadow)">
    <rect role="presentation" x="1100" y="280" width="220" height="70" rx="10" fill="url(#g-data)"/>
  </g>
  <text x="1210" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#B0BEC5" letter-spacing="2">PdM-DATASET</text>
  <text x="1210" y="335" text-anchor="middle" font-size="16" fill="white">met fout-weging per stap</text>

  <!-- Pijl naar Tree 1 -->
  <line x1="1210" y1="355" x2="1210" y2="425" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ens-arrow)"/>

  <!-- Tree 1 -->
  <g id="boost-tree-1">
    <rect role="presentation" x="1100" y="430" width="220" height="160" rx="10" fill="white" stroke="#E67E22" stroke-width="2"/>
    <text x="1210" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="#D35400">Tree 1 — basis</text>
    <circle cx="1210" cy="490" r="10" fill="url(#g-boost)"/>
    <line x1="1200" y1="498" x2="1185" y2="520" stroke="#D35400" stroke-width="2"/>
    <line x1="1220" y1="498" x2="1235" y2="520" stroke="#D35400" stroke-width="2"/>
    <circle cx="1185" cy="528" r="7" fill="url(#g-boost)"/>
    <circle cx="1235" cy="528" r="7" fill="url(#g-boost)"/>
    <text x="1210" y="568" text-anchor="middle" font-size="12" fill="#555" font-style="italic">eenvoudig model</text>
    <text x="1210" y="582" text-anchor="middle" font-size="12" fill="#555" font-style="italic">(zwakke leerder)</text>
  </g>

  <!-- Pijl met "fouten" label -->
  <line x1="1210" y1="600" x2="1210" y2="640" stroke="#D35400" stroke-width="3" marker-end="url(#ens-arrow-orange)"/>
  <rect role="presentation" x="1330" y="610" width="170" height="28" rx="6" fill="#FDEBD0" stroke="#D35400" stroke-width="1"/>
  <text x="1415" y="629" text-anchor="middle" font-size="13" font-weight="600" fill="#D35400">+ weeg fouten zwaarder</text>

  <!-- Tree 2 -->
  <g id="boost-tree-2">
    <rect role="presentation" x="1100" y="650" width="220" height="80" rx="10" fill="white" stroke="#D35400" stroke-width="2"/>
    <text x="1210" y="675" text-anchor="middle" font-size="14" font-weight="700" fill="#D35400">Tree 2 — corrigeert</text>
    <text x="1210" y="700" text-anchor="middle" font-size="12" fill="#555" font-style="italic">leert juist op de gemiste cases</text>
    <text x="1210" y="718" text-anchor="middle" font-size="11" fill="#7f8c8d">(failure-cases krijgen meer gewicht)</text>
  </g>

  <line x1="1210" y1="730" x2="1210" y2="745" stroke="#D35400" stroke-width="2.5" marker-end="url(#ens-arrow-orange)"/>

  <!-- Tree 3 -->
  <g id="boost-tree-3">
    <rect role="presentation" x="1100" y="745" width="220" height="60" rx="10" fill="white" stroke="#D35400" stroke-width="2"/>
    <text x="1210" y="770" text-anchor="middle" font-size="14" font-weight="700" fill="#D35400">Tree 3 — verfijnt</text>
    <text x="1210" y="790" text-anchor="middle" font-size="12" fill="#555" font-style="italic">corrigeert wat Tree 2 nog miste</text>
  </g>

  <!-- Pijl naar gewogen som -->
  <line x1="1320" y1="775" x2="1530" y2="775" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ens-arrow)"/>
  <line x1="1320" y1="510" x2="1530" y2="600" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#ens-arrow)" stroke-dasharray="3,3"/>
  <line x1="1320" y1="690" x2="1530" y2="700" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#ens-arrow)" stroke-dasharray="3,3"/>

  <!-- Gewogen som -->
  <g filter="url(#shadow)">
    <rect role="presentation" x="1540" y="610" width="280" height="200" rx="14" fill="url(#g-vote)"/>
  </g>
  <text x="1680" y="645" text-anchor="middle" font-size="14" font-weight="600" fill="white" letter-spacing="2">GEWOGEN SOM</text>
  <text x="1680" y="690" text-anchor="middle" font-size="20" font-weight="700" fill="white">Final ŷ =</text>
  <text x="1680" y="725" text-anchor="middle" font-size="14" fill="#D5F5E3">α₁·Tree₁ + α₂·Tree₂</text>
  <text x="1680" y="745" text-anchor="middle" font-size="14" fill="#D5F5E3">+ α₃·Tree₃</text>
  <text x="1680" y="785" text-anchor="middle" font-size="13" fill="#FFFFFF" font-style="italic">elke tree krijgt eigen gewicht α</text>

  <!-- ── ONDERAAN: PdM-toepassingen ── -->
  <text x="960" y="870" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50">Welke familie past bij welke PdM-uitdaging?</text>

  <g filter="url(#shadow)">
    <rect role="presentation" x="80" y="900" width="860" height="140" rx="14" fill="white" stroke="#2980B9" stroke-width="2"/>
  </g>
  <rect role="presentation" x="80" y="900" width="860" height="40" rx="14" fill="url(#g-bag)"/>
  <rect role="presentation" x="80" y="920" width="860" height="20" fill="url(#g-bag)"/>
  <text x="510" y="928" text-anchor="middle" font-size="18" font-weight="700" fill="white">Bagging — Random Forest</text>
  <text x="510" y="970" text-anchor="middle" font-size="15" fill="#2C3E50">• Onevenwichtige data (weinig failure-cases) — diversiteit voorkomt overfit op meerderheidsklasse</text>
  <text x="510" y="993" text-anchor="middle" font-size="15" fill="#2C3E50">• Heterogene sensors (vibratie + temperatuur + druk) — verschillende trees zien verschillende patronen</text>
  <text x="510" y="1018" text-anchor="middle" font-size="14" fill="#7f8c8d" font-style="italic">Voorbeelden: tool wear in milling (Wu); RUL-prognose aircraft engines (Li, variance-reductie)</text>

  <g filter="url(#shadow)">
    <rect role="presentation" x="980" y="900" width="860" height="140" rx="14" fill="white" stroke="#D35400" stroke-width="2"/>
  </g>
  <rect role="presentation" x="980" y="900" width="860" height="40" rx="14" fill="url(#g-boost)"/>
  <rect role="presentation" x="980" y="920" width="860" height="20" fill="url(#g-boost)"/>
  <text x="1410" y="928" text-anchor="middle" font-size="18" font-weight="700" fill="white">Boosting — Gradient Boosting / AdaBoost</text>
  <text x="1410" y="970" text-anchor="middle" font-size="15" fill="#2C3E50">• Hoge accuracy nodig — sequentieel corrigeren leert moeilijke cases stap voor stap</text>
  <text x="1410" y="993" text-anchor="middle" font-size="15" fill="#2C3E50">• Structurele afwijking (bias) in eenvoudige modellen — boosting bouwt complexiteit op</text>
  <text x="1410" y="1018" text-anchor="middle" font-size="14" fill="#7f8c8d" font-style="italic">Voorbeelden: pipe failure prediction (boosted decision tree); software defects (decision jungle)</text>

  <!-- Bronvermelding -->
  <text x="960" y="1065" text-anchor="middle" font-size="13" fill="#999">Ensemble Learning — AIMM Curriculum | Module 2: Train | v1.0</text>
</svg>
