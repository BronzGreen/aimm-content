<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">3 stappen om sensordata te lezen</title>
  <desc id="desc">Een trapdiagram met drie stappen voor het lezen van sensordata: stap 1 is basislijn bepalen, stap 2 is trends herkennen, stap 3 is pieken van ruis onderscheiden. Elke stap bouwt voort op de vorige.</desc>

  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#2E86C1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2471A3"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A5276"/>
      <stop offset="100%" stop-color="#154360"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#BDC3C7"/>
    </marker>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="800" height="500" fill="#FAFAF8"/>

  <!-- Titel -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50" letter-spacing="1">Sensordata lezen in 3 stappen</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d" letter-spacing="0.5">Van meten naar actie — Predictive Maintenance</text>

  <!-- Verticale pijl links -->
  <line x1="60" y1="420" x2="60" y2="110" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="45" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#7f8c8d" transform="rotate(-90,45,265)">Vaardigheid</text>

  <!-- Stap 1: Basislijn bepalen (laagste trede) -->
  <g filter="url(#shadow)">
    <rect x="100" y="330" width="190" height="90" rx="8" fill="url(#g1)"/>
    <text x="195" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="white">Stap 1</text>
    <text x="195" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="white">Basislijn bepalen</text>
    <text x="195" y="398" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">Wat is normaal voor</text>
    <text x="195" y="412" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">deze machine?</text>
  </g>

  <!-- Verbindingslijn 1 naar 2 -->
  <line x1="290" y1="375" x2="320" y2="285" stroke="#BDC3C7" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Stap 2: Trends herkennen (midden trede) -->
  <g filter="url(#shadow)">
    <rect x="310" y="230" width="190" height="90" rx="8" fill="url(#g2)"/>
    <text x="405" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="white">Stap 2</text>
    <text x="405" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="white">Trends herkennen</text>
    <text x="405" y="298" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">Stijgt de waarde</text>
    <text x="405" y="312" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">langzaam?</text>
  </g>

  <!-- Verbindingslijn 2 naar 3 -->
  <line x1="500" y1="275" x2="530" y2="185" stroke="#BDC3C7" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Stap 3: Pieken vs ruis (hoogste trede) -->
  <g filter="url(#shadow)">
    <rect x="520" y="130" width="190" height="90" rx="8" fill="url(#g3)"/>
    <text x="615" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="white">Stap 3</text>
    <text x="615" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="white">Pieken vs ruis</text>
    <text x="615" y="198" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Springt het omhoog</text>
    <text x="615" y="212" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">en blijft het hoog?</text>
  </g>

  <!-- Iconen per stap (simpele symbolen) -->
  <!-- Stap 1: horizontale lijn = basislijn -->
  <line x1="120" y1="365" x2="155" y2="365" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="138" y="360" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">= normaal</text>

  <!-- Stap 2: stijgende lijn = trend -->
  <line x1="330" y1="270" x2="365" y2="250" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

  <!-- Stap 3: piekgolfje -->
  <path d="M540,170 L550,170 L555,155 L560,170 L570,170" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

  <!-- Resultaat-label rechts boven -->
  <g>
    <rect x="540" y="85" width="160" height="30" rx="15" fill="#27AE60" opacity="0.15"/>
    <text x="620" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#27AE60">Storing voorkomen!</text>
  </g>

  <!-- Legenda onderaan -->
  <g transform="translate(100,445)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#5DADE2"/>
    <text x="20" y="12" font-size="11" fill="#555">Meten</text>

    <rect x="120" y="0" width="14" height="14" rx="3" fill="#3498DB"/>
    <text x="140" y="12" font-size="11" fill="#555">Vergelijken</text>

    <rect x="270" y="0" width="14" height="14" rx="3" fill="#1A5276"/>
    <text x="290" y="12" font-size="11" fill="#555">Beoordelen</text>
  </g>

  <!-- Bronvermelding -->
  <text x="400" y="485" text-anchor="middle" font-size="10" fill="#999">Predictive Maintenance — AIMM Module 2 (Train)</text>
</svg>
