<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dataplan Builder — AIMM Data Literacy</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const EMPTY_KPI = {
      naam: "",
      waarom: "",
      hoe: "",
      wie: "",
      wanneer: "",
      groen: "",
      rood: "",
    };

    function DataplanBuilder() {
      const [kpis, setKpis] = useState([
        { ...EMPTY_KPI },
        { ...EMPTY_KPI },
        { ...EMPTY_KPI },
      ]);
      const [activeTab, setActiveTab] = useState("invullen");

      const updateKpi = (index, field, value) => {
        setKpis(prev => {
          const updated = [...prev];
          updated[index] = { ...updated[index], [field]: value };
          return updated;
        });
      };

      const addKpi = () => {
        if (kpis.length < 5) {
          setKpis(prev => [...prev, { ...EMPTY_KPI }]);
        }
      };

      const removeKpi = (index) => {
        if (kpis.length > 1) {
          setKpis(prev => prev.filter((_, i) => i !== index));
        }
      };

      const resetAll = () => {
        setKpis([{ ...EMPTY_KPI }, { ...EMPTY_KPI }, { ...EMPTY_KPI }]);
        setActiveTab("invullen");
      };

      const score = useMemo(() => {
        let total = 0;
        let max = 0;
        kpis.forEach(kpi => {
          if (kpi.naam.trim()) {
            max += 7;
            if (kpi.naam.trim()) total++;
            if (kpi.waarom.trim()) total++;
            if (kpi.hoe.trim()) total++;
            if (kpi.wie.trim()) total++;
            if (kpi.wanneer.trim()) total++;
            if (kpi.groen.trim()) total++;
            if (kpi.rood.trim()) total++;
          }
        });
        return { total, max, pct: max > 0 ? Math.round((total / max) * 100) : 0 };
      }, [kpis]);

      const filledKpis = kpis.filter(k => k.naam.trim());

      const checks = useMemo(() => {
        const results = [];
        filledKpis.forEach(kpi => {
          if (!kpi.wie.trim()) {
            results.push({ type: "error", text: `"${kpi.naam}" heeft geen eigenaar. Geen eigenaar = dode KPI!` });
          }
          if (!kpi.groen.trim() || !kpi.rood.trim()) {
            results.push({ type: "warn", text: `"${kpi.naam}" mist een groen/rood grens.` });
          }
        });
        if (filledKpis.length === 0) {
          results.push({ type: "info", text: "Vul eerst minimaal 1 KPI in." });
        }
        if (filledKpis.length > 0 && results.length === 0) {
          results.push({ type: "ok", text: "Goed bezig! Alle KPI's hebben een eigenaar en grenzen." });
        }
        return results;
      }, [filledKpis]);

      const FIELDS = [
        { key: "naam", label: "Wat meet je?", placeholder: "Bijv. uitvalpercentage", color: "blue" },
        { key: "waarom", label: "Waarom?", placeholder: "Bijv. minder afval", color: "green" },
        { key: "hoe", label: "Hoe? (bron)", placeholder: "Bijv. tellen eind lijn", color: "yellow" },
        { key: "wie", label: "Wie is eigenaar?", placeholder: "Bijv. Jan, operator", color: "purple" },
        { key: "wanneer", label: "Hoe vaak?", placeholder: "Bijv. elke dienst", color: "red" },
      ];

      const tabs = [
        { id: "invullen", label: "1. Invullen" },
        { id: "drempels", label: "2. Drempels" },
        { id: "check", label: "3. Check" },
      ];

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <div className="bg-white border-b px-4 md:px-6 py-4">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              <div>
                <h1 className="text-xl md:text-2xl font-bold text-gray-900">Mijn Dataplan</h1>
                <p className="text-gray-500 text-sm mt-1">Maak een dataplan voor je eigen afdeling</p>
              </div>
              <button
                onClick={resetAll}
                className="px-3 py-1.5 text-sm text-gray-500 hover:text-gray-700 border rounded-lg hover:bg-gray-50 transition-colors"
              >
                Opnieuw
              </button>
            </div>
          </div>

          <div className="max-w-4xl mx-auto p-4 md:p-6">
            {/* Progress */}
            <div className="mb-6">
              <div className="flex items-center gap-2 mb-2">
                <div className="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div
                    className="h-full bg-blue-500 rounded-full transition-all duration-500"
                    style={{ width: `${score.pct}%` }}
                  />
                </div>
                <span className="text-sm text-gray-500 font-mono">{score.pct}%</span>
              </div>
            </div>

            {/* Tabs */}
            <div className="flex gap-1 bg-gray-100 rounded-lg p-1 mb-6">
              {tabs.map(tab => (
                <button
                  key={tab.id}
                  className={`flex-1 px-3 py-2 rounded-md text-sm font-medium transition-all ${
                    activeTab === tab.id
                      ? "bg-white shadow-sm text-gray-900"
                      : "text-gray-500 hover:text-gray-700"
                  }`}
                  onClick={() => setActiveTab(tab.id)}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* Tab: Invullen */}
            {activeTab === "invullen" && (
              <div className="space-y-6">
                <div className="flex items-start gap-3 p-4 bg-blue-50 rounded-xl text-sm text-blue-800">
                  <span className="text-lg flex-shrink-0">i</span>
                  <div>Kies 3 tot 5 KPI's voor je afdeling. Vul bij elke KPI alle vijf onderdelen in.</div>
                </div>

                {kpis.map((kpi, i) => (
                  <div key={i} className="bg-white rounded-xl border shadow-sm p-4 md:p-5">
                    <div className="flex items-center justify-between mb-4">
                      <span className="font-bold text-gray-900">KPI {i + 1}</span>
                      {kpis.length > 1 && (
                        <button
                          onClick={() => removeKpi(i)}
                          className="text-xs text-gray-400 hover:text-red-500 transition-colors"
                        >
                          Verwijder
                        </button>
                      )}
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {FIELDS.map(f => (
                        <div key={f.key}>
                          <label className="block text-xs font-medium text-gray-500 mb-1">{f.label}</label>
                          <input
                            type="text"
                            value={kpi[f.key]}
                            onChange={e => updateKpi(i, f.key, e.target.value)}
                            placeholder={f.placeholder}
                            className={`w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-${f.color}-500 focus:border-transparent outline-none transition-all`}
                          />
                        </div>
                      ))}
                    </div>
                    {kpi.naam.trim() && !kpi.wie.trim() && (
                      <div className="mt-3 px-3 py-2 bg-red-50 rounded-lg text-xs text-red-700 font-medium">
                        Geen eigenaar = dode KPI! Vul het veld "Wie" in.
                      </div>
                    )}
                  </div>
                ))}

                {kpis.length < 5 && (
                  <button
                    onClick={addKpi}
                    className="w-full py-3 border-2 border-dashed border-gray-300 rounded-xl text-sm text-gray-500 hover:border-blue-400 hover:text-blue-500 transition-all"
                  >
                    + KPI toevoegen (max 5)
                  </button>
                )}

                <button
                  onClick={() => setActiveTab("drempels")}
                  className="w-full py-3 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600 transition-colors"
                >
                  Volgende: drempels instellen
                </button>
              </div>
            )}

            {/* Tab: Drempels */}
            {activeTab === "drempels" && (
              <div className="space-y-6">
                <div className="flex items-start gap-3 p-4 bg-green-50 rounded-xl text-sm text-green-800">
                  <span className="text-lg flex-shrink-0">i</span>
                  <div>Stel bij elke KPI in: wanneer is het groen (goed) en wanneer rood (actie nodig)?</div>
                </div>

                {kpis.map((kpi, i) => (
                  kpi.naam.trim() ? (
                    <div key={i} className="bg-white rounded-xl border shadow-sm p-4 md:p-5">
                      <div className="font-bold text-gray-900 mb-4">{kpi.naam}</div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="flex items-center gap-2 text-sm font-medium text-green-700 mb-1">
                            <span className="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                            Groen (goed)
                          </label>
                          <input
                            type="text"
                            value={kpi.groen}
                            onChange={e => updateKpi(i, "groen", e.target.value)}
                            placeholder="Bijv. minder dan 2%"
                            className="w-full px-3 py-2 border border-green-200 rounded-lg text-sm focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none bg-green-50"
                          />
                        </div>
                        <div>
                          <label className="flex items-center gap-2 text-sm font-medium text-red-700 mb-1">
                            <span className="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                            Rood (actie!)
                          </label>
                          <input
                            type="text"
                            value={kpi.rood}
                            onChange={e => updateKpi(i, "rood", e.target.value)}
                            placeholder="Bijv. meer dan 5%"
                            className="w-full px-3 py-2 border border-red-200 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none bg-red-50"
                          />
                        </div>
                      </div>
                    </div>
                  ) : null
                ))}

                {filledKpis.length === 0 && (
                  <div className="text-center py-8 text-gray-400">
                    Ga eerst terug en vul minimaal 1 KPI in.
                  </div>
                )}

                <div className="flex gap-3">
                  <button
                    onClick={() => setActiveTab("invullen")}
                    className="flex-1 py-3 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-50 transition-colors"
                  >
                    Terug
                  </button>
                  <button
                    onClick={() => setActiveTab("check")}
                    className="flex-1 py-3 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600 transition-colors"
                  >
                    Volgende: check
                  </button>
                </div>
              </div>
            )}

            {/* Tab: Check */}
            {activeTab === "check" && (
              <div className="space-y-6">
                <div className="text-center py-4">
                  <div className="text-4xl font-bold text-blue-600">{score.pct}%</div>
                  <div className="text-sm text-gray-500 mt-1">van je dataplan is ingevuld</div>
                </div>

                {/* Checks */}
                <div className="space-y-2">
                  {checks.map((c, i) => (
                    <div
                      key={i}
                      className={`px-4 py-3 rounded-xl text-sm font-medium ${
                        c.type === "error" ? "bg-red-50 text-red-800 border border-red-200" :
                        c.type === "warn" ? "bg-yellow-50 text-yellow-800 border border-yellow-200" :
                        c.type === "ok" ? "bg-green-50 text-green-800 border border-green-200" :
                        "bg-gray-50 text-gray-600 border border-gray-200"
                      }`}
                    >
                      {c.type === "error" && "X  "}
                      {c.type === "warn" && "!  "}
                      {c.type === "ok" && "V  "}
                      {c.text}
                    </div>
                  ))}
                </div>

                {/* Overzicht tabel */}
                {filledKpis.length > 0 && (
                  <div className="bg-white rounded-xl border shadow-sm overflow-hidden">
                    <div className="bg-gray-900 text-white px-4 py-3 text-sm font-bold">
                      Jouw Dataplan
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="bg-gray-50 border-b">
                            <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">KPI</th>
                            <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Waarom</th>
                            <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Hoe</th>
                            <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Wie</th>
                            <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Wanneer</th>
                            <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Groen</th>
                            <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Rood</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filledKpis.map((kpi, i) => (
                            <tr key={i} className={i % 2 === 0 ? "bg-white" : "bg-gray-50"}>
                              <td className="px-3 py-2 font-medium text-gray-900">{kpi.naam}</td>
                              <td className="px-3 py-2 text-gray-600">{kpi.waarom || "—"}</td>
                              <td className="px-3 py-2 text-gray-600">{kpi.hoe || "—"}</td>
                              <td className={`px-3 py-2 font-medium ${kpi.wie.trim() ? "text-green-700" : "text-red-600"}`}>
                                {kpi.wie || "GEEN!"}
                              </td>
                              <td className="px-3 py-2 text-gray-600">{kpi.wanneer || "—"}</td>
                              <td className="px-3 py-2">
                                {kpi.groen ? (
                                  <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs bg-green-100 text-green-700">{kpi.groen}</span>
                                ) : "—"}
                              </td>
                              <td className="px-3 py-2">
                                {kpi.rood ? (
                                  <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs bg-red-100 text-red-700">{kpi.rood}</span>
                                ) : "—"}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* Gouden regel */}
                <div className="px-4 py-3 bg-yellow-50 border border-yellow-200 rounded-xl text-sm text-yellow-800">
                  <span className="font-bold">Onthoud:</span> Een KPI zonder eigenaar is een dode KPI. Begin klein. Maak het zichtbaar. Bespreek het met je team.
                </div>

                <div className="flex gap-3">
                  <button
                    onClick={() => setActiveTab("drempels")}
                    className="flex-1 py-3 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-50 transition-colors"
                  >
                    Terug
                  </button>
                  <button
                    onClick={resetAll}
                    className="flex-1 py-3 bg-gray-100 text-gray-600 rounded-lg font-medium hover:bg-gray-200 transition-colors"
                  >
                    Opnieuw beginnen
                  </button>
                </div>

                <div className="text-center text-xs text-gray-400 pt-4">
                  Bron: Dataplan-framework | AIMM Data Literacy Module 3
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<DataplanBuilder />);
  </script>
</body>
</html>
