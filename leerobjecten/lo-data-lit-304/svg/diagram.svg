<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 620"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Dataplan voor je afdeling</title>
  <desc id="desc">Een diagram dat de vijf onderdelen van een dataplan laat zien: wat je meet (KPI), waarom je het meet, hoe je het meet (bron), wie de eigenaar is en wanneer je kijkt (frequentie). Onderaan staat een voorbeeld met drempelwaarden in groen, oranje en rood.</desc>

  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#3498DB"/>
    </linearGradient>
    <linearGradient id="example-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#EEF0F2"/>
    </linearGradient>
  </defs>

  <!-- Achtergrond -->
  <rect role="presentation" width="900" height="620" fill="#FAFAF8" rx="12"/>

  <!-- Titel -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50" letter-spacing="1">Dataplan voor je afdeling</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#7f8c8d" letter-spacing="0.5">Vijf onderdelen die je nodig hebt</text>

  <!-- ============================================ -->
  <!-- VIJF KAARTEN: de onderdelen van het dataplan -->
  <!-- ============================================ -->

  <!-- Kaart 1: WAT -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="155" height="150" rx="10" fill="white" stroke="#3498DB" stroke-width="2"/>
    <rect x="40" y="90" width="155" height="38" rx="10" fill="#3498DB"/>
    <rect x="40" y="118" width="155" height="10" fill="#3498DB"/>
    <text x="117" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="white">WAT</text>
    <text x="117" y="152" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">Welke KPI</text>
    <text x="117" y="168" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">meet je?</text>
    <text x="117" y="195" text-anchor="middle" font-size="10" fill="#7f8c8d">Bijv. uitval,</text>
    <text x="117" y="210" text-anchor="middle" font-size="10" fill="#7f8c8d">snelheid, kwaliteit</text>
  </g>

  <!-- Kaart 2: WAAROM -->
  <g filter="url(#shadow)">
    <rect x="210" y="90" width="155" height="150" rx="10" fill="white" stroke="#2ECC71" stroke-width="2"/>
    <rect x="210" y="90" width="155" height="38" rx="10" fill="#27AE60"/>
    <rect x="210" y="118" width="155" height="10" fill="#27AE60"/>
    <text x="287" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="white">WAAROM</text>
    <text x="287" y="152" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">Waarom is dit</text>
    <text x="287" y="168" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">belangrijk?</text>
    <text x="287" y="195" text-anchor="middle" font-size="10" fill="#7f8c8d">Bijv. minder afval,</text>
    <text x="287" y="210" text-anchor="middle" font-size="10" fill="#7f8c8d">sneller leveren</text>
  </g>

  <!-- Kaart 3: HOE -->
  <g filter="url(#shadow)">
    <rect x="380" y="90" width="155" height="150" rx="10" fill="white" stroke="#E67E22" stroke-width="2"/>
    <rect x="380" y="90" width="155" height="38" rx="10" fill="#E67E22"/>
    <rect x="380" y="118" width="155" height="10" fill="#E67E22"/>
    <text x="457" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="white">HOE</text>
    <text x="457" y="152" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">Waar komt de</text>
    <text x="457" y="168" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">data vandaan?</text>
    <text x="457" y="195" text-anchor="middle" font-size="10" fill="#7f8c8d">Bijv. sensor, tellen,</text>
    <text x="457" y="210" text-anchor="middle" font-size="10" fill="#7f8c8d">logboek, systeem</text>
  </g>

  <!-- Kaart 4: WIE -->
  <g filter="url(#shadow)">
    <rect x="550" y="90" width="155" height="150" rx="10" fill="white" stroke="#9B59B6" stroke-width="2"/>
    <rect x="550" y="90" width="155" height="38" rx="10" fill="#8E44AD"/>
    <rect x="550" y="118" width="155" height="10" fill="#8E44AD"/>
    <text x="627" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="white">WIE</text>
    <text x="627" y="152" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">Wie is de</text>
    <text x="627" y="168" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">eigenaar?</text>
    <text x="627" y="195" text-anchor="middle" font-size="10" fill="#7f8c8d">Geen eigenaar =</text>
    <text x="627" y="210" text-anchor="middle" font-size="10" fill="#7f8c8d">dode KPI!</text>
  </g>

  <!-- Kaart 5: WANNEER -->
  <g filter="url(#shadow)">
    <rect x="720" y="90" width="155" height="150" rx="10" fill="white" stroke="#E74C3C" stroke-width="2"/>
    <rect x="720" y="90" width="155" height="38" rx="10" fill="#C0392B"/>
    <rect x="720" y="118" width="155" height="10" fill="#C0392B"/>
    <text x="797" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="white">WANNEER</text>
    <text x="797" y="152" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">Hoe vaak</text>
    <text x="797" y="168" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">kijk je ernaar?</text>
    <text x="797" y="195" text-anchor="middle" font-size="10" fill="#7f8c8d">Bijv. elke dienst,</text>
    <text x="797" y="210" text-anchor="middle" font-size="10" fill="#7f8c8d">dagelijks, wekelijks</text>
  </g>

  <!-- Pijl naar voorbeeld -->
  <line x1="450" y1="252" x2="450" y2="278" stroke="#BDC3C7" stroke-width="2"/>
  <polygon points="443,275 457,275 450,285" fill="#BDC3C7"/>

  <!-- ============================================ -->
  <!-- VOORBEELD: een ingevuld dataplan-regel        -->
  <!-- ============================================ -->

  <text x="450" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#2C3E50" letter-spacing="0.5">Voorbeeld: uitvalpercentage</text>

  <!-- Voorbeeld tabel -->
  <g filter="url(#shadow)">
    <!-- Header -->
    <rect x="40" y="322" width="820" height="36" rx="8" fill="url(#header-grad)"/>
    <text x="120" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="white">WAT</text>
    <text x="280" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="white">WAAROM</text>
    <text x="440" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="white">HOE</text>
    <text x="600" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="white">WIE</text>
    <text x="770" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="white">WANNEER</text>

    <!-- Kolom lijnen in header -->
    <line x1="200" y1="326" x2="200" y2="354" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="360" y1="326" x2="360" y2="354" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="520" y1="326" x2="520" y2="354" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="680" y1="326" x2="680" y2="354" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Data rij -->
    <rect x="40" y="358" width="820" height="48" fill="url(#example-grad)"/>
    <rect x="40" y="406" width="820" height="1" fill="#E0E0E0" rx="0"/>
    <text x="120" y="386" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">Uitval %</text>
    <text x="280" y="386" text-anchor="middle" font-size="10" fill="#555">Minder afval</text>
    <text x="440" y="386" text-anchor="middle" font-size="10" fill="#555">Tellen eind lijn</text>
    <text x="600" y="386" text-anchor="middle" font-size="10" fill="#555">Jan (operator)</text>
    <text x="770" y="386" text-anchor="middle" font-size="10" fill="#555">Elke dienst</text>

    <!-- Kolom lijnen in data -->
    <line x1="200" y1="358" x2="200" y2="406" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="360" y1="358" x2="360" y2="406" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="520" y1="358" x2="520" y2="406" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="680" y1="358" x2="680" y2="406" stroke="#E0E0E0" stroke-width="1"/>

    <!-- Afronding onderkant -->
    <rect x="40" y="398" width="820" height="8" fill="url(#example-grad)" rx="0"/>
    <rect x="40" y="400" width="820" height="8" rx="0 0 8 8" fill="url(#example-grad)"/>
  </g>

  <!-- ============================================ -->
  <!-- DREMPELS: groen / oranje / rood              -->
  <!-- ============================================ -->

  <text x="450" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#2C3E50" letter-spacing="0.5">Drempels: wanneer is het goed of slecht?</text>

  <!-- Drempel blokken -->
  <g filter="url(#shadow)">
    <!-- Groen -->
    <rect x="80" y="458" width="220" height="70" rx="10" fill="#ECFDF5" stroke="#27AE60" stroke-width="2"/>
    <circle cx="110" cy="493" r="14" fill="#27AE60"/>
    <text x="110" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="white">V</text>
    <text x="205" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#27AE60">GROEN</text>
    <text x="205" y="502" text-anchor="middle" font-size="11" fill="#2C3E50">Minder dan 2%</text>
    <text x="205" y="518" text-anchor="middle" font-size="10" fill="#7f8c8d">Goed. Doorgaan.</text>
  </g>

  <g filter="url(#shadow)">
    <!-- Oranje -->
    <rect x="340" y="458" width="220" height="70" rx="10" fill="#FFFBEB" stroke="#E67E22" stroke-width="2"/>
    <circle cx="370" cy="493" r="14" fill="#E67E22"/>
    <text x="370" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="white">!</text>
    <text x="465" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#E67E22">ORANJE</text>
    <text x="465" y="502" text-anchor="middle" font-size="11" fill="#2C3E50">Tussen 2% en 5%</text>
    <text x="465" y="518" text-anchor="middle" font-size="10" fill="#7f8c8d">Let op. Onderzoek.</text>
  </g>

  <g filter="url(#shadow)">
    <!-- Rood -->
    <rect x="600" y="458" width="220" height="70" rx="10" fill="#FEF2F2" stroke="#E74C3C" stroke-width="2"/>
    <circle cx="630" cy="493" r="14" fill="#E74C3C"/>
    <text x="630" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="white">X</text>
    <text x="725" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#E74C3C">ROOD</text>
    <text x="725" y="502" text-anchor="middle" font-size="11" fill="#2C3E50">Meer dan 5%</text>
    <text x="725" y="518" text-anchor="middle" font-size="10" fill="#7f8c8d">Actie! Meld het.</text>
  </g>

  <!-- Waarschuwing onderaan -->
  <rect role="presentation" x="200" y="550" width="500" height="32" rx="8" fill="#FEF2F2" stroke="#E74C3C" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="450" y="571" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">Geen eigenaar = dode KPI</text>

  <!-- Bron -->
  <text x="450" y="605" text-anchor="middle" font-size="10" fill="#999">Dataplan-framework | AIMM Data Literacy Module 3</text>
</svg>
